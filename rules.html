<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>State 646 — State Rules</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0d0f14;--bg2:#161920;--bg3:#1e2230;--bg4:#252a3a;
  --border:#2a2d3e;--text:#e8eaf0;--muted:#8890a6;--muted2:#5a6280;
  --accent:#4f8ef7;--amber:#fbbf24;--green:#34d399;--red:#f87171;
  --orange:#fb923c;--purple:#a78bfa;
  --radius:10px;--radius-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:4rem}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-link{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;font-size:13px;transition:color .12s}
.back-link:hover{color:var(--text)}
.header-divider{color:var(--border);font-size:18px}
.logo{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:600}
.logo i{color:var(--orange);font-size:20px}
.header-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.state-label{font-size:12px;color:var(--muted)}

/* Language switcher */
.lang-switch{position:relative}
.lang-current{background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:14px;padding:6px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:border .12s}
.lang-current:hover{border-color:var(--accent)}
.lang-current i{font-size:13px;color:var(--muted)}
.lang-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:6px;min-width:170px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);display:none}
[dir="rtl"] .lang-menu{right:auto;left:0}
.lang-menu.open{display:block}
.lang-option{display:flex;align-items:center;gap:10px;width:100%;background:none;border:none;color:var(--text);font-size:13px;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left}
[dir="rtl"] .lang-option{text-align:right}
.lang-option:hover{background:var(--bg4)}
.lang-option.active{background:rgba(79,142,247,.12);color:var(--accent)}
.lang-flag{font-size:16px}

.main{max-width:780px;margin:0 auto;padding:2rem}

.page-title{margin-bottom:2rem}
.page-title h2{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;margin-bottom:.4rem;display:flex;align-items:center;gap:10px}
.page-title h2 i{color:var(--orange);font-size:26px}
.page-title p{font-size:13px;color:var(--muted);line-height:1.5}

.nap-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:2rem}
.nap-badge{font-size:12px;font-weight:600;padding:4px 12px;border-radius:99px;border:1px solid var(--border);background:var(--bg2);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.nap-badge .dot{width:8px;height:8px;border-radius:50%}

.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);margin-bottom:12px;margin-top:2rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.section-label i{font-size:14px}

.rules-list{display:flex;flex-direction:column;gap:8px}
.rule{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;display:flex;gap:14px;align-items:flex-start;transition:border .12s}
[dir="rtl"] .rule{flex-direction:row-reverse}
.rule:hover{border-color:var(--bg4)}
.rule.critical{border-left:3px solid var(--red)}
.rule.warning{border-left:3px solid var(--orange)}
.rule.info{border-left:3px solid var(--accent)}
[dir="rtl"] .rule.critical{border-left:none;border-right:3px solid var(--red)}
[dir="rtl"] .rule.warning{border-left:none;border-right:3px solid var(--orange)}
[dir="rtl"] .rule.info{border-left:none;border-right:3px solid var(--accent)}
.rule-num{font-size:11px;font-weight:700;color:var(--muted2);min-width:22px;padding-top:2px;flex-shrink:0}
.rule-body{flex:1;min-width:0}
.rule-text{font-size:13px;line-height:1.75;color:var(--text)}
.rule-note{font-size:12px;color:var(--muted);margin-top:6px;padding:6px 10px;background:var(--bg3);border-radius:6px;display:flex;align-items:flex-start;gap:6px;line-height:1.6}
[dir="rtl"] .rule-note{flex-direction:row-reverse}
.rule-note i{font-size:13px;flex-shrink:0;margin-top:1px}
.rule-tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:99px;margin-bottom:6px}
.tag-critical{background:rgba(248,113,113,.12);color:var(--red);border:1px solid rgba(248,113,113,.25)}
.tag-warning{background:rgba(251,146,60,.1);color:var(--orange);border:1px solid rgba(251,146,60,.25)}
.tag-info{background:rgba(79,142,247,.1);color:var(--accent);border:1px solid rgba(79,142,247,.2)}
</style>
</head>

function buildLangMenu(current){
  const menu = document.getElementById("langMenu");
  menu.innerHTML = "";
  Object.keys(translations).forEach(code => {
    const d = translations[code];
    const btn = document.createElement("button");
    btn.className = "lang-option" + (code === current ? " active" : "");
    btn.innerHTML = `<span class="lang-flag">${d.flag}</span><span>${d.name}</span>`;
    btn.onclick = () => { render(code); localStorage.setItem("state646_lang", code); };
    menu.appendChild(btn);
  });
}

function render(lang){
  const d = translations[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = d.dir;
  document.getElementById("pageTitleText").textContent = d.title;
  document.getElementById("pageSubtitle").textContent = d.subtitle;
  document.getElementById("sectionLabelText").textContent = d.sectionLabel;
  document.getElementById("homeText").textContent = d.home;
  document.getElementById("logoText").textContent = d.logo;
  document.getElementById("langBtn").innerHTML = d.flag + ' <i class="ti ti-chevron-down"></i>';

  const list = document.getElementById("rulesList");
  list.innerHTML = "";
  d.rules.forEach((r, i) => {
    const meta = ruleMeta[i];
    const div = document.createElement("div");
    div.className = "rule " + meta.type;
    let tagHtml = "";
    if(meta.tag){
      tagHtml = `<span class="rule-tag tag-${meta.type}"><i class="ti ${iconMap[meta.tag]}"></i> ${d.tags[meta.tag]}</span>`;
    }
    let noteHtml = "";
    if(r.note){
      noteHtml = `<div class="rule-note"><i class="ti ti-info-circle"></i> ${r.note}</div>`;
    }
    div.innerHTML = `<span class="rule-num">${i+1}</span><div class="rule-body">${tagHtml}<div class="rule-text">${r.text}</div>${noteHtml}</div>`;
    list.appendChild(div);
  });

  buildLangMenu(lang);
  document.getElementById("langMenu").classList.remove("open");
}

document.addEventListener("click", (e) => {
  const switcher = document.querySelector(".lang-switch");
  if(!switcher.contains(e.target)) document.getElementById("langMenu").classList.remove("open");
});

const savedLang = localStorage.getItem("state646_lang");
render(savedLang && translations[savedLang] ? savedLang : "en");
</script>
