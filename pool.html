<style>
  :root{
    --bg:#070b15;
    --bg-2:#0a0f1c;
    --panel:#0f1626;
    --panel-2:#141d33;
    --border:#1f2c47;
    --border-soft:#182236;
    --ice:#6fe3ff;
    --ice-dim:#3a8fae;
    --frost:#4f7cff;
    --gold:#ffb400;
    --silver:#9fb2cc;
    --text:#e7edf7;
    --text-dim:#8a9bbd;
    --text-faint:#5b6c8c;
    --state646:#ffb400;
    --state657:#7f8fb0;
    --good:#43e6a0;
    --danger:#ff5d73;
    --strong:#fff;
    --stk-sel:#122338;
    --hit-hover:#18233d;
    --on-ice:#00151c;
    --halo:#0f1626;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f3f6fb;
    --bg-2:#eaeff7;
    --panel:#ffffff;
    --panel-2:#eef2f9;
    --border:#cdd6e5;
    --border-soft:#e1e7f1;
    --ice:#0b7fa6;
    --ice-dim:#4f93ad;
    --frost:#3b62d9;
    --gold:#a86f00;
    --silver:#6b7d99;
    --text:#16213a;
    --text-dim:#4a5b7b;
    --text-faint:#7384a3;
    --state646:#c98600;
    --state657:#6b7d99;
    --good:#0e9a68;
    --danger:#d02e48;
    --strong:#0b1426;
    --stk-sel:#dcebf6;
    --hit-hover:#e6edf8;
    --on-ice:#ffffff;
    --halo:#ffffff;
    color-scheme:light;
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(11,127,166,0.07), transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] tbody tr:hover{background:rgba(11,127,166,0.06);}
  :root[data-theme="light"] tbody tr.row-sel{background:rgba(11,127,166,0.10);}
  :root[data-theme="light"] .sel-bar{box-shadow:0 -6px 24px rgba(20,35,70,.18);}
  :root[data-theme="light"] #tooltip{background:rgba(255,255,255,.98);box-shadow:0 12px 36px rgba(20,35,70,.22);}
  :root[data-theme="light"] .btn{background:linear-gradient(180deg, rgba(11,127,166,.14), rgba(11,127,166,.04));}
  :root[data-theme="light"] .sx-chip{background:rgba(20,35,70,.03);}
  :root[data-theme="light"] .ttq,:root[data-theme="light"] .phase-note{background:rgba(11,127,166,.05);}
  :root[data-theme="light"] .state-bar .seg.s657{background:linear-gradient(180deg,#8d9db8,#6b7d99);color:#fff;}
  :root[data-theme="light"] .switch input:checked + .switch-track{background:rgba(201,134,0,.2);}
  /* theme toggle (top right) */
  header{position:relative;}
  .theme-toggle{position:absolute;top:0;right:0;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;padding:0;}
  .theme-toggle:hover{color:var(--strong);border-color:var(--ice-dim);}
  .theme-toggle svg{width:19px;height:19px;display:block;}
  .theme-toggle .i-sun{display:none;}
  .sitenav{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;padding:5px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;font-weight:600;letter-spacing:.09em;scrollbar-width:none;}
  .sitenav::-webkit-scrollbar{display:none;}
  .sitenav > a,.sitenav > span{padding:6px 13px;border-radius:7px;color:var(--text-dim);text-decoration:none;white-space:nowrap;}
  .sitenav a:hover{color:var(--strong);background:rgba(120,140,190,.14);}
  .sitenav > .cur{color:var(--gold);background:rgba(255,180,0,.12);box-shadow:inset 0 -2px 0 var(--gold);}
  .sitenav .sn-s{display:none;}
  @media (max-width:640px){ .sitenav .sn-l{display:none;} .sitenav .sn-s{display:inline;} .sitenav > a,.sitenav > span{padding:6px 10px;} }
  .refresh-btn{right:46px;}
  .refresh-btn svg{width:18px;height:18px;}
  .refresh-btn.spin svg{animation:rfspin .8s linear infinite;}
  .refresh-btn.ok{color:#2fbf71;border-color:#2fbf71;}
  @keyframes rfspin{to{transform:rotate(360deg);}}
  :root[data-theme="light"] .theme-toggle .i-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,227,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ice-dim);
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ice-dim);display:inline-block;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  h1 span{color:var(--ice);}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}

  .divider{width:100%;height:1px;background:var(--border);margin:18px 0 26px;}

  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{
    position:relative;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--ice-dim);}
  .tab.active{
    color:var(--ice);
    background:linear-gradient(180deg, rgba(111,227,255,0.10), rgba(111,227,255,0.02));
    border-color:var(--ice);
    box-shadow:0 0 0 1px rgba(111,227,255,.15), 0 0 18px rgba(111,227,255,.12);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
  }
  select,input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    min-width:150px;
  }
  select:focus,input:focus{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    letter-spacing:.03em;
    border-radius:4px;
    cursor:pointer;
    transition:all .12s;
  }
  .seg button:hover{color:var(--text);border-color:var(--ice-dim);}
  .seg button.nodata{opacity:.5;}
  .seg button.active{
    color:var(--on-ice);
    background:var(--ice);
    border-color:var(--ice);
    font-weight:600;
  }
  .count-pill{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
  }

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--ice);}
  thead th.sorted{color:var(--ice);}
  thead th .arrow{font-size:10px;margin-left:4px;opacity:.8;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:rgba(111,227,255,0.04);}
  tbody td{padding:9px 12px;color:var(--text);}
  td.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:var(--text);}
  .namecell{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .days{display:inline-flex;gap:4px;flex:none;}
  body.nodots .days{display:none;}
  .sw-pair{display:inline-flex;align-items:center;gap:22px;align-self:flex-end;flex-wrap:wrap;}
  .sw-pair .switch{width:auto !important;align-self:center;}
  @media (max-width:640px){ .sw-pair{align-self:flex-start;} .switch.dots-sw, .switch.whale-sw, .switch.av-sw{justify-content:flex-start;align-self:flex-start;width:auto;padding:2px 0;} }
  .rt{display:inline-flex;align-items:center;gap:10px;flex:none;}
  .wins{display:inline-flex;gap:1px;align-items:center;padding:2px 8px;border:1px solid var(--border);border-radius:999px;vertical-align:middle;}
  .ws{width:14px;height:14px;display:block;}
  .nm{display:inline-flex;align-items:center;gap:6px;min-width:0;}
  .medals{display:inline-flex;gap:3px;flex:none;}
  .medal{width:17px;height:17px;display:block;}
  @media (max-width:640px){
    .namecell{flex-direction:column;align-items:flex-start;gap:5px;}
    .nm .nt{max-width:96px;overflow:hidden;text-overflow:ellipsis;}
    #tableWrap th.stk, #tableWrap td.stk{position:sticky;z-index:1;background:var(--panel);padding-left:5px;padding-right:5px;}
    #tableWrap thead th.stk{z-index:3;}
    #tableWrap tr.row-sel td.stk{background:var(--stk-sel);}
    #tableWrap td.stk.name-stk{box-shadow:1px 0 0 var(--border);}
    #tableWrap tr.rank-cutoff td{border-bottom:0;box-shadow:inset 0 -2px 0 var(--danger);}
    #tableWrap tr.rank-cutoff td.stk.name-stk{box-shadow:1px 0 0 var(--border), inset 0 -2px 0 var(--danger);}
    #tableWrap th.selcol.stk, #tableWrap td.selcol.stk{padding-left:8px;padding-right:2px;}
  }
  .dd{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-faint);box-sizing:border-box;}
  .dd.on{background:var(--ice);border-color:var(--ice);}
  .dd.na{opacity:.3;border-style:dashed;}
  td.srank{color:var(--ice-dim);}
  td.rank{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--text-dim);width:44px;}
  .row-646{border-left:2px solid var(--state646);}
  .row-646 td.name{font-weight:700;color:var(--strong);}
  .row-nb td.name{font-weight:700;color:var(--strong);}
  .row-646 td.state{color:var(--state646);font-weight:700;}
  .row-away td.state{color:var(--state657);}
  tbody tr.rank-cutoff td{border-bottom:2px solid var(--danger);}
  .tag{
    display:inline-block;
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
    font-size:11.5px;
    padding:2px 9px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  .tag.tag-c{font-weight:600;}
  .ps{display:none;}
  @media (max-width:480px){ .pf{display:none;} .ps{display:inline;} }
  .sx-vl{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;}
  .hl-sec{margin-top:24px;}
  .hl-sec h3{font-size:14px;font-weight:700;color:var(--strong);margin:0 0 3px;}
  .hl-sub{font-size:12px;color:var(--text-faint);margin:0 0 10px;line-height:1.45;}
  .hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hl-grid .sx-card{margin-top:0;}
  @media (max-width:820px){ .hl-grid{grid-template-columns:1fr;} }
  .sx-card.hl-card table{min-width:0;table-layout:auto;}
  .sx-card.hl-card th:first-child{width:auto;}
  .hl-card td.nm2{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sx-card th.ctr, .sx-card td.ctr{text-align:center;width:56px;}
  .medal-w{display:inline-block;vertical-align:middle;line-height:0;}
  .hl-nm{display:flex;align-items:center;gap:7px;min-width:0;}
  .hl-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .hl-nm .tag{flex:none;}
  .hl-up{color:var(--good);} .hl-down{color:var(--danger);}
  .hl-bars{display:flex;flex-direction:column;gap:10px;}
  .hl-bar-row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;font-size:12px;color:var(--text-dim);}
  .hl-bar-row .cseg{transition:none;}
  .linkbtn{background:none;border:0;padding:0;color:var(--ice);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px;}
  .linkbtn:hover{color:var(--strong);}
  .cons-ctl{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end;margin:14px 0 10px;}
  .cons-ctl .field input{min-width:160px;}
  .cons-count{font-size:12px;color:var(--text-faint);margin:2px 0 8px;}
  .sx-card.cons-card table{min-width:760px;table-layout:auto;}
  .sx-card.cons-card th:first-child{width:auto;}
  .cons-card td.nm2{max-width:230px;}
  .cons-card td.nm2 .hl-nm{min-width:0;}
  .cons-open{background:none;border:0;padding:0;margin:0;color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .cons-open:hover{color:var(--ice);text-decoration:underline;}
  .cons-card .cons-ev{text-align:center;white-space:nowrap;}
  .cons-card td.cons-top{color:var(--ice);font-weight:600;}
  .hof-by{white-space:nowrap;}
  .wt{display:inline-flex;vertical-align:middle;background:none;border:0;padding:0 0 0 4px;cursor:help;}
  .wt svg{display:block;}
  .wt-pop{position:fixed;z-index:300;padding:10px 12px;background:var(--panel);border:1px solid #d9263a;border-radius:8px;color:var(--text);font-size:12.5px;line-height:1.45;box-shadow:0 10px 30px rgba(0,0,0,.4);pointer-events:none;}
  .av{width:22px;height:22px;border-radius:50%;object-fit:cover;flex:none;vertical-align:middle;margin-right:6px;background:var(--border);}
  .av.ph{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text-dim);background:var(--border);}
  .av.sp{display:inline-block;visibility:hidden;}
  .tt-head .av.ph{font-size:16px;}
  .pres-big .av.ph{font-size:18px;}
  .tt-head .av{width:36px;height:36px;margin-right:2px;}
  .pres-big .av{width:40px;height:40px;}
  body.whale-on tr.row-whale .av{display:none;}
  .whale-i{display:none;height:26px;width:auto;vertical-align:middle;}
  body.whale-on tr .whale-i{display:inline-block;}
  body.whale-on tr.row-whale .nt{display:none;}
  .whale-lbl{height:20px;width:auto;vertical-align:middle;}
  .pres-i{height:19px;width:auto;margin-left:5px;vertical-align:middle;flex:none;}
  .pres-hero{display:flex;align-items:center;gap:16px;padding:16px 18px;border-bottom:1px solid var(--border);}
  .pres-kicker{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .pres-big{font-size:20px;font-weight:700;color:var(--strong);margin:2px 0;}
  .pres-big .pres-open{font-size:20px;font-weight:700;}
  .pres-sub{font-size:12.5px;color:var(--text-dim);}
  .pres-stats{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);}
  .pres-tile{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;}
  .pres-tile b{display:block;font-size:18px;color:var(--strong);line-height:1.1;}
  .pres-tile span{font-size:11.5px;color:var(--text-faint);}
  .pres-none-i{width:26px;text-align:center;font-size:20px;color:var(--text-faint);}
  .pres-open{background:none;border:0;padding:0;margin:0;color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-align:left;}
  .pres-open:hover{color:var(--ice);text-decoration:underline;}
  .pres-stats-note{flex:1 1 100%;font-size:11.5px;color:var(--text-faint);}
  .pres-koi-sw{margin-left:auto;}
  .pres-card tr.pres-koi td{background:rgba(120,140,190,.06);}
  .inv-ring{display:inline-flex;align-items:center;justify-content:center;box-sizing:content-box;padding:3px;border:2.5px solid var(--danger);border-radius:50%;background:rgba(217,38,58,.14);vertical-align:middle;}
  .inv-w{color:var(--danger);font-weight:700;}
  .pres-card tr.pres-lost td .pres-off .inv-w{color:var(--danger);}
  .pres-card .pres-no{text-align:center;color:var(--text-dim);font-variant-numeric:tabular-nums;width:48px;}
  .pres-tile small{font-size:12px;font-weight:400;color:var(--text-faint);}
  .pres-unk{color:var(--text-faint);font-style:italic;}
  .pres-res{white-space:nowrap;}
  .pres-part{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;margin-right:4px;border:1px solid var(--border);}
  .pres-part.won{color:var(--good);border-color:var(--good);}
  .pres-part.lost{color:var(--text-faint);text-decoration:line-through;}
  @media (max-width:640px){.pres-card .pres-res{width:54px;padding-left:4px;padding-right:6px;}.pres-part{display:block;margin:0 0 3px;padding:0 4px;font-size:10px;text-align:center;}.pres-card th:last-child{font-size:10px;padding-left:4px;padding-right:6px;}}
  .pres-off{font-size:11.5px;color:var(--text-faint);margin-top:2px;}
  .sx-card.pres-card table{min-width:0;table-layout:auto;}
  .sx-card.pres-card th:first-child{width:56px;}
  .pres-card td{vertical-align:middle;}
  .pres-card td:nth-child(2){white-space:nowrap;}
  @media (max-width:640px){ .pres-card .hl-nm{flex-wrap:wrap;gap:3px 6px;} .sx-card.pres-card th:first-child{width:38px;} .pres-card th,.pres-card td{padding-left:6px;padding-right:6px;} .pres-card td.pres img{height:26px;} }
  .pres-card tr.pres-lost td{color:var(--text-faint);font-size:12.5px;}
  .sx-card.sx-st table{min-width:1060px;}
  .sx-card.sx-st th:nth-child(3){width:84px;}
  @media (max-width:900px){
    .sx-card.sx-st th:first-child, .sx-card.sx-st td:first-child{position:sticky;left:0;z-index:1;background:var(--panel);}
    .sx-card.sx-st th:nth-child(2), .sx-card.sx-st td:nth-child(2){position:sticky;left:52px;z-index:1;background:var(--panel);box-shadow:1px 0 0 var(--border);}
  }
  .sx-card.sx-st th:first-child{width:52px;}
  .sx-card.sx-st th:nth-child(2){width:116px;}
  .sx-card td.pres{text-align:center;padding-top:3px;padding-bottom:3px;}
  .sx-card td.pres img{height:30px;width:auto;display:block;margin:0 auto;}
  .hof-pts{color:var(--text-dim);}
  .hof-pts.on{color:var(--ice);font-weight:700;}
  .hof-ptsh{color:var(--ice);}
  .sx-card.hof-med table{min-width:0;}
  @media (max-width:640px){ .hof-med th:first-child, .hof-med td:first-child{width:150px;max-width:150px;} }
  .hof-pod table{min-width:640px;}
  .hof-pod td.nm2{max-width:240px;}
  .hof-opp{opacity:.7;}
  .hof-pod th .medal, .hof-pod th svg{vertical-align:middle;}
  .cons-more{margin-top:12px;text-align:center;}
  @media (max-width:640px){
    .cons-ctl .field{flex:1 1 calc(50% - 8px);min-width:130px;}
    .cons-ctl .field input, .cons-ctl .field select{width:100%;}
    .cons-card th:first-child, .cons-card td:first-child{position:sticky;left:0;z-index:1;background:var(--panel);max-width:150px;}
    .cons-card th:first-child{background:var(--panel-2);}
  }
  .hl-ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:4px;}
  .pm-row{display:grid;grid-template-columns:130px 1fr;gap:10px;align-items:center;padding:7px 14px;border-top:1px solid var(--border-soft);font-size:12.5px;}
  .pm-row:first-of-type{border-top:0;}
  .pm-bar{display:flex;height:20px;border-radius:4px;overflow:hidden;border:1px solid var(--border);}
  .pm-bar div{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#06121f;overflow:hidden;}
  @media (max-width:640px){ .pm-row{grid-template-columns:1fr;gap:5px;} .hl-bar-row{grid-template-columns:1fr;gap:4px;} }
  .sx-share-note{padding:8px 14px;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--border-soft);}
  .empty{
    text-align:center;
    color:var(--text-faint);
    padding:40px 0;
    font-size:13px;
  }

  /* row selection + running total (Player / Alliance tabs) */
  th.selcol,td.selcol{width:34px;padding-left:10px;padding-right:0;text-align:center;}
  input.rowsel,input#selAll{accent-color:var(--ice);width:15px;height:15px;cursor:pointer;vertical-align:middle;margin:0;}
  tbody tr.row-sel{background:rgba(111,227,255,0.08);}
  #selTotal{position:sticky;bottom:12px;z-index:50;margin-top:14px;}  /* below modal (100) and tooltip (200) */
  .sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 16px;background:var(--panel-2);border:1px solid var(--ice-dim);border-radius:10px;box-shadow:0 -6px 24px rgba(0,0,0,.45);}
  .sel-total{font-size:16px;color:var(--text);}
  .sel-total b{color:var(--ice);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}
  .sel-meta{font-size:12.5px;color:var(--text-dim);}
  .sel-compare{margin-left:auto;background:var(--ice);color:var(--on-ice);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
  .sel-compare:hover{filter:brightness(1.1);}
  .sel-clear{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;}
  .sel-clear:hover{color:var(--ice);border-color:var(--ice-dim);}

  /* state share stat bar */
  .state-stats{margin-bottom:16px;}
  .state-stats-labels{
    display:flex;justify-content:space-between;
    font-size:12px;color:var(--text-dim);margin-bottom:6px;
  }
  .state-stats-labels b{font-weight:700;}
  .state-stats-labels .l646{color:var(--state646);}
  .state-stats-labels .l657{color:var(--state657);}
  .state-bar{
    display:flex;width:100%;height:22px;border-radius:4px;overflow:hidden;
    border:1px solid var(--border);background:var(--panel-2);
  }
  .state-bar .seg{
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-family:'Inter',sans-serif;
    white-space:nowrap;overflow:hidden;
    transition:width .25s ease;
  }
  .state-bar .seg.s646{background:linear-gradient(180deg, var(--state646), #cc8f00);color:#231400;}
  .state-bar .seg.s657{background:linear-gradient(180deg, #5c6f92, #3d4c6b);color:#eef1f8;}

  /* chests */
  .chest-config{
    display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;
    margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);
  }
  .slider-block{flex:1;min-width:260px;}
  .slider-labels{display:flex;justify-content:space-between;font-family:'Inter',sans-serif;font-size:12.5px;margin-bottom:8px;}
  .slider-labels .a{color:var(--ice);}
  .slider-labels .b{color:var(--frost);}
  input[type="range"]{
    width:100%;height:4px;-webkit-appearance:none;appearance:none;
    background:linear-gradient(90deg, var(--ice), var(--frost));
    border-radius:2px;outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ice);cursor:pointer;
    box-shadow:0 0 8px rgba(111,227,255,.6);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ice);cursor:pointer;
  }
  .formula-note{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  select.chest-select{min-width:100px;padding:6px 8px;font-size:12.5px;}
  select.chest-select.big{border-color:var(--gold);color:var(--gold);}
  select.chest-select.small{border-color:var(--silver);color:var(--silver);}

  .copy-bar{
    display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;
    background:linear-gradient(180deg, rgba(111,227,255,.18), rgba(111,227,255,.05));
    border:1px solid var(--ice);
    color:var(--ice);
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
    transition:all .15s;
  }
  .btn:hover{background:rgba(111,227,255,.22);box-shadow:0 0 16px rgba(111,227,255,.2);}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .copy-status{font-size:12.5px;color:var(--good);opacity:0;transition:opacity .2s;}
  .copy-status.show{opacity:1;}
  .chest-summary{font-size:12.5px;color:var(--text-faint);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  footer{margin-top:36px;text-align:center;color:var(--text-faint);font-size:11.5px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  /* modal */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(3,6,12,0.72);
    z-index:100;
    align-items:center;justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;
    max-width:820px;width:100%;
    max-height:80vh;
    display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .modal-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px 0;
  }
  .modal-header h2{
    font-family:'Inter',sans-serif;font-weight:700;font-size:18px;margin:0;color:var(--ice);
  }
  .modal-close{
    background:none;border:none;color:var(--text-dim);font-size:22px;line-height:1;
    cursor:pointer;padding:4px 8px;
  }
  .modal-close:hover{color:var(--text);}
  .modal-sub{color:var(--text-faint);font-size:12.5px;padding:6px 22px 14px;margin:0;}
  #tableWrap, #chestTableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  #tableWrap table, #chestTableWrap table{min-width:520px;}
  tbody td.name, thead th{white-space:nowrap;}
  #top100TableWrap{overflow:auto;padding:0 22px 22px;}
  #top100TableWrap table{font-size:13px;}
  #top100TableWrap th, #top100TableWrap td{padding:7px 10px;white-space:nowrap;}
  #top100TableWrap thead th{position:sticky;top:0;background:var(--panel);}
  #top100TableWrap td.num{text-align:center;}
  #top100TableWrap th:first-child, #top100TableWrap td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;box-shadow:1px 0 0 var(--border);}
  #top100TableWrap thead th:first-child{z-index:2;}
  .btn-secondary{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    padding:9px 16px;border-radius:5px;cursor:pointer;transition:all .15s;
  }
  .btn-secondary:hover{color:var(--ice);border-color:var(--ice-dim);}


  /* controls layout: phase buttons get their own row, filters + actions sit together below */
  #controls > .field:first-child{flex:1 1 100%;}

  /* switch */
  .switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;align-self:flex-end;padding:8px 0;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch-track{width:38px;height:22px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);position:relative;transition:background .2s,border-color .2s;flex:none;}
  .switch-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .2s,background .2s;}
  .switch input:checked + .switch-track{background:rgba(255,180,0,.18);border-color:var(--state646);}
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(16px);background:var(--state646);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--ice-dim);outline-offset:2px;}
  .switch-label{font-size:13px;color:var(--text-dim);font-weight:500;}
  .switch input:checked ~ .switch-label{color:var(--text);}

  /* tooltip */
  #tooltip{
    position:fixed;z-index:200;pointer-events:none;
    min-width:240px;max-width:310px;
    background:rgba(10,15,28,.97);border:1px solid var(--ice-dim);border-radius:8px;
    padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.55);
    opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;
    font-size:12px;
  }
  #tooltip{visibility:hidden;transition:opacity .12s ease,transform .12s ease,visibility 0s linear .12s;}
  #tooltip.show{opacity:1;transform:none;visibility:visible;transition-delay:0s;}
  .tt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .tt-head b{font-size:13.5px;color:var(--strong);}
  .tt-state{font-size:11px;font-weight:700;color:var(--state657);}
  .tt-state.home{color:var(--state646);}
  .tt-id{color:var(--text-faint);font-size:11.5px;margin-bottom:8px;}
  .tt-spark{display:flex;align-items:flex-end;gap:6px;height:50px;margin:8px 0 10px;}
  .tt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;}
  .tt-bar i{display:block;width:100%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--ice),var(--frost));}
  .tt-bar.zero i{background:var(--border);}
  .tt-bar span{font-size:9.5px;color:var(--text-faint);}
  .tt-table{width:100%;font-size:11.5px;border-collapse:collapse;}
  .tt-table td{padding:2px 0;border:none;color:var(--text-dim);}
  .tt-table td.r{text-align:right;color:var(--text-faint);padding-right:10px;}
  .tt-table td.p{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}
  .tt-note{margin-top:6px;font-size:10.5px;color:var(--text-faint);}
  tbody tr[data-tip]{transition:background .12s;}


  .ttq{margin:8px 0 10px;padding:8px 10px;background:rgba(111,227,255,.05);border:1px solid var(--border);border-radius:6px;}
  .ttq-t{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ice-dim);margin-bottom:6px;font-weight:600;}
  .ttq-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--text-dim);margin-top:5px;}
  .ttq-r b{color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums;}
  .ttq-n{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;margin-top:1px;}
  .ttq-n.warn{color:var(--gold);font-size:10.5px;line-height:1.35;margin:5px 0 2px;}
  .ttq-m{height:4px;border-radius:2px;background:var(--border);margin-top:3px;overflow:hidden;}
  .ttq-m i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),var(--frost));border-radius:2px;}
  .ttq .tt-note{margin-top:4px;}

  /* battle phase / castle: note, contribution bar, battle alliance flag */
  .phase-note{font-size:12px;color:var(--text-faint);margin:0 0 14px;padding:8px 12px;border-left:2px solid var(--ice-dim);background:rgba(111,227,255,.04);border-radius:0 4px 4px 0;}
  .contrib{margin-bottom:16px;}
  .contrib-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;margin-bottom:6px;}
  .contrib-head b{color:var(--text);font-weight:600;}
  .contrib-head span{color:var(--text-faint);}
  .contrib-bar{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--border);background:var(--panel-2);}
  .cseg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap;transition:width .6s ease;}
  .contrib-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:11.5px;color:var(--text-dim);}
  .citem{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;}
  .citem i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none;}
  .citem b{color:var(--text);}
  .cbtn{background:none;border:1px solid transparent;border-radius:12px;padding:2px 8px;margin:-2px -8px;color:inherit;font:inherit;cursor:pointer;}
  .cbtn:hover{border-color:var(--border);}
  .cbtn.on{border-color:var(--ice-dim);background:rgba(111,227,255,.08);}
  .cbtn:focus-visible{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .citem em{font-style:normal;color:var(--text-faint);}
  .aflag{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;color:var(--gold);border:1px solid rgba(255,180,0,.45);background:rgba(255,180,0,.08);vertical-align:middle;}

  /* event selector */
  .event-bar{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .event-bar label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
  .event-bar select{min-width:230px;font-weight:600;}

  /* statistics tab */
  .sx-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;}
  .sx-picker{position:relative;margin-bottom:10px;}
  .sx-picker input{width:100%;padding:11px 14px;font-size:14px;}
  .sx-hits{display:flex;flex-direction:column;gap:2px;margin-top:6px;}
  .sx-hit{display:flex;align-items:center;gap:10px;flex-wrap:wrap;text-align:left;width:100%;background:var(--panel-2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:5px;cursor:pointer;font-size:13px;font-family:'Inter',sans-serif;}
  .sx-hit:hover{border-color:var(--ice-dim);background:var(--hit-hover);}
  .sx-hit b{font-weight:600;}
  .sx-id{font-size:11.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .sx-none{font-size:12.5px;color:var(--text-faint);padding:8px 2px;}
  .sx-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
  .sx-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border-radius:14px;border:1px solid var(--c);background:rgba(255,255,255,.03);font-size:12.5px;}
  .sx-chip i{width:9px;height:9px;border-radius:50%;background:var(--c);}
  .sx-chip button{background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;cursor:pointer;padding:0 6px;}
  .sx-chip button:hover{color:var(--text);}
  .sx-quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .sx-quick .sx-hit{width:auto;padding:6px 10px;}
  .sx-browse{margin-bottom:12px;}
  .sx-browse select{max-width:100%;}
  .sx-browse-list{max-height:320px;overflow:auto;margin-top:8px;}
  .sx-hit.picked{opacity:.45;}
  .sx-q-title{width:100%;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .sx-ctrl{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 10px;}
  .sx-ctrl select{min-width:200px;}
  .sx-chart-title{font-size:12.5px;color:var(--text-dim);margin:4px 0 2px;}
  .sx-svg{width:100%;height:auto;display:block;overflow:visible;}
  .sx-grid{stroke:var(--border);stroke-width:1;}
  .sx-axis{fill:var(--text-faint);font-size:11px;font-family:'Inter',sans-serif;}
  .sx-empty{padding:34px 12px;text-align:center;color:var(--text-faint);font-size:13px;border:1px dashed var(--border);border-radius:6px;margin:6px 0 14px;}
  .sx-card{margin-top:16px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .sx-card-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);}
  .sx-card-head i{width:10px;height:10px;border-radius:50%;}
  .sx-card-head b{font-size:14px;color:var(--strong);}
  .sx-hist{width:100%;font-size:11.5px;color:var(--text-faint);}
  .sx-hist em{font-style:normal;color:var(--text-faint);opacity:.8;}
  .sx-scroll{overflow-x:auto;}
  .sx-card table{min-width:600px;width:100%;table-layout:fixed;font-size:13px;}
  .sx-card th:first-child{width:150px;}
  .sx-card th.tagc{width:96px;}
  .sx-card th.num{text-align:right;}
  .sx-card td .sx-flag{display:inline-block;margin:3px 0 0;}
  .sx-card td.sx-na{color:var(--text-faint);}
  .sx-card td em, .sx-card td .sx-flag{font-style:normal;color:var(--text-faint);font-size:11.5px;}
  .sx-card td .sx-flag{border:1px solid var(--border);border-radius:3px;padding:1px 5px;margin-left:0;}
  .sx-card td.num{text-align:right;white-space:nowrap;}
  .sx-card th{white-space:normal;line-height:1.25;vertical-align:bottom;}
  /* alliance table: 7 columns need room, swipe sideways on phones, Event column stays visible */
  .sx-card.sx-al table{min-width:940px;}
  .sx-card.sx-al th:first-child{width:112px;}
  .sx-card.sx-al th.tagc{width:84px;}
  @media (max-width:640px){
    .sx-card.sx-al th:first-child, .sx-card.sx-al td:first-child{position:sticky;left:0;z-index:1;background:var(--panel);}
    .sx-card.sx-al th:first-child{background:var(--panel);}

(function(){
  var root = document.documentElement, btn = document.getElementById('themeToggle');
  function apply(t){
    if(t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
    var m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t === 'light' ? '#f3f6fb' : '#070b15');

  var t = 'dark'; try { if(localStorage.getItem('svs-theme') === 'light') t = 'light'; } catch(e) {}
  if(t === 'dark'){ try { if(/(?:^|; )svs_theme=light/.test(document.cookie)) t = 'light'; } catch(e) {} }
  apply(t);
  if(btn) btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    apply(next);

    try { document.cookie = 'svs_theme=' + next + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
  });
})();
</script>

      '<div class="field"><label for="plEk">Event type</label><select id="plEk" class="pl-sel"' + (e && e.entries > 0 ? ' disabled' : '') + '>' + Object.keys(KINDS).map(function(k){ return '<option value="' + k + '"' + (kindOf(e) === k ? ' selected' : '') + '>' + esc(KINDS[k].name + ' – ' + KINDS[k].hours.join(', ')) + '</option>'; }).join('') + '</select>' + (e && e.entries > 0 ? '<p class="pl-note">The type is locked while players are signed up.</p>' : '') + '</div>' +
      '<label class="pl-chip" style="max-width:220px"><input type="checkbox" id="plEo"' + (!e || e.open ? ' checked' : '') + '><span>Sign-up open</span></label>' +
      '<div class="acts"><button type="button" class="btn btn-secondary" id="plEc">Cancel</button><button type="button" class="btn" id="plEs">Save</button></div></div></div>';
    ov.classList.add('open');
    $('plMx').onclick = $('plEc').onclick = function(){ ov.classList.remove('open'); };
    $('plEs').onclick = function(){
      var t = $('plEt').value.trim(); if(!t){ toast('Please enter a title.'); return; }
      rpc('pool_event_save', {p_code: S.code, p_id: e ? e.id : null, p_title: t, p_date: $('plEd').value || null, p_open: $('plEo').checked, p_kind: $('plEk').value}).then(function(id){
        ov.classList.remove('open'); if(!e && id){ S.evId = id; lsSet('pool646_ev', id); }
        toast(e ? 'Event saved' : 'Event created', true); return refreshEvents(true).then(function(){ renderForm(); loadEntry(); loadPool(); });
      }).catch(function(err){ toast(err.message); });
    };
    setTimeout(function(){ $('plEt').focus(); }, 30);
  }
  document.addEventListener('click', function(ev){
    var b = ev.target.closest && ev.target.closest('button'); if(!b) return;
    var e = curEv();
    if(b.id === 'plNew') evModal(null);
    else if(b.id === 'plEdit' && e) evModal(e);
    else if(b.id === 'plHeroes' && e && canSee()) heroModal(e);
    else if(b.id === 'plTog' && e){
      rpc('pool_event_save', {p_code: S.code, p_id: e.id, p_title: e.title, p_date: e.starts_on || null, p_open: !e.open, p_kind: kindOf(e)}).then(function(){ toast(e.open ? 'Sign-up closed' : 'Sign-up reopened', true); return refreshEvents(true).then(function(){ renderForm(); loadEntry(); }); }).catch(function(err){ toast(err.message); });
    }
    else if(b.id === 'plDel' && e){
      if(!confirm('Delete the event "' + e.title + '" with all its sign-ups? This cannot be undone.')) return;
      rpc('pool_event_delete', {p_code: S.code, p_id: e.id}).then(function(){ toast('Event deleted', true); S.evId = null; lsSet('pool646_ev', ''); return refreshEvents(false).then(function(){ renderForm(); loadEntry(); loadPool(); }); }).catch(function(err){ toast(err.message); });
    }
  });

  /* ---------- pool overview (planners) ---------- */
  function loadPool(){
    var el = $('plPool'); if(!el) return;
    if(!canSee() || !curEv()){ el.hidden = true; return; }
    el.hidden = false;
    rpc('pool_list', {p_code: S.code, p_event: S.evId}).then(function(r){ S.pool = Array.isArray(r) ? r : []; renderPool(); }).catch(function(err){ el.innerHTML = '<h2>Pool</h2><p class="pl-note">' + esc(err.message) + '</p>'; });
  }
  function poolShown(){
    var rows = (S.pool || []).slice();
    var shown = S.poolHour < 0 ? rows : rows.filter(function(r){ return r.hours & (1 << S.poolHour); });
    shown.sort(function(a, b){ var pa = pInfo(a.pid), pb = pInfo(b.pid); return String(pa ? pa.n : a.pid).toLowerCase().localeCompare(String(pb ? pb.n : b.pid).toLowerCase()); });
    return shown;
  }
  function poolTable(shown, shot){
    var hs = (curEv() && curEv().heroes) || [], h = '<table class="pl-t"><thead><tr><th>Player</th><th>Hours</th>' + UNITS.map(function(u){ return '<th>' + u + '</th>'; }).join('') + hs.map(function(n){ return '<th class="pl-hth" title="' + esc(n) + '">' + heroImg(n, 26) + (shot ? '<div class="pl-hn">' + esc(n) + '</div>' : '') + '</th>'; }).join('') + '<th>Extras</th>' + (shot ? '' : '<th>Updated</th>') + '</tr></thead><tbody>';
    shown.forEach(function(r){
      var p = pInfo(r.pid), nm = p ? p.n : 'ID ' + r.pid;
      h += '<tr><td><div class="pl-pn">' + (p ? avatar(r.pid, 24, nm) : '') + '<span>' + esc(nm) + (p && p.a ? ' <small>' + esc(p.a) + '</small>' : '') + '</span></div></td><td><span class="pl-hh" title="' + esc(H().filter(function(_, i){ return r.hours & (1 << i); }).join(', ')) + '">' + H().map(function(_, i){ return '<i class="' + ((r.hours & (1 << i)) ? 'on' : '') + '"></i>'; }).join('') + '</span></td>';
      for(var i = 0; i < 3; i++){
        var fc = (r.fc || [])[i], t = (r.tier || [])[i], s = (r.skill || [])[i];
        h += '<td class="pl-tt">' + (fc == null && t == null ? '–' : '<b>' + (fc != null ? 'FC' + fc : '–') + '</b> · ' + (t == null ? '–' : '<span' + (t === 12 && s === 3 ? ' class="top"' : '') + '>T' + t + (s != null ? ' S' + s : '') + '</span>')) + '</td>';
      }
      hs.forEach(function(n){ var v = (r.stars || {})[n] || 0; h += '<td class="pl-tt pl-hs' + (v >= 5 ? ' top' : '') + '">' + (v ? '<b>' + v + '</b>★' : '–') + '</td>'; });
      h += '<td class="pl-tt">' + ((r.heal || r.boost || r.bb) ? [r.heal ? '<span class="pl-ic" title="Auto-Heal (VIP)" aria-label="Auto-Heal (VIP)"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path fill="#e5384f" d="M9 2.5h6V9h6.5v6H15v6.5H9V15H2.5V9H9z"/></svg></span>' : '', r.boost ? '<span class="pl-ic pl-em" title="20% Deployment Boost" aria-label="20% Deployment Boost">💪</span>' : '', r.bb ? '<span class="pl-bb" title="Battle Buddy" aria-label="Battle Buddy">🤠</span>' : ''].filter(Boolean).join(' ') : '–') + '</td>';
      if(!shot) h += '<td class="pl-tt pl-ts" title="Added: ' + esc(tsTxt(r.created_at)) + ' · Updated: ' + esc(tsTxt(r.updated_at)) + '">' + esc(tsTxt(r.updated_at)) + (r.created_at && r.updated_at && Math.abs(new Date(r.updated_at) - new Date(r.created_at)) > 60000 ? ' <small>(added ' + esc(tsTxt(r.created_at)) + ')</small>' : '') + '</td>';
      h += '</tr>';
    });
    return h + '</tbody></table>';
  }
  function renderPool(){
    var el = $('plPool'), rows = (S.pool || []).slice(), shown = poolShown();
    var cnt = H().map(function(_, i){ return rows.filter(function(r){ return r.hours & (1 << i); }).length; });
    var h = '<h2>Pool for planners · ' + rows.length + ' signed up</h2><p class="pl-note">Only visible for admins and planners. Tap an hour to see who is available then. The picture and the CSV contain what is shown here.</p><div class="pl-sum"><button type="button" data-ph="-1" class="' + (S.poolHour < 0 ? 'on' : '') + '">All · ' + rows.length + '</button>' +
      H().map(function(t, i){ return '<button type="button" data-ph="' + i + '" class="' + (S.poolHour === i ? 'on' : '') + '">' + t + ' · ' + cnt[i] + '</button>'; }).join('') + '</div>';
    if(!shown.length) h += '<p class="pl-note">Nobody yet.</p>';
    else h += '<div class="pl-exp"><button type="button" class="btn btn-secondary" id="plShare">Share pic</button><button type="button" class="btn btn-secondary" id="plSavePic">Save pic</button><button type="button" class="btn btn-secondary" id="plCsv">Export CSV</button></div><div class="pl-tw">' + poolTable(shown, false) + '</div>';
    el.innerHTML = h;
  }

  /* ---------- export: picture and CSV ---------- */
  function fileBase(){ var e = curEv() || {}; return 'state646-pool-' + (slug(e.title || 'event') || 'event') + (S.poolHour >= 0 ? '-' + slug(H()[S.poolHour]) : ''); }
  function loadLib(){
    if(window.htmlToImage) return Promise.resolve();
    return new Promise(function(res, rej){ var sc = document.createElement('script'); sc.src = window.__rpLib || 'https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js'; sc.onload = res; sc.onerror = function(){ rej(new Error('lib')); }; document.head.appendChild(sc); });
  }
  function inlineImgs(root){
    var undo = [];
    [].forEach.call(root.querySelectorAll('img'), function(im){
      try {
        if(!im.complete || !im.naturalWidth) return;
        var c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight; c.getContext('2d').drawImage(im, 0, 0);
        var old = im.getAttribute('src'); im.src = c.toDataURL('image/png'); undo.push([im, old]);
      } catch(e) {}
    });
    return Promise.all(undo.map(function(u){ return u[0].decode ? u[0].decode().catch(function(){}) : 0; })).then(function(){ return function(){ undo.forEach(function(u){ u[0].setAttribute('src', u[1]); }); }; });
  }
  function shotBlob(){
    var e = curEv() || {}, shown = poolShown(); if(!shown.length) return Promise.resolve(null);
    var box = document.createElement('div'); box.id = 'plShot'; box.className = 'pl-shotbox';
    box.innerHTML = ('<div class="pl-shot-t">Rally Pool · ' + esc(e.title || '') + '</div><div class="pl-shot-s">' + (e.starts_on ? esc(dateTxt(e.starts_on)) + ' · ' : '') + KINDS[kindOf(e)].name + ' · times are UTC · ' + (S.poolHour < 0 ? 'everybody signed up' : 'available ' + esc(H()[S.poolHour])) + ' · ' + shown.length + ' players</div>' + poolTable(shown, true)).replace(/loading="lazy"/g, 'loading="eager"');
    document.body.appendChild(box);
    var imgs = [].slice.call(box.querySelectorAll('img'));
    return loadLib().then(function(){
      return Promise.all(imgs.map(function(im){ return im.complete ? 0 : new Promise(function(r){ im.addEventListener('load', r); im.addEventListener('error', function(){ setTimeout(r, 50); }); setTimeout(r, 4000); }); }));
    }).then(function(){ return inlineImgs(box); }).then(function(restore){
      var bg = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim() || '#0f1626';
      var opt = Object.assign({pixelRatio: 2, backgroundColor: bg, cacheBust: false, style: {position: 'static', left: '0', top: '0'}}, window.__rpOpt || {});
      var safari = /iP(hone|ad|od)|^((?!chrome|android|crios|edg).)*safari/i.test(navigator.userAgent);
      return (safari ? window.htmlToImage.toBlob(box, opt).catch(function(){}) : Promise.resolve()).then(function(){ return window.htmlToImage.toBlob(box, opt); }).then(function(bl){ restore(); box.remove(); return bl; }, function(er){ restore(); box.remove(); throw er; });
    }, function(er){ box.remove(); throw er; });
  }
  function download(blob, name){
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function sharePic(btn, save){
    btn.disabled = true; var done = function(){ btn.disabled = false; };
    if(!save && navigator.clipboard && window.ClipboardItem){
      var pr = shotBlob().then(function(bl){ if(!bl) throw new Error('empty'); return bl; });
      navigator.clipboard.write([new ClipboardItem({'image/png': pr})]).then(function(){ toast('Picture copied', true); done(); }, function(){
        shotBlob().then(function(bl){ if(!bl) throw new Error('empty'); download(bl, fileBase() + '.png'); toast('Clipboard not available – picture downloaded', true); }).catch(function(){ toast('Could not create the picture'); }).then(done);
      });
      return;
    }
    shotBlob().then(function(bl){ if(!bl) throw new Error('empty'); download(bl, fileBase() + '.png'); toast(save ? 'Picture saved' : 'Clipboard not available – picture downloaded', true); }).catch(function(){ toast('Could not create the picture'); }).then(done);
  }
  function csvCell(v){
    v = v == null ? '' : String(v); if(/^[=+\-@\t\r]/.test(v)) v = "'" + v;
    return '"' + v.replace(/"/g, '""') + '"';
  }
  function utc(t){ if(!t) return ''; var d = new Date(t); return isNaN(d) ? '' : d.toISOString().slice(0, 16).replace('T', ' '); }
  function exportCsv(){
    var shown = poolShown(), e = curEv() || {}, hs = e.heroes || []; if(!shown.length){ toast('Nobody to export.'); return; }
    var head = ['Name', 'Player ID', 'Alliance', 'Hours (UTC)'];
    UNITS.forEach(function(u){ head.push(u + ' FC', u + ' tier', u + ' T12 skill'); });
    hs.forEach(function(n){ head.push(n + ' (stars)'); });
    head.push('Auto-Heal', '20% Deployment Boost', 'Battle Buddy', 'Signed up (UTC)', 'Updated (UTC)');
    var lines = [head.map(csvCell).join(';')];
    shown.forEach(function(r){
      var p = pInfo(r.pid), row = [p ? p.n : '', r.pid, p ? p.a || '' : '', H().filter(function(_, i){ return r.hours & (1 << i); }).join(', ')];
      for(var i = 0; i < 3; i++){ row.push((r.fc || [])[i] == null ? '' : (r.fc || [])[i], (r.tier || [])[i] == null ? '' : 'T' + (r.tier || [])[i], (r.skill || [])[i] == null ? '' : (r.skill || [])[i]); }
      hs.forEach(function(n){ row.push((r.stars || {})[n] || ''); });
      row.push(r.heal ? 'yes' : '', r.boost ? 'yes' : '', r.bb ? 'yes' : '', utc(r.created_at), utc(r.updated_at));
      lines.push(row.map(csvCell).join(';'));
    });
    download(new Blob(['﻿' + lines.join('\r\n')], {type: 'text/csv;charset=utf-8'}), fileBase() + '.csv'); toast('CSV exported', true);
  }
  document.addEventListener('click', function(ev){
    var x = ev.target.closest && ev.target.closest('#plShare, #plSavePic, #plCsv'); if(!x) return;
    if(x.id === 'plCsv') exportCsv(); else sharePic(x, x.id === 'plSavePic');
  });
  document.addEventListener('click', function(ev){
    var b = ev.target.closest && ev.target.closest('button[data-ph]'); if(!b) return;
    S.poolHour = +b.getAttribute('data-ph'); renderPool();
  });

  /* ---------- start ---------- */
  function init(){
    skeleton();
    try{ S.want = new URLSearchParams(location.search).get('event') || null; }catch(x){ S.want = null; }
    S.code = lsGet('ep_code') || '';
    var pPlayers = fetch('data/players.json', {cache: 'no-cache'}).then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }).then(function(d){
      S.players = d.players || {}; S.alliances = d.alliances || {};
      S.tags = Object.keys(S.alliances).sort(function(a, b){ return a.toLowerCase().localeCompare(b.toLowerCase()) || (a < b ? -1 : 1); });
    });
    var pMe = S.code ? rpc('sa_me', {p_code: S.code}).then(function(r){ S.me = r || null; }).catch(function(){ S.me = null; }) : Promise.resolve();
    Promise.all([pPlayers, pMe]).then(function(){ return refreshEvents(false); }).then(function(){
      renderForm();
      loadEntry(); loadPool();
    }).catch(function(err){ $('plMain').innerHTML = '<div class="panel"><div class="rl-empty">Could not load the page: ' + esc(err.message) + '. Please reload.</div></div>'; });
  }
  init();
})();
</script>

(function(){var b=document.getElementById('toTop');if(!b)return;function u(){b.classList.toggle('show',(window.pageYOffset||document.documentElement.scrollTop)>400)}window.addEventListener('scroll',u,{passive:true});u();b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})})})();

<script>
(function(){
  var KEY = 'svs646_prefs';
  var ITEMS = [
    {g: 'All pages'},
    {k: 'av', t: 'Avatars', d: 'Profile pictures next to the player names', def: true},
    {k: 'bal', t: '“Battle alliance” label', d: 'The gold label next to PKB and GYN (Roster, SvS Leaderboards)', def: true},
    {k: 'ban', t: 'Banner symbols', d: 'Gold moons and blue stars next to the alliances (Roster, SvS Leaderboards)', def: true},
    {g: 'SvS Leaderboards'},
    {k: 'dots', t: 'Phase dots', d: 'Five dots showing in which prep phases a player or alliance is listed', def: true},
    {k: 'whale', t: 'Whale mode', d: 'Joke: shows a whale instead of one player’s name (Player tab)', def: false},
    {k: 'koi', t: 'Presidents after King of Icefield', d: 'Also list them in the presidency table (Trends)', def: false},
    {g: 'Event Planner'},
    {k: 'epc', t: 'Compact team view', d: 'Smaller tiles in the teams', def: false}
  ];
  function read(){
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if(!o){ try { var m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {};
  }
  function write(o){
    var s = JSON.stringify(o);
    try { localStorage.setItem(KEY, s); } catch(e) {}
    try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
  }
  function val(o, it){
    var v = o[it.k]; if(typeof v === 'boolean') return v;
    if(it.k === 'dots'){ try { return localStorage.getItem('svs646_dots') !== '0'; } catch(e) {} }
    return it.def;
  }
  function classes(o){
    var c = document.documentElement.classList;
    c.toggle('no-bal', o.bal === false); c.toggle('no-ban', o.ban === false);
  }
  function apply(k, v){
    var o = read(); o[k] = v; write(o); classes(o);
    if(k === 'dots'){ try { localStorage.setItem('svs646_dots', v ? '1' : '0'); } catch(e) {} }
    if(typeof window.epSettingsApply === 'function') window.epSettingsApply(k, v);
  }
  var ov = null;
  function build(){
    var h = '<div class="modal-panel st-panel"><div class="modal-header"><h2 id="stTitle">Settings</h2><button type="button" class="modal-close" aria-label="Close">×</button></div><div class="st-body">';
    ITEMS.forEach(function(it){
      if(it.g){ h += '<div class="st-g">' + it.g + '</div>'; return; }
      h += '<label class="st-row"><span class="st-t"><b>' + it.t + '</b><small>' + it.d + '</small></span><span class="switch"><input type="checkbox" data-k="' + it.k + '"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>';
    });
    h += '<div class="st-foot"><span>Saved in this browser, for all pages.</span><button type="button" id="stReset">Reset all</button></div></div></div>';
    ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'stModal';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'stTitle');
    ov.innerHTML = h; document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    ov.querySelector('.modal-close').addEventListener('click', close);
    ov.addEventListener('change', function(e){ var k = e.target && e.target.getAttribute && e.target.getAttribute('data-k'); if(k) apply(k, e.target.checked); });
    ov.querySelector('#stReset').addEventListener('click', function(){
      ITEMS.forEach(function(it){ if(it.k) apply(it.k, it.def); }); sync();
    });
  }
  function sync(){
    var o = read();
    ITEMS.forEach(function(it){ if(!it.k) return; var cb = ov.querySelector('input[data-k="' + it.k + '"]'); if(cb) cb.checked = val(o, it); });
  }
  function open(){ if(!ov) build(); sync(); ov.classList.add('open'); var c = ov.querySelector('.modal-close'); if(c) c.focus(); }
  function close(){ if(ov) ov.classList.remove('open'); }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && ov && ov.classList.contains('open')) close(); });
  var b = document.getElementById('setBtn'); if(b) b.addEventListener('click', open);
  classes(read());
})();
</script>
