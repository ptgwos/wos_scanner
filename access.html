<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b15;
    --bg-2:#0a0f1c;
    --panel:#0f1626;
    --panel-2:#141d33;
    --border:#1f2c47;
    --border-soft:#182236;
    --ice:#6fe3ff;
    --ice-dim:#3a8fae;
    --frost:#4f7cff;
    --gold:#ffb400;
    --silver:#9fb2cc;
    --text:#e7edf7;
    --text-dim:#8a9bbd;
    --text-faint:#5b6c8c;
    --state646:#ffb400;
    --state657:#7f8fb0;
    --good:#43e6a0;
    --danger:#ff5d73;
    --strong:#fff;
    --stk-sel:#122338;
    --hit-hover:#18233d;
    --on-ice:#00151c;
    --halo:#0f1626;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f3f6fb;
    --bg-2:#eaeff7;
    --panel:#ffffff;
    --panel-2:#eef2f9;
    --border:#cdd6e5;
    --border-soft:#e1e7f1;
    --ice:#0b7fa6;
    --ice-dim:#4f93ad;
    --frost:#3b62d9;
    --gold:#a86f00;
    --silver:#6b7d99;
    --text:#16213a;
    --text-dim:#4a5b7b;
    --text-faint:#7384a3;
    --state646:#c98600;
    --state657:#6b7d99;
    --good:#0e9a68;
    --danger:#d02e48;
    --strong:#0b1426;
    --stk-sel:#dcebf6;
    --hit-hover:#e6edf8;
    --on-ice:#ffffff;
    --halo:#ffffff;
    color-scheme:light;
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(11,127,166,0.07), transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] tbody tr:hover{background:rgba(11,127,166,0.06);}
  :root[data-theme="light"] tbody tr.row-sel{background:rgba(11,127,166,0.10);}
  :root[data-theme="light"] .sel-bar{box-shadow:0 -6px 24px rgba(20,35,70,.18);}
  :root[data-theme="light"] #tooltip{background:rgba(255,255,255,.98);box-shadow:0 12px 36px rgba(20,35,70,.22);}
  :root[data-theme="light"] .btn{background:linear-gradient(180deg, rgba(11,127,166,.14), rgba(11,127,166,.04));}
  :root[data-theme="light"] .sx-chip{background:rgba(20,35,70,.03);}
  :root[data-theme="light"] .ttq,:root[data-theme="light"] .phase-note{background:rgba(11,127,166,.05);}
  :root[data-theme="light"] .state-bar .seg.s657{background:linear-gradient(180deg,#8d9db8,#6b7d99);color:#fff;}
  :root[data-theme="light"] .switch input:checked + .switch-track{background:rgba(201,134,0,.2);}
  /* theme toggle (top right) */
  header{position:relative;}
  .theme-toggle{position:absolute;top:0;right:0;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;padding:0;}
  .theme-toggle:hover{color:var(--strong);border-color:var(--ice-dim);}
  .theme-toggle svg{width:19px;height:19px;display:block;}
  .theme-toggle .i-sun{display:none;}
  .sitenav{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;padding:5px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;font-weight:600;letter-spacing:.09em;scrollbar-width:none;}
  .sitenav::-webkit-scrollbar{display:none;}
  .sitenav > a,.sitenav > span{padding:6px 13px;border-radius:7px;color:var(--text-dim);text-decoration:none;white-space:nowrap;}
  .sitenav a:hover{color:var(--strong);background:rgba(120,140,190,.14);}
  .sitenav > .cur{color:var(--gold);background:rgba(255,180,0,.12);box-shadow:inset 0 -2px 0 var(--gold);}
  .sitenav .sn-s{display:none;}
  @media (max-width:640px){ .sitenav .sn-l{display:none;} .sitenav .sn-s{display:inline;} .sitenav > a,.sitenav > span{padding:6px 10px;} }
  .refresh-btn{right:46px;}
  .refresh-btn svg{width:18px;height:18px;}
  .refresh-btn.spin svg{animation:rfspin .8s linear infinite;}
  .refresh-btn.ok{color:#2fbf71;border-color:#2fbf71;}
  @keyframes rfspin{to{transform:rotate(360deg);}}
  :root[data-theme="light"] .theme-toggle .i-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,227,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ice-dim);
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ice-dim);display:inline-block;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  h1 span{color:var(--ice);}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}

  .divider{width:100%;height:1px;background:var(--border);margin:18px 0 26px;}

  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{
    position:relative;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--ice-dim);}
  .tab.active{
    color:var(--ice);
    background:linear-gradient(180deg, rgba(111,227,255,0.10), rgba(111,227,255,0.02));
    border-color:var(--ice);
    box-shadow:0 0 0 1px rgba(111,227,255,.15), 0 0 18px rgba(111,227,255,.12);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
  }
  select,input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    min-width:150px;
  }
  select:focus,input:focus{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    letter-spacing:.03em;
    border-radius:4px;
    cursor:pointer;
    transition:all .12s;
  }
  .seg button:hover{color:var(--text);border-color:var(--ice-dim);}
  .seg button.nodata{opacity:.5;}
  .seg button.active{
    color:var(--on-ice);
    background:var(--ice);
    border-color:var(--ice);
    font-weight:600;
  }
  .count-pill{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
  }

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--ice);}
  thead th.sorted{color:var(--ice);}
  thead th .arrow{font-size:10px;margin-left:4px;opacity:.8;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:rgba(111,227,255,0.04);}
  tbody td{padding:9px 12px;color:var(--text);}
  td.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:var(--text);}
  .namecell{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .days{display:inline-flex;gap:4px;flex:none;}
  body.nodots .days{display:none;}
  .sw-pair{display:inline-flex;align-items:center;gap:22px;align-self:flex-end;flex-wrap:wrap;}
  .sw-pair .switch{width:auto !important;align-self:center;}
  @media (max-width:640px){ .sw-pair{align-self:flex-start;} .switch.dots-sw, .switch.whale-sw, .switch.av-sw{justify-content:flex-start;align-self:flex-start;width:auto;padding:2px 0;} }
  .rt{display:inline-flex;align-items:center;gap:10px;flex:none;}
  .wins{display:inline-flex;gap:1px;align-items:center;padding:2px 8px;border:1px solid var(--border);border-radius:999px;vertical-align:middle;}

})();

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function toast(msg, ok){ var t = $('toast'); t.textContent = msg; t.className = ok ? 'ok' : ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function(){ t.style.display = 'none'; }, 4200); }
  var st = {role: null, name: '', code: '', users: null, reqs: []};

  var api = (function(){
    if(MOCK){
      var users = [{id: 'u1', name: 'Peter', role: 'super', alliances: [], active: true, pages: []}, {id: 'u2', name: 'Ed (admin)', role: 'admin', alliances: [], active: true, pages: ['rallyleads']},
        {id: 'u3', name: 'Anna', role: 'editor', alliances: ['PKB', 'GYN'], active: true, pages: []}, {id: 'u4', name: 'Old user', role: 'editor', alliances: ['PKB'], active: false, pages: []}];
      var rq = [{discord_id: '123456789012345678', name: 'xX_frostwolf_Xx', nick: 'Frosty (PKB)', avatar: '', created_at: '2026-10-26T18:00:00Z', member: true}, {discord_id: '223456789012345678', name: 'Stranger', avatar: '', created_at: '2026-10-26T19:10:00Z', member: false}];
      return {
        me: function(c){ return Promise.resolve(c === 'admin' ? {role: 'super', name: 'Test admin', rallyleads: true} : c === 'viewer' ? {role: 'admin', name: 'Test viewer', rallyleads: false} : null); },
        list: function(){ return Promise.resolve(JSON.parse(JSON.stringify(users))); },
        save: function(a){ var u = users.filter(function(x){ return x.id === a.p_id; })[0]; if(u.role === 'super' && (a.p_role !== 'super' || !a.p_active)) return Promise.reject(new Error('There must be at least one active super admin')); u.name = a.p_name; u.role = a.p_role; u.active = a.p_active; return Promise.resolve({id: a.p_id}); },
        set: function(a){ users.filter(function(u){ return u.id === a.p_uid; })[0].pages = a.p_pages.slice(); return Promise.resolve(); },
        reqs: function(){ return Promise.resolve(JSON.parse(JSON.stringify(rq))); },
        link: function(a){ var u = users.filter(function(x){ return x.id === a.p_uid; })[0]; u.discord_id = a.p_did; rq = rq.filter(function(r){ return r.discord_id !== a.p_did; }); return Promise.resolve(); },
        mknew: function(a){ users.push({id: 'u' + (users.length + 5), name: a.p_name, role: a.p_role, alliances: [], active: true, pages: [], discord_id: a.p_did}); rq = rq.filter(function(r){ return r.discord_id !== a.p_did; }); return Promise.resolve(); },
        reject: function(a){ rq = rq.filter(function(r){ return r.discord_id !== a.p_did; }); return Promise.resolve(); },
        unlink: function(a){ users.filter(function(x){ return x.id === a.p_uid; })[0].discord_id = null; return Promise.resolve(); }
      };
    }
    var H = {apikey: CFG.key, 'Content-Type': 'application/json'}; if(/^eyJ/.test(CFG.key)) H.Authorization = 'Bearer ' + CFG.key;
    function rpc(fn, args){
      var ac = window.AbortController ? new AbortController() : null, tm = setTimeout(function(){ if(ac) ac.abort(); }, 15000);
      return fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/rpc/' + fn, {method: 'POST', headers: H, body: JSON.stringify(args), cache: 'no-store', signal: ac ? ac.signal : undefined}).then(function(r){ clearTimeout(tm);
        return r.text().then(function(t){ var j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {} if(!r.ok) throw new Error((j && (j.message || j.hint)) || ('HTTP ' + r.status)); return j; });
      });
    }
    return {me: function(c){ return rpc('sa_me', {p_code: c}); }, list: function(c){ return rpc('sa_list', {p_code: c}); }, set: function(a){ return rpc('sa_set', a); }, save: function(a){ return rpc('ev_user_save', a); },
      reqs: function(c){ return rpc('sa_requests', {p_code: c}); }, link: function(a){ return rpc('sa_dc_link', a); }, mknew: function(a){ return rpc('sa_dc_new', a); }, reject: function(a){ return rpc('sa_dc_reject', a); }, unlink: function(a){ return rpc('sa_dc_unlink', a); }};
  })();

  function gate(msg, login){
    $('adm').innerHTML = '<div class="ad-gate"><div class="t">No access!</div><p>' + msg + '</p>' + (login ? '<div class="ad-lg"><input type="password" id="lc" autocomplete="off" placeholder="Your personal link or code"><button type="button" class="btn" id="lgo">Log in</button></div>' : '') + '</div>';
    if(login){ $('lgo').addEventListener('click', go); $('lc').addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); }); }
  }
  function go(){
    var c = $('lc').value.trim(), mm = c.match(/invite=([^&\s#]+)/); if(mm) c = decodeURIComponent(mm[1]);
    api.me(c).then(function(r){ if(!r){ toast('This code is not valid.'); return; } try { localStorage.setItem('ep_code', c); } catch(e) {} enter(r, c); }).catch(function(e){ toast(e.message); });
  }
  function enter(r, code){
    st.role = r.role; st.name = r.name || ''; st.code = code;
    if(r.role !== 'super'){ gate('This page is for the super admin only. Please contact Peter the Great in game or on Discord.' + (st.name ? '<br><span style="font-size:13px">Logged in as ' + esc(st.name) + '</span>' : ''), false); return; }
    load();
  }
  function load(){
    $('adm').innerHTML = '<div class="rl-empty">Loading users …</div>';
    Promise.all([api.list(st.code), api.reqs(st.code).catch(function(){ return null; })]).then(function(a){ var u = a[0]; if(!Array.isArray(u)) throw new Error('Unexpected answer from sa_list: ' + JSON.stringify(u).slice(0, 200)); st.users = u; st.reqs = Array.isArray(a[1]) ? a[1] : []; st.noDc = !Array.isArray(a[1]); draw(); }).catch(function(e){ gate(esc(e.message), false); });
  }
  var RN = {super: 'Super admin', admin: 'Admin', editor: 'Editor'};
  function draw(){
    var h = reqHtml() + '<p class="ad-note"><b>Rally Leads:</b> tick who may open it (read and edit). The super admin always may; an admin of the Event Planner does <b>not</b> automatically see Rally Leads. <b>Rally Planner:</b> tick who may edit the shared plans (everybody can read). Admins may always edit. <b>Appointments:</b> everybody may sign up; tick who may see, sort and filter the overview of all sign-ups (admins may create the weeks). Changes are saved immediately. <b>Event Planner:</b> change a role or block a user (the change is also written to the Event Planner log). New users, alliances and personal links are still managed in the <a class="ad-lnk" href="eventplan.html">Event Planner</a> (users view).</p>' +
      '<div class="ad-box"><table class="ad"><thead><tr><th>Name</th><th>Event Planner<br><span class="ad-sh">role (edit)</span></th><th>Alliances<br><span class="ad-sh">editors only</span></th><th class="c">Rally Planner<br><span class="ad-sh">edit</span></th><th class="c">Rally Leads<br><span class="ad-sh">see + edit</span></th><th class="c">Fortress/SH Plan<br><span class="ad-sh">edit</span></th><th class="c">Appointments<br><span class="ad-sh">overview</span></th><th class="c">Active<br><span class="ad-sh">untick = blocked</span></th><th>Discord</th><th>Last login</th></tr></thead><tbody>';
    st.users.forEach(function(u){
      var sup = u.role === 'super', adm = u.role === 'admin', on = sup || (u.pages || []).indexOf('rallyleads') >= 0, rp = sup || adm || (u.pages || []).indexOf('rallyplan') >= 0;
      var ro = sup ? ' disabled title="The super admin cannot be changed here"' : '';
      var noAl = u.role === 'editor' && !(u.alliances || []).length;
      h += '<tr class="' + (u.active ? '' : 'off') + '"><td><input type="text" class="ad-nm" maxlength="40" data-u="' + esc(u.id) + '" data-k="name" value="' + esc(u.name) + '" title="Click to rename (e.g. the in-game name)" aria-label="Name"></td>' +
        '<td>' + (sup ? '<span class="ad-r super">Super admin</span>' : '<select class="ad-sel" data-u="' + esc(u.id) + '" data-k="role" aria-label="Event Planner role for ' + esc(u.name) + '"><option value="admin"' + (adm ? ' selected' : '') + '>Admin</option><option value="editor"' + (u.role === 'editor' ? ' selected' : '') + '>Editor</option></select>') + '</td>' +
        '<td>' + esc((u.alliances || []).join(', ') || '–') + (noAl ? ' <span class="ad-r" title="An editor without alliances cannot change any player. Set the alliances in the Event Planner (users view).">no alliance!</span>' : '') + '</td>' +
        '<td class="c"><input type="checkbox" data-u="' + esc(u.id) + '" data-p="rallyplan"' + (rp ? ' checked' : '') + (sup || adm ? ' disabled title="' + (sup ? 'The super admin' : 'Admins') + ' may always edit the Rally Planner"' : '') + ' aria-label="Rally Planner for ' + esc(u.name) + '"></td>' +
        '<td class="c"><input type="checkbox" data-u="' + esc(u.id) + '" data-p="rallyleads"' + (on ? ' checked' : '') + (sup ? ' disabled title="The super admin always has access"' : '') + ' aria-label="Rally Leads for ' + esc(u.name) + '"></td>' +
        '<td class="c"><input type="checkbox" data-u="' + esc(u.id) + '" data-p="fsh"' + ((sup || (u.pages || []).indexOf('fsh') >= 0) ? ' checked' : '') + ro + ' aria-label="Fortress/SH Plan for ' + esc(u.name) + '"></td>' +
        '<td class="c"><input type="checkbox" data-u="' + esc(u.id) + '" data-p="appointments"' + ((sup || (u.pages || []).indexOf('appointments') >= 0) ? ' checked' : '') + (sup ? ' disabled title="The super admin always has access"' : '') + ' aria-label="Appointments overview for ' + esc(u.name) + '"></td>' +
        '<td class="c"><input type="checkbox" data-u="' + esc(u.id) + '" data-k="active"' + (u.active ? ' checked' : '') + ro + ' aria-label="Active: ' + esc(u.name) + '"></td>' +
        '<td>' + (u.discord_id ? '<span class="dq-ok">linked</span> <button type="button" class="btn" data-unl="' + esc(u.id) + '" style="font-size:11.5px;padding:3px 8px">Unlink</button>' : '–') + '</td>' +
        '<td class="ad-dt">' + (u.last_login ? esc(String(u.last_login).slice(0, 16).replace('T', ' ')) : '–') + '</td></tr>';
    });
    h += '</tbody></table></div><div class="ad-mx"><div class="ad-note"><b>Who may see what</b></div><div class="ad-box"><table class="ad"><thead><tr><th>Page</th><th>Read</th><th>Edit</th></tr></thead><tbody>' +
      '<tr><td>Roster, SvS Leaderboards, Formations</td><td>everybody</td><td>everybody</td></tr>' +
      '<tr><td>Event Planner</td><td>everybody</td><td>admins, and editors for their own alliances (set here; alliances in the Event Planner)</td></tr>' +
      '<tr><td>Rally Planner</td><td colspan="2">only admins and the users ticked above – everybody else must log in and sees “No access”</td></tr>' +
      '<tr><td>Appointments</td><td>everybody can sign up and change entries; the overview (sort, filter) only for the users ticked above (and the super admin)</td><td>admins create the weeks</td></tr>' +
      '<tr><td>Fortress/SH Plan</td><td>everybody</td><td>only the users ticked above (the Discord bot reads this data)</td></tr>' +
      '<tr><td>Rally Leads</td><td colspan="2">only the users ticked above (and the super admin) – everybody else sees “No access”</td></tr></tbody></table></div></div>';
    $('adm').innerHTML = h;
  }
  function reqHtml(){
    if(st.noDc) return '<div class="dq"><h3>Discord login</h3><p class="ad-note" style="margin:0">Not set up yet: please run discord.sql in Supabase (see the instructions).</p></div>';
    if(!st.reqs.length) return '<div class="dq"><h3>Waiting list (Discord)</h3><p class="ad-note" style="margin:0">No open requests.</p></div>';
    var free = st.users.filter(function(u){ return !u.discord_id; });
    var h = '<div class="dq"><h3>Waiting list (Discord): ' + st.reqs.length + '</h3>';
    st.reqs.forEach(function(r){
      var id = esc(r.discord_id);
      h += '<div class="dq-r"><div class="dq-w"><b>' + esc(r.nick || r.name || 'Discord user') + '</b><small>' + (r.nick ? 'Discord name: ' + esc(r.name || '') + ' · ' : '') + 'ID ' + id + ' · ' + esc(String(r.created_at || '').slice(0, 16).replace('T', ' ')) + ' · ' +
        (r.member === true ? '<span class="dq-ok">in your Discord server</span>' : r.member === false ? '<span class="dq-no">NOT in your Discord server</span>' : 'server membership not checked yet') + '</small></div>' +
        '<div class="dq-a"><select data-lk="' + id + '" aria-label="Existing user"><option value="">Link to existing user …</option>' + free.map(function(u){ return '<option value="' + esc(u.id) + '">' + esc(u.name) + ' (' + esc(RN[u.role] || u.role) + ')</option>'; }).join('') + '</select>' +
        '<button type="button" class="btn" data-link="' + id + '">Link</button></div>' +
        '<div class="dq-a"><input type="text" maxlength="40" placeholder="New user name" data-nm="' + id + '" value="' + esc(r.nick || r.name || '') + '"><select data-nr="' + id + '"><option value="editor">Editor</option><option value="admin">Admin</option></select>' +
        '<button type="button" class="btn" data-new="' + id + '">Create</button></div>' +
        '<div class="dq-a"><button type="button" class="btn" data-rej="' + id + '">Reject</button></div></div>';
    });
    return h + '<p class="ad-note" style="margin:8px 0 0">Linking or creating only connects the Discord account with a user. Afterwards tick the pages this user may edit below.</p></div>';
  }
  function dcDo(fn, args, msg){
    api[fn](args).then(function(){ toast(msg, true); load(); }).catch(function(err){ toast(err.message); });
  }
  $('adm').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var did;
    if((did = b.getAttribute('data-link'))){
      var sel = document.querySelector('select[data-lk="' + did + '"]');
      if(!sel || !sel.value){ toast('Please choose a user first.'); return; }
      dcDo('link', {p_code: st.code, p_did: did, p_uid: sel.value}, 'Discord account linked'); return;
    }
    if((did = b.getAttribute('data-new'))){
      var nm = document.querySelector('input[data-nm="' + did + '"]').value.trim(), rl = document.querySelector('select[data-nr="' + did + '"]').value;
      if(!nm){ toast('Please enter a name.'); return; }
      dcDo('mknew', {p_code: st.code, p_did: did, p_name: nm, p_role: rl}, 'User ' + nm + ' created'); return;
    }
    if((did = b.getAttribute('data-rej'))){ dcDo('reject', {p_code: st.code, p_did: did}, 'Request rejected'); return; }
    var uid = b.getAttribute('data-unl');
    if(uid){ if(!confirm('Unlink the Discord account from this user? They can still use their personal link.')) return; dcDo('unlink', {p_code: st.code, p_uid: uid}, 'Discord account unlinked'); }
  });
  function saveUser(el){
    var u = st.users.filter(function(x){ return x.id === el.getAttribute('data-u'); })[0], k = el.getAttribute('data-k');
    var role = k === 'role' ? el.value : u.role, active = k === 'active' ? el.checked : u.active, nm = k === 'name' ? el.value.trim() : u.name;
    if(!nm || nm.length > 40){ toast('Please enter a name (up to 40 characters).'); draw(); return; }
    if(k === 'name' && nm === u.name) return;
    el.disabled = true;
    api.save({p_code: st.code, p_id: u.id, p_name: nm, p_role: role, p_alliances: u.alliances || [], p_active: active}).then(function(){
      var old = u.name; u.name = nm; u.role = role; u.active = active; draw();
      toast(k === 'name' ? 'Renamed ' + old + ' to ' + nm : u.name + ': ' + (k === 'role' ? 'Event Planner role is now ' + (RN[role] || role) : (active ? 'unblocked' : 'blocked')), true);
    }).catch(function(err){ toast(err.message); draw(); });
  }
  $('adm').addEventListener('change', function(e){
    var kc = e.target.closest('[data-k]');
    if(kc){ saveUser(kc); return; }
    var c = e.target.closest('input[data-u]'); if(!c) return;
    var pg = c.getAttribute('data-p'), lab = pg === 'rallyplan' ? 'Rally Planner' : pg === 'fsh' ? 'Fortress/SH Plan' : pg === 'appointments' ? 'Appointments overview' : 'Rally Leads';
    var u = st.users.filter(function(x){ return x.id === c.getAttribute('data-u'); })[0], want = c.checked, pages = (u.pages || []).filter(function(p){ return p !== pg; });
    if(want) pages.push(pg);
    c.disabled = true;
    api.set({p_code: st.code, p_uid: u.id, p_pages: pages}).then(function(){ u.pages = pages; c.disabled = false; toast((want ? lab + ' allowed for ' : lab + ' removed for ') + u.name, true); })
      .catch(function(err){ c.checked = !want; c.disabled = false; toast(err.message); });
  });

  var saved = null; try { saved = localStorage.getItem('ep_code'); } catch(e) {}
  if(!saved) gate('This page is for the super admin only. Please log in.', true);
  else { $('adm').innerHTML = '<div class="rl-empty">Checking login …</div>'; api.me(saved).then(function(r){ if(!r) gate('This page is for the super admin only. Please log in.', true); else enter(r, saved); }).catch(function(e){ gate('No connection: ' + esc(e.message), false); }); }
})();
</script>

(function(){var b=document.getElementById('toTop');if(!b)return;function u(){b.classList.toggle('show',(window.pageYOffset||document.documentElement.scrollTop)>400)}window.addEventListener('scroll',u,{passive:true});u();b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})})})();

<script>
(function(){
  var KEY = 'svs646_prefs';
  var ITEMS = [
    {g: 'All pages'},
    {k: 'av', t: 'Avatars', d: 'Profile pictures next to the player names', def: true},
    {k: 'bal', t: '“Battle alliance” label', d: 'The gold label next to PKB and GYN (Roster, SvS Leaderboards)', def: true},
    {k: 'ban', t: 'Banner symbols', d: 'Gold moons and blue stars next to the alliances (Roster, SvS Leaderboards)', def: true},
    {g: 'SvS Leaderboards'},
    {k: 'dots', t: 'Phase dots', d: 'Five dots showing in which prep phases a player or alliance is listed', def: true},
    {k: 'whale', t: 'Whale mode', d: 'Joke: shows a whale instead of one player’s name (Player tab)', def: false},
    {k: 'koi', t: 'Presidents after King of Icefield', d: 'Also list them in the presidency table (Trends)', def: false},
    {g: 'Event Planner'},
    {k: 'epc', t: 'Compact team view', d: 'Smaller tiles in the teams', def: false}
  ];
  function read(){
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if(!o){ try { var m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {};
  }
  function write(o){
    var s = JSON.stringify(o);
    try { localStorage.setItem(KEY, s); } catch(e) {}
    try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
  }
  function val(o, it){
    var v = o[it.k]; if(typeof v === 'boolean') return v;
    if(it.k === 'dots'){ try { return localStorage.getItem('svs646_dots') !== '0'; } catch(e) {} }
    return it.def;
  }
  function classes(o){
    var c = document.documentElement.classList;
    c.toggle('no-bal', o.bal === false); c.toggle('no-ban', o.ban === false);
  }
  function apply(k, v){
    var o = read(); o[k] = v; write(o); classes(o);
    if(k === 'dots'){ try { localStorage.setItem('svs646_dots', v ? '1' : '0'); } catch(e) {} }
    if(typeof window.epSettingsApply === 'function') window.epSettingsApply(k, v);
  }
  var ov = null;
  function build(){
    var h = '<div class="modal-panel st-panel"><div class="modal-header"><h2 id="stTitle">Settings</h2><button type="button" class="modal-close" aria-label="Close">×</button></div><div class="st-body">';
    ITEMS.forEach(function(it){
      if(it.g){ h += '<div class="st-g">' + it.g + '</div>'; return; }
      h += '<label class="st-row"><span class="st-t"><b>' + it.t + '</b><small>' + it.d + '</small></span><span class="switch"><input type="checkbox" data-k="' + it.k + '"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>';
    });
    h += '<div class="st-foot"><span>Saved in this browser, for all pages.</span><button type="button" id="stReset">Reset all</button></div></div></div>';
    ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'stModal';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'stTitle');
    ov.innerHTML = h; document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    ov.querySelector('.modal-close').addEventListener('click', close);
    ov.addEventListener('change', function(e){ var k = e.target && e.target.getAttribute && e.target.getAttribute('data-k'); if(k) apply(k, e.target.checked); });
    ov.querySelector('#stReset').addEventListener('click', function(){
      ITEMS.forEach(function(it){ if(it.k) apply(it.k, it.def); }); sync();
    });
  }
  function sync(){
    var o = read();
    ITEMS.forEach(function(it){ if(!it.k) return; var cb = ov.querySelector('input[data-k="' + it.k + '"]'); if(cb) cb.checked = val(o, it); });
  }
  function open(){ if(!ov) build(); sync(); ov.classList.add('open'); var c = ov.querySelector('.modal-close'); if(c) c.focus(); }
  function close(){ if(ov) ov.classList.remove('open'); }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && ov && ov.classList.contains('open')) close(); });
  var b = document.getElementById('setBtn'); if(b) b.addEventListener('click', open);
  classes(read());
})();
</script>
