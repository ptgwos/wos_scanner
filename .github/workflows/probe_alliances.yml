name: Probe alliances

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: probe-alliances
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe the API
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
          KID: "646"
        run: python tools/probe_alliances.py
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/alliances_probe.json
          if git diff --cached --quiet; then
            echo "No change."
          else
            git commit -m "Alliance probe result"
            git pull --rebase
            git push
          fi
