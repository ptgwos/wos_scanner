name: Update players

on:
  schedule:
    - cron: '17 */2 * * *'     # every 2 hours (UTC), minute 17 on purpose
  workflow_dispatch:           # "Run workflow" button for an update on demand

permissions:
  contents: write

concurrency:
  group: update-players
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fetch alliances and pictures
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
        run: python tools/update_players.py
      - name: Commit changes
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data avatars 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update players and avatars" && git pull --rebase && git push)
