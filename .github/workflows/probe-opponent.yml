name: Probe opponent state

# Manual only, one-off test: Actions -> "Probe opponent state" -> Run workflow. Result: data/probe/opponent.json
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe the API
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
        run: python tools/probe_opponent.py
      - name: Commit and push
        if: always()
        run: |
          git config user.name  "state646-bot"
          git config user.email "state646-bot@users.noreply.github.com"
          git add -A data/probe
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git commit -m "Opponent probe: data"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 10
          done
          exit 1
