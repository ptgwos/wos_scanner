<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>State 646 — Facility Schedule</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#0d0f14;--bg2:#161920;--bg3:#1e2230;--bg4:#252a3a;
  --border:#2a2d3e;--text:#e8eaf0;--muted:#8890a6;--muted2:#5a6280;
  --accent:#4f8ef7;--amber:#fbbf24;--green:#34d399;--red:#f87171;
  --purple:#a78bfa;--teal:#2dd4bf;
  --radius:10px;--radius-sm:7px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:3rem}

header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-link{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;font-size:13px;transition:color .12s}
.back-link:hover{color:var(--text)}
.header-divider{color:var(--border);font-size:18px}
.logo{display:flex;align-items:center;gap:8px;font-size:1.05rem;font-weight:600}
.logo i{color:var(--amber);font-size:20px}
.header-right{margin-left:auto;font-size:12px;color:var(--muted)}

.main{max-width:1100px;margin:0 auto;padding:2rem}

/* Week selector */
.week-bar{display:flex;gap:6px;margin-bottom:1.75rem;flex-wrap:wrap;align-items:center}
.week-bar-label{font-size:12px;color:var(--muted);margin-right:4px;white-space:nowrap}
.week-btn{font-size:12px;padding:5px 13px;border-radius:99px;border:1px solid var(--border);background:var(--bg2);color:var(--muted);cursor:pointer;transition:all .12s;white-space:nowrap}
.week-btn:hover{border-color:var(--muted);color:var(--text)}
.week-btn.active{background:rgba(79,142,247,.15);border-color:var(--accent);color:var(--accent);font-weight:500}
.week-btn.all{border-radius:var(--radius-sm)}

/* Section headers */
.section-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted2);margin-bottom:10px;margin-top:1.75rem;display:flex;align-items:center;gap:8px}
.section-label::after{content:'';flex:1;height:1px;background:var(--border)}
.section-label i{font-size:15px}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);margin-bottom:.5rem}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px}
thead th{background:var(--bg3);padding:9px 14px;text-align:left;font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0}
thead th.week-col{text-align:center;min-width:110px}
thead th.active-week{background:rgba(79,142,247,.1);color:var(--accent)}
tbody tr{border-bottom:1px solid var(--border);transition:background .08s}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:var(--bg3)}
tbody td{padding:8px 14px;vertical-align:top}
tbody td.facility-name{font-weight:500;white-space:nowrap;width:120px}
tbody td.alliance-cell{white-space:nowrap}
tbody td.week-cell{text-align:center;padding:6px 8px}
tbody td.week-cell.active-week{background:rgba(79,142,247,.05)}

/* Alliance badges */
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.badge-TBR{background:rgba(248,113,113,.15);color:#f87171;border:1px solid rgba(248,113,113,.3)}
.badge-AIR{background:rgba(79,142,247,.15);color:#4f8ef7;border:1px solid rgba(79,142,247,.3)}
.badge-FUQ{background:rgba(251,191,36,.15);color:#fbbf24;border:1px solid rgba(251,191,36,.3)}
.badge-OSM{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3)}
.badge-SFZ{background:rgba(167,139,250,.15);color:#a78bfa;border:1px solid rgba(167,139,250,.3)}
.badge-LUX{background:rgba(45,212,191,.15);color:#2dd4bf;border:1px solid rgba(45,212,191,.3)}
.badge-TbR{background:rgba(248,113,113,.08);color:#fca5a5;border:1px solid rgba(248,113,113,.2)}
.badge-default{background:var(--bg3);color:var(--muted);border:1px solid var(--border)}

/* Reward chips */
.reward{display:inline-block;font-size:11px;color:var(--muted);margin-top:3px}

/* Current week highlight */
.current-week-note{font-size:12px;color:var(--accent);display:flex;align-items:center;gap:5px;margin-bottom:1rem}
</style>
</head>
<body>

<header>
  <a class="back-link" href="index.html"><i class="ti ti-arrow-left"></i> Home</a>
  <span class="header-divider">/</span>
  <div class="logo"><i class="ti ti-building-fortress"></i> Facility Schedule</div>
  <span class="header-right">State 646</span>
</header>

<div class="main">

  <div class="week-bar">
    <span class="week-bar-label">Show week:</span>
    <button class="week-btn all active" onclick="setWeek(0)">All weeks</button>
    <button class="week-btn" onclick="setWeek(1)">Week 1</button>
    <button class="week-btn" onclick="setWeek(2)">Week 2</button>
    <button class="week-btn" onclick="setWeek(3)">Week 3</button>
    <button class="week-btn" onclick="setWeek(4)">Week 4</button>
    <button class="week-btn" onclick="setWeek(5)">Week 5</button>
    <button class="week-btn" onclick="setWeek(6)">Week 6</button>
    <button class="week-btn" onclick="setWeek(7)">Week 7</button>
    <button class="week-btn" onclick="setWeek(8)">Week 8</button>
    <button class="week-btn buff-btn" id="buff-toggle" onclick="toggleBuffs()" style="margin-left:8px;border-color:rgba(52,211,153,.4);color:var(--green)"><i class="ti ti-shield-bolt" style="font-size:14px"></i> Buffs only</button>
  </div>

  <!-- STRONGHOLDS -->
  <div class="section-label"><i class="ti ti-shield-half-filled" style="color:var(--amber)"></i> Strongholds</div>
  <div class="table-wrap">
    <table id="tbl-stronghold">
      <thead id="head-stronghold"></thead>
      <tbody id="body-stronghold"></tbody>
    </table>
  </div>

  <!-- FORTRESSES -->
  <div class="section-label"><i class="ti ti-building-fortress" style="color:var(--teal)"></i> Fortresses</div>
  <div class="table-wrap">
    <table id="tbl-fortress">
      <thead id="head-fortress"></thead>
      <tbody id="body-fortress"></tbody>
    </table>
  </div>

</div>

<script>
const WEEKS = 8;

const STRONGHOLDS = [
  { name: 'Stronghold 1', weeks: [
    {alliance:'TBR',reward:'Shards'},{alliance:'TBR',reward:'Pet Chest'},{alliance:'TBR',reward:'Hero Gear Chest'},{alliance:'TBR',reward:'Shards'},
    {alliance:'AIR',reward:'Shards'},{alliance:'AIR',reward:'Pet Chest'},{alliance:'AIR',reward:'Hero Gear Chest'},{alliance:'AIR',reward:'Shards'}
  ]},
  { name: 'Stronghold 2', weeks: [
    {alliance:'AIR',reward:'FCs'},{alliance:'AIR',reward:'Shards'},{alliance:'AIR',reward:'Pet Chest'},{alliance:'AIR',reward:'FCs'},
    {alliance:'TBR',reward:'FCs'},{alliance:'TBR',reward:'Shards'},{alliance:'TBR',reward:'Pet Chest'},{alliance:'TBR',reward:'FCs'}
  ]},
  { name: 'Stronghold 3', weeks: [
    {alliance:'FUQ',reward:'Hero Gear Chest'},{alliance:'FUQ',reward:'FCs'},{alliance:'FUQ',reward:'Shards'},{alliance:'FUQ',reward:'Pet Chest'},
    {alliance:'FUQ',reward:'Hero Gear Chest'},{alliance:'FUQ',reward:'FCs'},{alliance:'OSM',reward:'FCs'},{alliance:'FUQ',reward:'Pet Chest'}
  ]},
  { name: 'Stronghold 4', weeks: [
    {alliance:'OSM',reward:'Pet Chest'},{alliance:'OSM',reward:'Hero Gear Chest'},{alliance:'OSM',reward:'FCs'},{alliance:'OSM',reward:'Shards'},
    {alliance:'OSM',reward:'Pet Chest'},{alliance:'OSM',reward:'Hero Gear Chest'},{alliance:'FUQ',reward:'Shards'},{alliance:'OSM',reward:'Shards'}
  ]},
];

const FORTRESSES = [
  { name: 'Fortress 1', weeks: [
    {alliance:'SFZ',reward:'Shards'},{alliance:'SFZ',reward:'Health buff'},{alliance:'SFZ',reward:'Speedups'},{alliance:'SFZ',reward:'ATP'},
    {alliance:'SFZ',reward:'Wild marks'},{alliance:'SFZ',reward:'Health buff'},{alliance:'SFZ',reward:'Speedups'},{alliance:'SFZ',reward:'Gear enhancement'}
  ]},
  { name: 'Fortress 2', weeks: [
    {alliance:'LUX',reward:'ATP'},{alliance:'LUX',reward:'Shards'},{alliance:'LUX',reward:'Health buff'},{alliance:'LUX',reward:'Gear enhancement'},
    {alliance:'LUX',reward:'Gear enhancement'},{alliance:'LUX',reward:'Wild marks'},{alliance:'LUX',reward:'Health buff'},{alliance:'LUX',reward:'Speedups'}
  ]},
  { name: 'Fortress 3', weeks: [
    {alliance:'LUX',reward:'Speedups'},{alliance:'LUX',reward:'ATP'},{alliance:'LUX',reward:'Shards'},{alliance:'LUX',reward:'Health buff'},
    {alliance:'LUX',reward:'Speedups'},{alliance:'LUX',reward:'Gear enhancement'},{alliance:'LUX',reward:'Wild marks'},{alliance:'LUX',reward:'Health buff'}
  ]},
  { name: 'Fortress 4', weeks: [
    {alliance:'TBR',reward:'Health buff'},{alliance:'TBR',reward:'Speedups'},{alliance:'TBR',reward:'ATP'},{alliance:'TBR',reward:'Manuals'},
    {alliance:'TBR',reward:'ATP'},{alliance:'TBR',reward:'Speedups'},{alliance:'TBR',reward:'Gear enhancement'},{alliance:'TBR',reward:'Wild marks'}
  ]},
  { name: 'Fortress 5', weeks: [
    {alliance:'OSM',reward:'Shards'},{alliance:'OSM',reward:'Lethality buff'},{alliance:'OSM',reward:'Speedups'},{alliance:'OSM',reward:'Manuals'},
    {alliance:'OSM',reward:'Wild marks'},{alliance:'OSM',reward:'Lethality buff'},{alliance:'OSM',reward:'Speedups'},{alliance:'OSM',reward:'Gear enhancement'}
  ]},
  { name: 'Fortress 6', weeks: [
    {alliance:'TbR',reward:'ATP'},{alliance:'TbR',reward:'Shards'},{alliance:'TBR',reward:'Lethality buff'},{alliance:'TBR',reward:'Speedups'},
    {alliance:'TBR',reward:'Gear enhancement'},{alliance:'TBR',reward:'Wild marks'},{alliance:'TBR',reward:'Lethality buff'},{alliance:'TBR',reward:'Speedups'}
  ]},
  { name: 'Fortress 7', weeks: [
    {alliance:'TBR',reward:'Speedups'},{alliance:'TBR',reward:'ATP'},{alliance:'TbR',reward:'Shards'},{alliance:'TbR',reward:'ATP'},
    {alliance:'TbR',reward:'Speedups'},{alliance:'TbR',reward:'Gear enhancement'},{alliance:'TbR',reward:'Wild marks'},{alliance:'TbR',reward:'Lethality buff'}
  ]},
  { name: 'Fortress 8', weeks: [
    {alliance:'AIR',reward:'Lethality buff'},{alliance:'AIR',reward:'Speedups'},{alliance:'AIR',reward:'ATP'},{alliance:'AIR',reward:'Gear enhancement'},
    {alliance:'AIR',reward:'ATP'},{alliance:'AIR',reward:'Speedups'},{alliance:'AIR',reward:'Gear enhancement'},{alliance:'AIR',reward:'Wild marks'}
  ]},
  { name: 'Fortress 9', weeks: [
    {alliance:'SFZ',reward:'Shards'},{alliance:'SFZ',reward:'Deployment buff'},{alliance:'SFZ',reward:'Speedups'},{alliance:'SFZ',reward:'Lethality buff'},
    {alliance:'SFZ',reward:'Wild marks'},{alliance:'SFZ',reward:'Deployment buff'},{alliance:'SFZ',reward:'Speedups'},{alliance:'SFZ',reward:'Gear enhancement'}
  ]},
  { name: 'Fortress 10', weeks: [
    {alliance:'AIR',reward:'ATP'},{alliance:'AIR',reward:'Shards'},{alliance:'AIR',reward:'Deployment buff'},{alliance:'AIR',reward:'Manuals'},
    {alliance:'AIR',reward:'Gear enhancement'},{alliance:'AIR',reward:'Wild marks'},{alliance:'AIR',reward:'Deployment buff'},{alliance:'AIR',reward:'Speedups'}
  ]},
  { name: 'Fortress 11', weeks: [
    {alliance:'OSM',reward:'Speedups'},{alliance:'OSM',reward:'ATP'},{alliance:'OSM',reward:'Shards'},{alliance:'OSM',reward:'Manuals'},
    {alliance:'OSM',reward:'Speedups'},{alliance:'OSM',reward:'Gear enhancement'},{alliance:'OSM',reward:'Wild marks'},{alliance:'OSM',reward:'Deployment buff'}
  ]},
  { name: 'Fortress 12', weeks: [
    {alliance:'FUQ',reward:'Deployment buff'},{alliance:'FUQ',reward:'Speedups'},{alliance:'FUQ',reward:'ATP'},{alliance:'FUQ',reward:'Speedups'},
    {alliance:'FUQ',reward:'ATP'},{alliance:'FUQ',reward:'Speedups'},{alliance:'FUQ',reward:'Gear enhancement'},{alliance:'FUQ',reward:'Wild marks'}
  ]},
];

let activeWeek = 0; // 0 = all
let buffsOnly = false;
const BUFFS = ['Health buff', 'Lethality buff', 'Deployment buff'];

function badgeClass(a) {
  return ['TBR','TbR','AIR','FUQ','OSM','SFZ','LUX'].includes(a) ? 'badge-'+a : 'badge-default';
}

function renderHead(id, activeWeek) {
  const el = document.getElementById(id);
  let cols = '<th>Facility</th>';
  if (activeWeek === 0) {
    for (let w = 1; w <= WEEKS; w++)
      cols += `<th class="week-col">Week ${w}</th>`;
  } else {
    cols += `<th class="week-col active-week">Week ${activeWeek}</th>`;
  }
  el.innerHTML = `<tr>${cols}</tr>`;
}

function renderBody(id, rows, activeWeek) {
  const el = document.getElementById(id);
  el.innerHTML = rows.map(row => {
    const w = activeWeek === 0 ? row.weeks : [row.weeks[activeWeek - 1]];
    const weekCells = w.map((wk, i) => {
      const wIdx = activeWeek === 0 ? i + 1 : activeWeek;
      const isBuff = BUFFS.includes(wk.reward);
      const dim = buffsOnly && !isBuff;
      return `<td class="week-cell${activeWeek===0&&wIdx===activeWeek?' active-week':''}" style="${dim?'opacity:.15;':''}">
        <span class="badge ${badgeClass(wk.alliance)}">${wk.alliance}</span><br>
        <span class="reward">${wk.reward}</span>
      </td>`;
    }).join('');
    return `<tr>
      <td class="facility-name">${row.name}</td>
      ${weekCells}
    </tr>`;
  }).join('');
}

function render() {
  renderHead('head-stronghold', activeWeek);
  renderHead('head-fortress', activeWeek);
  renderBody('body-stronghold', STRONGHOLDS, activeWeek);
  renderBody('body-fortress', FORTRESSES, activeWeek);

  document.querySelectorAll('.week-btn:not(.buff-btn)').forEach((btn, i) => {
    btn.classList.toggle('active', i === activeWeek);
  });

  const buffBtn = document.getElementById('buff-toggle');
  if (buffsOnly) {
    buffBtn.style.background = 'rgba(52,211,153,.15)';
    buffBtn.style.borderColor = 'var(--green)';
    buffBtn.style.color = 'var(--green)';
  } else {
    buffBtn.style.background = '';
    buffBtn.style.borderColor = 'rgba(52,211,153,.4)';
    buffBtn.style.color = 'var(--green)';
  }
}

function setWeek(w) { activeWeek = w; render(); }
function toggleBuffs() { buffsOnly = !buffsOnly; render(); }

render();
</script>
</body>
</html>
