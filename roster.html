<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b15;
    --bg-2:#0a0f1c;
    --panel:#0f1626;
    --panel-2:#141d33;
    --border:#1f2c47;
    --border-soft:#182236;
    --ice:#6fe3ff;
    --ice-dim:#3a8fae;
    --frost:#4f7cff;
    --gold:#ffb400;
    --silver:#9fb2cc;
    --text:#e7edf7;
    --text-dim:#8a9bbd;
    --text-faint:#5b6c8c;
    --state646:#ffb400;
    --state657:#7f8fb0;
    --good:#43e6a0;
    --danger:#ff5d73;
    --strong:#fff;
    --stk-sel:#122338;
    --hit-hover:#18233d;
    --on-ice:#00151c;
    --halo:#0f1626;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f3f6fb;
    --bg-2:#eaeff7;
    --panel:#ffffff;
    --panel-2:#eef2f9;
    --border:#cdd6e5;
    --border-soft:#e1e7f1;
    --ice:#0b7fa6;
    --ice-dim:#4f93ad;
    --frost:#3b62d9;
    --gold:#a86f00;
    --silver:#6b7d99;
    --text:#16213a;
    --text-dim:#4a5b7b;
    --text-faint:#7384a3;
    --state646:#c98600;
    --state657:#6b7d99;
    --good:#0e9a68;
    --danger:#d02e48;
    --strong:#0b1426;
    --stk-sel:#dcebf6;
    --hit-hover:#e6edf8;
    --on-ice:#ffffff;
    --halo:#ffffff;
    color-scheme:light;
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(11,127,166,0.07), transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] tbody tr:hover{background:rgba(11,127,166,0.06);}
  :root[data-theme="light"] tbody tr.row-sel{background:rgba(11,127,166,0.10);}
  :root[data-theme="light"] .sel-bar{box-shadow:0 -6px 24px rgba(20,35,70,.18);}
  :root[data-theme="light"] #tooltip{background:rgba(255,255,255,.98);box-shadow:0 12px 36px rgba(20,35,70,.22);}
  :root[data-theme="light"] .btn{background:linear-gradient(180deg, rgba(11,127,166,.14), rgba(11,127,166,.04));}
  :root[data-theme="light"] .sx-chip{background:rgba(20,35,70,.03);}
  :root[data-theme="light"] .ttq,:root[data-theme="light"] .phase-note{background:rgba(11,127,166,.05);}
  :root[data-theme="light"] .state-bar .seg.s657{background:linear-gradient(180deg,#8d9db8,#6b7d99);color:#fff;}
  :root[data-theme="light"] .switch input:checked + .switch-track{background:rgba(201,134,0,.2);}
  /* theme toggle (top right) */
  header{position:relative;}
  .theme-toggle{position:absolute;top:0;right:0;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;padding:0;}
  .theme-toggle:hover{color:var(--strong);border-color:var(--ice-dim);}
  .theme-toggle svg{width:19px;height:19px;display:block;}
  .theme-toggle .i-sun{display:none;}
  :root[data-theme="light"] .theme-toggle .i-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,227,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ice-dim);
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ice-dim);display:inline-block;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  h1 span{color:var(--ice);}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}

  .divider{width:100%;height:1px;background:var(--border);margin:18px 0 26px;}

  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{
    position:relative;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--ice-dim);}
  .tab.active{
    color:var(--ice);
    background:linear-gradient(180deg, rgba(111,227,255,0.10), rgba(111,227,255,0.02));
    border-color:var(--ice);
    box-shadow:0 0 0 1px rgba(111,227,255,.15), 0 0 18px rgba(111,227,255,.12);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
  }
  select,input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    min-width:150px;
  }
  select:focus,input:focus{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    letter-spacing:.03em;
    border-radius:4px;
    cursor:pointer;
    transition:all .12s;
  }
  .seg button:hover{color:var(--text);border-color:var(--ice-dim);}
  .seg button.nodata{opacity:.5;}
  .seg button.active{
    color:var(--on-ice);
    background:var(--ice);
    border-color:var(--ice);
    font-weight:600;
  }
  .count-pill{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
  }

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--ice);}
  thead th.sorted{color:var(--ice);}
  thead th .arrow{font-size:10px;margin-left:4px;opacity:.8;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:rgba(111,227,255,0.04);}
  tbody td{padding:9px 12px;color:var(--text);}
  td.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:var(--text);}
  .namecell{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .days{display:inline-flex;gap:4px;flex:none;}
  body.nodots .days{display:none;}
  .sw-pair{display:inline-flex;align-items:center;gap:22px;align-self:flex-end;flex-wrap:wrap;}
  .sw-pair .switch{width:auto !important;align-self:center;}
  @media (max-width:640px){ .sw-pair{align-self:flex-start;} .switch.dots-sw, .switch.whale-sw, .switch.av-sw{justify-content:flex-start;align-self:flex-start;width:auto;padding:2px 0;} }
  .rt{display:inline-flex;align-items:center;gap:10px;flex:none;}
  .wins{display:inline-flex;gap:1px;align-items:center;padding:2px 8px;border:1px solid var(--border);border-radius:999px;vertical-align:middle;}
  .ws{width:14px;height:14px;display:block;}
  .nm{display:inline-flex;align-items:center;gap:6px;min-width:0;}
  .medals{display:inline-flex;gap:3px;flex:none;}
  .medal{width:17px;height:17px;display:block;}
  @media (max-width:640px){
    .namecell{flex-direction:column;align-items:flex-start;gap:5px;}
    .nm .nt{max-width:96px;overflow:hidden;text-overflow:ellipsis;}
    #tableWrap th.stk, #tableWrap td.stk{position:sticky;z-index:1;background:var(--panel);padding-left:5px;padding-right:5px;}
    #tableWrap thead th.stk{z-index:3;}
    #tableWrap tr.row-sel td.stk{background:var(--stk-sel);}
    #tableWrap td.stk.name-stk{box-shadow:1px 0 0 var(--border);}
    #tableWrap tr.rank-cutoff td{border-bottom:0;box-shadow:inset 0 -2px 0 var(--danger);}
    #tableWrap tr.rank-cutoff td.stk.name-stk{box-shadow:1px 0 0 var(--border), inset 0 -2px 0 var(--danger);}
    #tableWrap th.selcol.stk, #tableWrap td.selcol.stk{padding-left:8px;padding-right:2px;}
  }
  .dd{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-faint);box-sizing:border-box;}
  .dd.on{background:var(--ice);border-color:var(--ice);}
  .dd.na{opacity:.3;border-style:dashed;}
  td.srank{color:var(--ice-dim);}
  td.rank{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--text-dim);width:44px;}
  .row-646{border-left:2px solid var(--state646);}
  .row-646 td.name{font-weight:700;color:var(--strong);}
  .row-nb td.name{font-weight:700;color:var(--strong);}
  .row-646 td.state{color:var(--state646);font-weight:700;}
  .row-away td.state{color:var(--state657);}
  tbody tr.rank-cutoff td{border-bottom:2px solid var(--danger);}
  .tag{
    display:inline-block;

  /* row selection + running total (Player / Alliance tabs) */
  th.selcol,td.selcol{width:34px;padding-left:10px;padding-right:0;text-align:center;}

  #selTotal{position:sticky;bottom:12px;z-index:50;margin-top:14px;}  /* below modal (100) and tooltip (200) */
  .sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 16px;background:var(--panel-2);border:1px solid var(--ice-dim);border-radius:10px;box-shadow:0 -6px 24px rgba(0,0,0,.45);}
  .sel-total{font-size:16px;color:var(--text);}

  .sel-meta{font-size:12.5px;color:var(--text-dim);}
  .sel-compare{margin-left:auto;background:var(--ice);color:var(--on-ice);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
  .sel-compare:hover{filter:brightness(1.1);}
  .sel-clear{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;}

  /* state share stat bar */
  .state-stats{margin-bottom:16px;}

    display:flex;justify-content:space-between;
    font-size:12px;color:var(--text-dim);margin-bottom:6px;
  }

  .state-stats-labels .l646{color:var(--state646);}
  .state-stats-labels .l657{color:var(--state657);}
  .state-bar{
    display:flex;width:100%;height:22px;border-radius:4px;overflow:hidden;
    border:1px solid var(--border);background:var(--panel-2);
  }
  .state-bar .seg{
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-family:'Inter',sans-serif;
    white-space:nowrap;overflow:hidden;
    transition:width .25s ease;
  }
  .state-bar .seg.s646{background:linear-gradient(180deg, var(--state646), #cc8f00);color:#231400;}
  .state-bar .seg.s657{background:linear-gradient(180deg, #5c6f92, #3d4c6b);color:#eef1f8;}

  /* chests */
  .chest-config{
    display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;
    margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);
  }
  .slider-block{flex:1;min-width:260px;}
  .slider-labels{display:flex;justify-content:space-between;font-family:'Inter',sans-serif;font-size:12.5px;margin-bottom:8px;}
  .slider-labels .a{color:var(--ice);}
  .slider-labels .b{color:var(--frost);}
  input[type="range"]{
    width:100%;height:4px;-webkit-appearance:none;appearance:none;
    background:linear-gradient(90deg, var(--ice), var(--frost));
    border-radius:2px;outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ice);cursor:pointer;
    box-shadow:0 0 8px rgba(111,227,255,.6);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ice);cursor:pointer;
  }
  .formula-note{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  select.chest-select{min-width:100px;padding:6px 8px;font-size:12.5px;}
  select.chest-select.big{border-color:var(--gold);color:var(--gold);}
  select.chest-select.small{border-color:var(--silver);color:var(--silver);}

  .copy-bar{
    display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;
    background:linear-gradient(180deg, rgba(111,227,255,.18), rgba(111,227,255,.05));
    border:1px solid var(--ice);
    color:var(--ice);
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
    transition:all .15s;
  }
  .btn:hover{background:rgba(111,227,255,.22);box-shadow:0 0 16px rgba(111,227,255,.2);}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .copy-status{font-size:12.5px;color:var(--good);opacity:0;transition:opacity .2s;}
  .copy-status.show{opacity:1;}
  .chest-summary{font-size:12.5px;color:var(--text-faint);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  footer{margin-top:36px;text-align:center;color:var(--text-faint);font-size:11.5px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  /* modal */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(3,6,12,0.72);
    z-index:100;
    align-items:center;justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;

    display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.5);

    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px 0;
  }

    font-family:'Inter',sans-serif;font-weight:700;font-size:18px;margin:0;color:var(--ice);

  #tableWrap, #chestTableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  }

  /* controls layout: phase buttons get their own row, filters + actions sit together below */
  #controls > .field:first-child{flex:1 1 100%;}

  /* switch */
  .switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;align-self:flex-end;padding:8px 0;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch-track{width:38px;height:22px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);position:relative;transition:background .2s,border-color .2s;flex:none;}
  .switch-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .2s,background .2s;}
  .switch input:checked + .switch-track{background:rgba(255,180,0,.18);border-color:var(--state646);}
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(16px);background:var(--state646);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--ice-dim);outline-offset:2px;}
  .switch-label{font-size:13px;color:var(--text-dim);font-weight:500;}
  .switch input:checked ~ .switch-label{color:var(--text);}

  /* tooltip */
  #tooltip{
    position:fixed;z-index:200;pointer-events:none;
    min-width:240px;max-width:310px;
    background:rgba(10,15,28,.97);border:1px solid var(--ice-dim);border-radius:8px;
    padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.55);
    opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;
    font-size:12px;
  }
  #tooltip{visibility:hidden;transition:opacity .12s ease,transform .12s ease,visibility 0s linear .12s;}
  #tooltip.show{opacity:1;transform:none;visibility:visible;transition-delay:0s;}
  .tt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .tt-head b{font-size:13.5px;color:var(--strong);}
  .tt-state{font-size:11px;font-weight:700;color:var(--state657);}
  .tt-state.home{color:var(--state646);}
  .tt-id{color:var(--text-faint);font-size:11.5px;margin-bottom:8px;}

  .tt-bar span{font-size:9.5px;color:var(--text-faint);}

  .tt-table td{padding:2px 0;border:none;color:var(--text-dim);}
  .tt-table td.r{text-align:right;color:var(--text-faint);padding-right:10px;}
  .tt-table td.p{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}
  .tt-note{margin-top:6px;font-size:10.5px;color:var(--text-faint);}

  .ttq{margin:8px 0 10px;padding:8px 10px;background:rgba(111,227,255,.05);border:1px solid var(--border);border-radius:6px;}
  .ttq-t{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ice-dim);margin-bottom:6px;font-weight:600;}
  .ttq-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--text-dim);margin-top:5px;}
  .ttq-r b{color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums;}
  .ttq-n{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;margin-top:1px;}
  .ttq-n.warn{color:var(--gold);font-size:10.5px;line-height:1.35;margin:5px 0 2px;}
  .ttq-m{height:4px;border-radius:2px;background:var(--border);margin-top:3px;overflow:hidden;}
  .ttq-m i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),var(--frost));border-radius:2px;}

  /* battle phase / castle: note, contribution bar, battle alliance flag */

  @media (hover:none){

  @media (max-width:640px){ .hide-s{display:none;} .ro-ov .aflag{display:none;} .ro-ov .wins{display:none;} .ro-t .ro-i{display:none;} }

<div class="wrap">

  <header>

<script>
(function(){
  const TAGS = ['AIR', 'BLP', 'TBR', 'TbR', 'osm', 'OMG', 'PKB', 'GYN'];
  const BATTLE = ['PKB', 'GYN'];
  const fmt = n => (n == null ? '–' : Number(n).toLocaleString('de-DE'));
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const TAG_RED = {bg:'#b8283a', fg:'#ffffff', bd:'#b8283a'};
  const TAG_GOLD = {bg:'#f2b705', fg:'#2a1b00', bd:'#f2b705'};
  const TAG_COLORS = {
    BLP: TAG_RED, OSM: TAG_RED,
    osm: {bg:'#ff8f8f', fg:'#2b0509', bd:'#ff8f8f'},
    AIR: {bg:'#2563eb', fg:'#ffffff', bd:'#2563eb'},
    TBR: {bg:'#1e8449', fg:'#ffffff', bd:'#1e8449'},
    TbR: {bg:'#86e3a1', fg:'#052311', bd:'#86e3a1'},
    PKB: TAG_GOLD, GYN: TAG_GOLD   // battle alliances
  };
  // banner symbols won by the battle alliances (moons = gold crescents, stars = blue stars); update after won events
  const WIN_SYMBOLS = {PKB: {moon: 4, star: 2}, GYN: {star: 1}};
  const MOON_SVG = '<svg class="ws" viewBox="0 0 20 20" aria-hidden="true"><path d="M13.6 2.2a8 8 0 1 0 4.2 12.6 6.6 6.6 0 0 1-4.2-12.6z" fill="#f7c948" stroke="#a97400" stroke-width="1"/></svg>';
  const STAR_SVG = '<svg class="ws" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 1.8l2.4 5.1 5.6.7-4.1 3.9 1 5.5L10 14.3 5.1 17l1-5.5L2 7.6l5.6-.7z" fill="#5aa9ff" stroke="#2a5fa8" stroke-width="1" stroke-linejoin="round"/></svg>';
  const TAG_HOME_PLAIN = {bg:'#3a4357', fg:'#dfe6f2', bd:'#4d5873'};
  function tagChip(tag, s){
    const label = escapeHtml(tag || '—');
    const c = TAG_COLORS[tag] || TAG_HOME_PLAIN;
    return `<span class="tag tag-c" style="background:${c.bg};color:${c.fg};border-color:${c.bd}">${label}</span>`;
  }
  function winsHtml(tag){
    const w = WIN_SYMBOLS[tag]; if(!w) return '';
    const m = w.moon || 0, s = w.star || 0;
    const title = [m ? m + ' gold moon' + (m > 1 ? 's' : '') : '', s ? s + ' blue star' + (s > 1 ? 's' : '') : ''].filter(Boolean).join(', ') + ' on the alliance banner';
    return `<span class="wins" title="${title}" role="img" aria-label="${title}">${MOON_SVG.repeat(m)}${STAR_SVG.repeat(s)}</span>`;
  }

  // ---- preferences (shared with svslb.html: same keys, localStorage + cookie backup) ----
  const PREF_KEY = 'svs646_prefs';
  const PREFS = (() => {
    let o = null;
    try { o = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); } catch(e) {}
    if(!o){ try { const m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {};
  })();
  function prefSet(k, v){
    PREFS[k] = v; const s = JSON.stringify(PREFS);
    try { localStorage.setItem(PREF_KEY, s); } catch(e) {}
    try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
  }
  const st = {q: '', sort: 'power', av: PREFS.av !== false};

  function fcHtml(lv){
    lv = Number(lv);
    if(!lv || lv < 1) return '–';
    if(lv >= 35){
      const n = Math.min(10, Math.floor(lv / 5) - 6);   // 35-39 -> 1, 40-44 -> 2, ..., 75-79 -> 9, 80+ -> 10
      const t = 'Furnace level ' + lv + ' (FC' + n + ')';
      return `<img class="fc" src="${FC_IMG[n]}" alt="FC${n}" title="${t}">`;
    }
    const f = lv >= 30 ? 30 : lv;
    return `<span class="fc-t" title="Furnace level ${lv}">F${f}</span>`;
  }
  const rk = r => (r === 'Leader' ? 'R5' : (r || ''));   // the game calls rank 5 'Leader', the board says R5
  let D = null;
  const RANKN = {'Leader': 6, 'R5': 5, 'R4': 4, 'R3': 3, 'R2': 2, 'R1': 1};

  function av(id, p){
    if(!st.av) return '';
    if(p.au) return `<img class="av" loading="lazy" decoding="async" width="22" height="22" src="avatars/${escapeHtml(id)}.webp" alt="" onerror="this.remove()">`;
    return `<span class="av ph" aria-hidden="true">${escapeHtml((Array.from(String(p.n || '?'))[0] || '?').toUpperCase())}</span>`;
  }
  function members(tag){
    const A = D.alliances[tag]; if(!A) return [];
    let ids = A.m;
    if(!ids) ids = Object.keys(D.players).filter(k => D.players[k].a === tag);
    return ids.filter(id => D.players[id]).map(id => Object.assign({id}, D.players[id]));
  }
  function sortRows(rows){
    const f = {
      power: (a, b) => (b.p || 0) - (a.p || 0),
      rank: (a, b) => (RANKN[b.r] || 0) - (RANKN[a.r] || 0) || (b.p || 0) - (a.p || 0),
      name: (a, b) => a.n.localeCompare(b.n, 'en', {sensitivity: 'base'})
    }[st.sort];
    return rows.slice().sort(f);
  }
  function match(r){
    if(!st.q) return true;
    const q = st.q.toLowerCase();
    return r.n.toLowerCase().includes(q) || r.id.includes(q);
  }
  function nameChip(tag){ return tagChip(tag, '646'); }
  function render(){
    if(!D) return;
    const tags = TAGS.filter(t => D.alliances[t]).sort((a, b) => (D.alliances[b].power || 0) - (D.alliances[a].power || 0));   // strongest alliance first
    let totalM = 0, totalP = 0;
    tags.forEach(t => { const A = D.alliances[t]; totalM += (A.m || []).length || A.count || 0; });
    // overview
    const ovRows = tags.map(t => {
      const A = D.alliances[t], n = (A.m || []).length || A.count || 0;
      const isB = BATTLE.includes(t);
      totalP += A.power || 0;
      return `<tr data-go="${escapeHtml(t)}"><td>${nameChip(t)}${isB ? '<span class="aflag">Battle alliance</span>' : ''}${winsHtml(t)}</td><td class="nm-col hide-s"><b>${escapeHtml(A.name || '')}</b></td><td class="num">${fmt(n)}</td><td class="num">${fmt(A.power)}</td><td class="num hide-s">${A.power_rank ? '#' + A.power_rank : '–'}</td><td class="hide-s">${escapeHtml(A.leader || '')}</td></tr>`;
    }).join('');
    document.getElementById('ov').innerHTML = `<div class="sx-card"><div class="sx-card-head"><b>Alliances</b><span class="sx-id">${tags.length} alliances · ${fmt(totalM)} members · power ${fmt(totalP)}</span></div>
      <div class="sx-scroll"><table class="ro-ov"><thead><tr><th>Alliance</th><th class="hide-s">Name</th><th class="num">Members</th><th class="num">Power</th><th class="num hide-s">State rank</th><th class="hide-s">Leader</th></tr></thead><tbody>${ovRows}</tbody></table></div></div>`;
    // cards
    let shown = 0;
    const cards = tags.map(t => {
      const A = D.alliances[t];
      const all = members(t);
      const rows = sortRows(all.filter(match));
      if(st.q && !rows.length) return '';
      shown += rows.length;
      const isB = BATTLE.includes(t);
      const isOpen = open.has(t) || !!st.q;
      const body = !isOpen ? '' : rows.map((r, i) => `<tr data-pid="${escapeHtml(r.id)}"><td class="ro-i">${i + 1}</td><td class="name"><span class="nm">${av(r.id, r)}<span class="nt">${escapeHtml(r.n)}</span></span></td><td><span class="ro-rk ro-${escapeHtml(rk(r.r))}">${escapeHtml(rk(r.r))}</span></td><td class="num">${fmt(r.p)}</td><td class="num fc-col">${fcHtml(r.f)}</td></tr>`).join('');
      return `<div class="sx-card ro-card${isOpen ? ' is-open' : ''}" id="al-${escapeHtml(t)}"><div class="sx-card-head ro-head" role="button" tabindex="0" aria-expanded="${isOpen}" data-t="${escapeHtml(t)}" title="Show or hide the members"><span class="ro-chev" aria-hidden="true">▸</span>${nameChip(t)}<b>${escapeHtml(A.name || t)}</b>${isB ? '<span class="aflag">Battle alliance</span>' : ''}${winsHtml(t)}<span class="sx-id">${fmt(all.length)} members · power ${fmt(A.power)}${A.power_rank ? ' · rank #' + A.power_rank + ' in the state' : ''}${A.leader ? ' · leader ' + escapeHtml(A.leader) : ''}${st.q ? ' · ' + rows.length + ' match' + (rows.length === 1 ? '' : 'es') : ''}</span></div>
        ${isOpen ? `<div class="sx-scroll"><table class="ro-t"><thead><tr><th class="ro-i">#</th><th>Member</th><th>Rank</th><th class="num">Power</th><th class="num fc-col" title="Furnace level"><span class="d-only">Furnace</span><span class="m-only">FC</span></th></tr></thead><tbody>${body}</tbody></table></div>` : ''}</div>`;
    }).join('');
    document.getElementById('cards').innerHTML = cards || '<div class="sx-card"><div class="sx-card-head"><b>No player found</b></div></div>';
    const missing = TAGS.filter(t => !D.alliances[t]);
    document.getElementById('note').innerHTML = 'Current members as of the last data update; power and furnace level are the values in the game, not event points. Players keep their place in the SvS leaderboards of the events they played in.' + (missing.length ? ' Not available yet: ' + missing.map(escapeHtml).join(', ') + '.' : '') + ' Profile pictures © Century Games.';
    document.getElementById('sub').textContent = tags.length + ' alliances · ' + fmt(totalM) + ' members' + (D.updated ? ' · last change ' + D.updated : '');
    document.querySelectorAll('#ov tr[data-go]').forEach(tr => tr.addEventListener('click', () => { open.add(tr.dataset.go); render(); const el = document.getElementById('al-' + tr.dataset.go); if(el) el.scrollIntoView({behavior: 'smooth', block: 'start'}); }));
    const eb = document.getElementById('expAll'); if(eb) eb.textContent = (tags.length && tags.every(t => open.has(t))) ? 'Collapse all' : 'Expand all';
  }
  // ---- expand / collapse ----
  const cardsEl = document.getElementById('cards');
  function toggle(t){ if(open.has(t)) open.delete(t); else open.add(t); render(); }
  cardsEl.addEventListener('click', e => { const h = e.target.closest('.ro-head'); if(h) toggle(h.dataset.t); });
  cardsEl.addEventListener('keydown', e => { if((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('ro-head')){ e.preventDefault(); toggle(e.target.dataset.t); } });
  document.getElementById('expAll').addEventListener('click', () => {
    const tags = TAGS.filter(t => D && D.alliances[t]);
    if(tags.every(t => open.has(t))) open.clear(); else tags.forEach(t => open.add(t));
    render();
  });
  // ---- controls ----
  const rq = document.getElementById('rq'), rs = document.getElementById('rs'), avSw = document.getElementById('avSw');
  avSw.checked = st.av;
  let tm = null;
  rq.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { st.q = rq.value.trim(); render(); }, 150); });
  rs.addEventListener('change', () => { st.sort = rs.value; render(); });
  avSw.addEventListener('change', () => { st.av = avSw.checked; prefSet('av', st.av); render(); });
  // ---- hover popup (desktop) / bottom sheet on tap (touch), same look as on the board ----
  const NO_HOVER = window.matchMedia && window.matchMedia('(hover: none)').matches;
  const tipEl = document.createElement('div'); tipEl.id = 'tooltip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl);
  let tipKey = '', tipTimer = null, pendKey = '', lx = 0, ly = 0;
  function memberTip(id){
    const p = D && D.players[id]; if(!p) return '';
    const big = st.av ? (p.au ? `<img class="av xl" src="avatars/${escapeHtml(id)}.webp" alt="" onerror="this.remove()">` : `<span class="av ph xl" aria-hidden="true">${escapeHtml((Array.from(String(p.n || '?'))[0] || '?').toUpperCase())}</span>`) : '';
    const lv = Number(p.f);
    return `<div class="tt-head">${big}<div><b>${escapeHtml(p.n)}</b><div class="tt-id">ID: ${escapeHtml(id)}</div></div></div>
      <table class="tt-table">
        <tr><td class="r">Alliance</td><td>${tagChip(p.a)}</td></tr>
        <tr><td class="r">Rank</td><td><span class="ro-rk ro-${escapeHtml(rk(p.r))}">${escapeHtml(rk(p.r))}</span></td></tr>
        <tr><td class="r">Power</td><td class="p">${fmt(p.p)}</td></tr>
        <tr><td class="r">Furnace</td><td><span class="tt-fc">${fcHtml(p.f)}${lv ? `<span>Level ${lv}${lv >= 35 ? ' (FC' + Math.min(10, Math.floor(lv / 5) - 6) + ')' : ''}</span>` : ''}</span></td></tr>
      </table>${NO_HOVER ? '<div class="tt-note">Tap outside to close</div>' : ''}`;
  }
  function placeTip(x, y){
    if(NO_HOVER) return;
    const pad = 14, w = tipEl.offsetWidth, h = tipEl.offsetHeight;
    let left = x + pad, top = y + pad;
    if(left + w > window.innerWidth - 8) left = x - w - pad;
    if(left < 8) left = 8;
    if(top + h > window.innerHeight - 8) top = Math.max(8, window.innerHeight - 8 - h);
    tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
  }
  function showTip(id, x, y){
    if(id !== tipKey){ const h = memberTip(id); if(!h){ hideTip(); return; } tipEl.innerHTML = h; tipEl.scrollTop = 0; tipKey = id; }
    tipEl.classList.add('show'); placeTip(x, y);
  }
  function hideTip(){ clearTimeout(tipTimer); pendKey = ''; tipEl.classList.remove('show'); tipKey = ''; }
  function schedTip(id, x, y){
    lx = x; ly = y;
    if(tipEl.classList.contains('show')){ showTip(id, x, y); return; }
    if(pendKey === id) return;
    clearTimeout(tipTimer); pendKey = id;
    tipTimer = setTimeout(() => { pendKey = ''; showTip(id, lx, ly); }, 400);
  }
  if(!NO_HOVER){
    cardsEl.addEventListener('mousemove', e => { const tr = e.target.closest('.ro-t tbody tr[data-pid]'); if(!tr){ hideTip(); return; } schedTip(tr.dataset.pid, e.clientX, e.clientY); });
    cardsEl.addEventListener('mouseleave', hideTip);
  } else {
    cardsEl.addEventListener('click', e => { const tr = e.target.closest('.ro-t tbody tr[data-pid]'); if(!tr) return; e.stopPropagation(); showTip(tr.dataset.pid, 0, 0); });
    document.addEventListener('click', e => { if(!tipEl.contains(e.target)) hideTip(); });
  }
  window.addEventListener('scroll', hideTip, {passive: true});
  // ---- theme (same keys as svslb.html) ----
  (function(){
    const root = document.documentElement;
    function apply(t){
      if(t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme');
      const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t === 'light' ? '#f3f6fb' : '#070b15');
    }
    let t = 'dark'; try { if(localStorage.getItem('svs-theme') === 'light') t = 'light'; } catch(e) {}
    if(t === 'dark'){ try { if(/(?:^|; )svs_theme=light/.test(document.cookie)) t = 'light'; } catch(e) {} }
    apply(t);
    document.getElementById('themeToggle').addEventListener('click', () => {
      const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      apply(next);
      try { localStorage.setItem('svs-theme', next); } catch(e) {}
      try { document.cookie = 'svs_theme=' + next + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
    });
  })();
  fetch('data/players.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : Promise.reject()).then(j => { D = j; D.alliances = D.alliances || {}; D.players = D.players || {}; render(); })
    .catch(() => { document.getElementById('sub').textContent = 'No data available (data/players.json not found).'; });
})();
</script>

<script>
(function(){var b=document.getElementById('toTop');if(!b)return;function u(){b.classList.toggle('show',(window.pageYOffset||document.documentElement.scrollTop)>400)}window.addEventListener('scroll',u,{passive:true});u();b.addEventListener('click',function(){window.scrollTo({top:0,behavior:'smooth'})})})();
</script>
