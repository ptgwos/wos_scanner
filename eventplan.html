<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070b15;
    --bg-2:#0a0f1c;
    --panel:#0f1626;
    --panel-2:#141d33;
    --border:#1f2c47;
    --border-soft:#182236;
    --ice:#6fe3ff;
    --ice-dim:#3a8fae;
    --frost:#4f7cff;
    --gold:#ffb400;
    --silver:#9fb2cc;
    --text:#e7edf7;
    --text-dim:#8a9bbd;
    --text-faint:#5b6c8c;
    --state646:#ffb400;
    --state657:#7f8fb0;
    --good:#43e6a0;
    --danger:#ff5d73;
    --strong:#fff;
    --stk-sel:#122338;
    --hit-hover:#18233d;
    --on-ice:#00151c;
    --halo:#0f1626;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f3f6fb;
    --bg-2:#eaeff7;
    --panel:#ffffff;
    --panel-2:#eef2f9;
    --border:#cdd6e5;
    --border-soft:#e1e7f1;
    --ice:#0b7fa6;
    --ice-dim:#4f93ad;
    --frost:#3b62d9;
    --gold:#a86f00;
    --silver:#6b7d99;
    --text:#16213a;
    --text-dim:#4a5b7b;
    --text-faint:#7384a3;
    --state646:#c98600;
    --state657:#6b7d99;
    --good:#0e9a68;
    --danger:#d02e48;
    --strong:#0b1426;
    --stk-sel:#dcebf6;
    --hit-hover:#e6edf8;
    --on-ice:#ffffff;
    --halo:#ffffff;
    color-scheme:light;
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(11,127,166,0.07), transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] tbody tr:hover{background:rgba(11,127,166,0.06);}
  :root[data-theme="light"] tbody tr.row-sel{background:rgba(11,127,166,0.10);}
  :root[data-theme="light"] .sel-bar{box-shadow:0 -6px 24px rgba(20,35,70,.18);}
  :root[data-theme="light"] #tooltip{background:rgba(255,255,255,.98);box-shadow:0 12px 36px rgba(20,35,70,.22);}
  :root[data-theme="light"] .btn{background:linear-gradient(180deg, rgba(11,127,166,.14), rgba(11,127,166,.04));}
  :root[data-theme="light"] .sx-chip{background:rgba(20,35,70,.03);}
  :root[data-theme="light"] .ttq,:root[data-theme="light"] .phase-note{background:rgba(11,127,166,.05);}
  :root[data-theme="light"] .state-bar .seg.s657{background:linear-gradient(180deg,#8d9db8,#6b7d99);color:#fff;}
  :root[data-theme="light"] .switch input:checked + .switch-track{background:rgba(201,134,0,.2);}
  /* theme toggle (top right) */
  header{position:relative;}
  .theme-toggle{position:absolute;top:0;right:0;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;padding:0;}
  .theme-toggle:hover{color:var(--strong);border-color:var(--ice-dim);}
  .theme-toggle svg{width:19px;height:19px;display:block;}
  .theme-toggle .i-sun{display:none;}
  :root[data-theme="light"] .theme-toggle .i-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,227,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ice-dim);
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ice-dim);display:inline-block;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  h1 span{color:var(--ice);}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}

  .divider{width:100%;height:1px;background:var(--border);margin:18px 0 26px;}

  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{
    position:relative;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--ice-dim);}
  .tab.active{
    color:var(--ice);
    background:linear-gradient(180deg, rgba(111,227,255,0.10), rgba(111,227,255,0.02));
    border-color:var(--ice);
    box-shadow:0 0 0 1px rgba(111,227,255,.15), 0 0 18px rgba(111,227,255,.12);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
  }
  select,input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    min-width:150px;
  }
  select:focus,input:focus{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    letter-spacing:.03em;
    border-radius:4px;
    cursor:pointer;
    transition:all .12s;
  }
  .seg button:hover{color:var(--text);border-color:var(--ice-dim);}
  .seg button.nodata{opacity:.5;}
  .seg button.active{
    color:var(--on-ice);
    background:var(--ice);
    border-color:var(--ice);
    font-weight:600;
  }
  .count-pill{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
  }

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--ice);}
  thead th.sorted{color:var(--ice);}
  thead th .arrow{font-size:10px;margin-left:4px;opacity:.8;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:rgba(111,227,255,0.04);}
  tbody td{padding:9px 12px;color:var(--text);}
  td.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:var(--text);}
  .namecell{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .days{display:inline-flex;gap:4px;flex:none;}
  body.nodots .days{display:none;}
  .sw-pair{display:inline-flex;align-items:center;gap:22px;align-self:flex-end;flex-wrap:wrap;}
  .sw-pair .switch{width:auto !important;align-self:center;}
  @media (max-width:640px){ .sw-pair{align-self:flex-start;} .switch.dots-sw, .switch.whale-sw, .switch.av-sw{justify-content:flex-start;align-self:flex-start;width:auto;padding:2px 0;} }
  .rt{display:inline-flex;align-items:center;gap:10px;flex:none;}
  .wins{display:inline-flex;gap:1px;align-items:center;padding:2px 8px;border:1px solid var(--border);border-radius:999px;vertical-align:middle;}
  .ws{width:14px;height:14px;display:block;}
  .nm{display:inline-flex;align-items:center;gap:6px;min-width:0;}
  .medals{display:inline-flex;gap:3px;flex:none;}
  .medal{width:17px;height:17px;display:block;}
  @media (max-width:640px){
    .namecell{flex-direction:column;align-items:flex-start;gap:5px;}
    .nm .nt{max-width:96px;overflow:hidden;text-overflow:ellipsis;}
    #tableWrap th.stk, #tableWrap td.stk{position:sticky;z-index:1;background:var(--panel);padding-left:5px;padding-right:5px;}
    #tableWrap thead th.stk{z-index:3;}
    #tableWrap tr.row-sel td.stk{background:var(--stk-sel);}
    #tableWrap td.stk.name-stk{box-shadow:1px 0 0 var(--border);}
    #tableWrap tr.rank-cutoff td{border-bottom:0;box-shadow:inset 0 -2px 0 var(--danger);}
    #tableWrap tr.rank-cutoff td.stk.name-stk{box-shadow:1px 0 0 var(--border), inset 0 -2px 0 var(--danger);}
    #tableWrap th.selcol.stk, #tableWrap td.selcol.stk{padding-left:8px;padding-right:2px;}
  }
  .dd{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-faint);box-sizing:border-box;}
  .dd.on{background:var(--ice);border-color:var(--ice);}
  .dd.na{opacity:.3;border-style:dashed;}
  td.srank{color:var(--ice-dim);}
  td.rank{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--text-dim);width:44px;}
  .row-646{border-left:2px solid var(--state646);}
  .row-646 td.name{font-weight:700;color:var(--strong);}
  .row-nb td.name{font-weight:700;color:var(--strong);}
  .row-646 td.state{color:var(--state646);font-weight:700;}
  .row-away td.state{color:var(--state657);}
  tbody tr.rank-cutoff td{border-bottom:2px solid var(--danger);}
  .tag{
    display:inline-block;

  /* row selection + running total (Player / Alliance tabs) */
  th.selcol,td.selcol{width:34px;padding-left:10px;padding-right:0;text-align:center;}

  #selTotal{position:sticky;bottom:12px;z-index:50;margin-top:14px;}  /* below modal (100) and tooltip (200) */
  .sel-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:12px 16px;background:var(--panel-2);border:1px solid var(--ice-dim);border-radius:10px;box-shadow:0 -6px 24px rgba(0,0,0,.45);}
  .sel-total{font-size:16px;color:var(--text);}

  .sel-meta{font-size:12.5px;color:var(--text-dim);}
  .sel-compare{margin-left:auto;background:var(--ice);color:var(--on-ice);border:0;border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;}
  .sel-compare:hover{filter:brightness(1.1);}
  .sel-clear{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;cursor:pointer;}

  /* state share stat bar */
  .state-stats{margin-bottom:16px;}

    display:flex;justify-content:space-between;
    font-size:12px;color:var(--text-dim);margin-bottom:6px;
  }

  .state-stats-labels .l646{color:var(--state646);}
  .state-stats-labels .l657{color:var(--state657);}
  .state-bar{
    display:flex;width:100%;height:22px;border-radius:4px;overflow:hidden;
    border:1px solid var(--border);background:var(--panel-2);
  }
  .state-bar .seg{
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;font-family:'Inter',sans-serif;
    white-space:nowrap;overflow:hidden;
    transition:width .25s ease;
  }
  .state-bar .seg.s646{background:linear-gradient(180deg, var(--state646), #cc8f00);color:#231400;}
  .state-bar .seg.s657{background:linear-gradient(180deg, #5c6f92, #3d4c6b);color:#eef1f8;}

  /* chests */
  .chest-config{
    display:flex;flex-wrap:wrap;gap:24px;align-items:flex-end;
    margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);
  }
  .slider-block{flex:1;min-width:260px;}
  .slider-labels{display:flex;justify-content:space-between;font-family:'Inter',sans-serif;font-size:12.5px;margin-bottom:8px;}
  .slider-labels .a{color:var(--ice);}
  .slider-labels .b{color:var(--frost);}
  input[type="range"]{
    width:100%;height:4px;-webkit-appearance:none;appearance:none;
    background:linear-gradient(90deg, var(--ice), var(--frost));
    border-radius:2px;outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ice);cursor:pointer;
    box-shadow:0 0 8px rgba(111,227,255,.6);
  }
  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ice);cursor:pointer;
  }
  .formula-note{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  select.chest-select{min-width:100px;padding:6px 8px;font-size:12.5px;}
  select.chest-select.big{border-color:var(--gold);color:var(--gold);}
  select.chest-select.small{border-color:var(--silver);color:var(--silver);}

  .copy-bar{
    display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);
  }
  .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;font-size:13px;letter-spacing:.05em;text-transform:uppercase;
    background:linear-gradient(180deg, rgba(111,227,255,.18), rgba(111,227,255,.05));
    border:1px solid var(--ice);
    color:var(--ice);
    padding:10px 18px;
    border-radius:4px;
    cursor:pointer;
    transition:all .15s;
  }
  .btn:hover{background:rgba(111,227,255,.22);box-shadow:0 0 16px rgba(111,227,255,.2);}
  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .copy-status{font-size:12.5px;color:var(--good);opacity:0;transition:opacity .2s;}
  .copy-status.show{opacity:1;}
  .chest-summary{font-size:12.5px;color:var(--text-faint);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  footer{margin-top:36px;text-align:center;color:var(--text-faint);font-size:11.5px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  /* modal */
  .modal-overlay{
    display:none;
    position:fixed;inset:0;
    background:rgba(3,6,12,0.72);
    z-index:100;
    align-items:center;justify-content:center;
    padding:24px;
  }
  .modal-overlay.open{display:flex;}
  .modal-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:8px;

    display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.5);

    display:flex;align-items:center;justify-content:space-between;
    padding:18px 22px 0;
  }

    font-family:'Inter',sans-serif;font-weight:700;font-size:18px;margin:0;color:var(--ice);

  #tableWrap, #chestTableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  }

  /* controls layout: phase buttons get their own row, filters + actions sit together below */
  #controls > .field:first-child{flex:1 1 100%;}

  /* switch */
  .switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;align-self:flex-end;padding:8px 0;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch-track{width:38px;height:22px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);position:relative;transition:background .2s,border-color .2s;flex:none;}
  .switch-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .2s,background .2s;}
  .switch input:checked + .switch-track{background:rgba(255,180,0,.18);border-color:var(--state646);}
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(16px);background:var(--state646);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--ice-dim);outline-offset:2px;}
  .switch-label{font-size:13px;color:var(--text-dim);font-weight:500;}
  .switch input:checked ~ .switch-label{color:var(--text);}

  /* tooltip */
  #tooltip{
    position:fixed;z-index:200;pointer-events:none;
    min-width:240px;max-width:310px;
    background:rgba(10,15,28,.97);border:1px solid var(--ice-dim);border-radius:8px;
    padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.55);
    opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;
    font-size:12px;
  }
  #tooltip{visibility:hidden;transition:opacity .12s ease,transform .12s ease,visibility 0s linear .12s;}
  #tooltip.show{opacity:1;transform:none;visibility:visible;transition-delay:0s;}
  .tt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .tt-head b{font-size:13.5px;color:var(--strong);}
  .tt-state{font-size:11px;font-weight:700;color:var(--state657);}
  .tt-state.home{color:var(--state646);}
  .tt-id{color:var(--text-faint);font-size:11.5px;margin-bottom:8px;}

  .tt-bar span{font-size:9.5px;color:var(--text-faint);}

  .tt-table td{padding:2px 0;border:none;color:var(--text-dim);}
  .tt-table td.r{text-align:right;color:var(--text-faint);padding-right:10px;}
  .tt-table td.p{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}
  .tt-note{margin-top:6px;font-size:10.5px;color:var(--text-faint);}

  .ttq{margin:8px 0 10px;padding:8px 10px;background:rgba(111,227,255,.05);border:1px solid var(--border);border-radius:6px;}
  .ttq-t{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ice-dim);margin-bottom:6px;font-weight:600;}
  .ttq-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--text-dim);margin-top:5px;}
  .ttq-r b{color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums;}
  .ttq-n{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;margin-top:1px;}
  .ttq-n.warn{color:var(--gold);font-size:10.5px;line-height:1.35;margin:5px 0 2px;}
  .ttq-m{height:4px;border-radius:2px;background:var(--border);margin-top:3px;overflow:hidden;}
  .ttq-m i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),var(--frost));border-radius:2px;}

  table.ap td.c,table.ap th.c{text-align:center;}
  table.ap tr.in{background:rgba(111,227,255,.06);}
  table.ap td.n{max-width:190px;overflow:hidden;text-overflow:ellipsis;}
  table.ap input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--ice);}
  .lnk{background:none;border:0;color:var(--ice);cursor:pointer;font-size:11px;padding:0;text-decoration:underline;}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--danger);color:var(--text);padding:10px 16px;border-radius:8px;z-index:400;max-width:90vw;font-size:13px;display:none;}
  #toast.ok{border-color:var(--good);}
  .ep-note{margin-top:14px;}
  @media (max-width:640px){ .t1 .nt{font-size:14.5px;} .ep-sums{gap:8px;} .ep-sum{padding:10px 12px;} .ep-sum .big{font-size:18px;} .ep-sum .big small{display:block;margin:0;} }
  @media (max-width:900px){
    .ep-grid{grid-template-columns:1fr;}
    .ep-pool{position:static;max-height:none;}
    .ep-list{max-height:60vh;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <button type="button" class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light mode" title="Dark / light mode"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <div class="eyebrow">State 646 — Events</div>
    <h1>Event <span>Planner</span></h1>
    <p class="subtitle" id="sub">Loading …</p>
    <p class="sync" id="sync"></p>
  </header>

  <div class="divider"></div>

  <div class="panel ep-bar">
    <div class="controls">
      <div class="field"><label for="evSel">Event</label><select id="evSel"></select></div>
      <button type="button" class="btn" id="evNew" hidden>New event</button>
      <button type="button" class="btn" id="evEdit" hidden>Edit event</button>
      <button type="button" class="btn" id="evLock" hidden>Lock event</button>
      <button type="button" class="btn danger" id="evDel" hidden>Delete event</button>
      <span class="lockb" id="lockB" hidden>🔒 Locked</span>
      <span class="grow"></span>
      <span class="who" id="who"></span>
      <button type="button" class="btn" id="login">Log in to edit</button>
    </div>
  </div>

  <div class="ep-sums" id="sums" hidden></div>

  <div class="ep-grid" id="board" hidden>
    <section class="ep-sec ep-pool" id="pool" data-drop="">
      <div class="ep-h"><b>Pool</b><button type="button" class="btn" id="addP" hidden>Add players</button><span class="sx-id" id="poolN"></span></div>
      <div class="ep-pf"><input type="text" id="pq" placeholder="Search …" autocomplete="off"><select id="pa" aria-label="Alliance"></select></div>
      <div class="ep-pf" style="border-top:0;padding-top:0"><select id="ps" aria-label="Sort the pool by"><option value="power">Sort: Power</option><option value="name">Sort: Name</option><option value="avail">Sort: Availability</option></select></div>
      <div class="ep-list" id="poolList"></div>
    </section>
    <section class="ep-teams">
      <div class="ep-sec ep-teams-h"><div class="ep-h"><b>Teams</b><button type="button" class="btn" id="tNew" hidden>Add team</button><button type="button" class="btn" id="tStd" hidden>Standard teams (PKB / GYN)</button><button type="button" class="btn" id="tMiss">Missing players</button><button type="button" class="btn" id="tCopy">Copy list</button><span class="sx-id" id="teamN"></span></div></div>
      <div id="teamsWrap" style="display:contents"></div>
    </section>
  </div>

  <div class="sx-share-note ep-note" id="note"></div>
  <footer id="foot">State 646 · Event Planner — players: Whiteout Stats API (up to 60 minutes old) · build 2026-10-20 · p5</footer>
</div>
<div id="modal" class="ep-modal" hidden></div>
<div id="toast"></div>
<script src="eventplan-config.js"></script>
<script>
(function(){
  // ---- Supabase settings: fill in (Project settings > API: Project URL and the public "anon" key) ----
  const CFG = Object.assign({url: '', key: ''}, window.EP_CONFIG || {});   // normally set in eventplan-config.js (so a new eventplan.html never wipes the settings)
  const MOCK = /[?&]mock=1/.test(location.search);   // test mode without a database (data only in memory)

  const TAGS = ['AIR', 'BLP', 'TBR', 'TbR', 'osm', 'OMG', 'PKB', 'GYN'];
  const fmt = n => (n == null ? '–' : Number(n).toLocaleString('de-DE'));
  const fmtM = n => { n = Number(n || 0); return n >= 1e9 ? (n / 1e9).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' B' : (n / 1e6).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' M'; };   // from 1 billion: 1,26 B
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const $ = id => document.getElementById(id);
  const TAG_RED = {bg:'#b8283a', fg:'#ffffff', bd:'#b8283a'};
  const TAG_GOLD = {bg:'#f2b705', fg:'#2a1b00', bd:'#f2b705'};
  const TAG_COLORS = {
    BLP: TAG_RED, OSM: TAG_RED, osm: {bg:'#ff8f8f', fg:'#2b0509', bd:'#ff8f8f'},
    AIR: {bg:'#2563eb', fg:'#ffffff', bd:'#2563eb'}, TBR: {bg:'#1e8449', fg:'#ffffff', bd:'#1e8449'},
    TbR: {bg:'#86e3a1', fg:'#052311', bd:'#86e3a1'}, PKB: TAG_GOLD, GYN: TAG_GOLD
  };
  const TAG_PLAIN = {bg:'#3a4357', fg:'#dfe6f2', bd:'#4d5873'};
  function tagChip(tag){
    const c = TAG_COLORS[tag] || TAG_PLAIN;
    return `<span class="tag tag-c" style="background:${c.bg};color:${c.fg};border-color:${c.bd}">${escapeHtml(tag || '—')}</span>`;
  }

  // ---- preferences (same keys as the other pages) ----
  const PREF_KEY = 'svs646_prefs';
  const PREFS = (() => { let o = null; try { o = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); } catch(e) {}
    if(!o){ try { const m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {}; })();
  const avOn = PREFS.av !== false;
  function prefSet(k, v){ PREFS[k] = v; const s = JSON.stringify(PREFS); try { localStorage.setItem(PREF_KEY, s); } catch(e) {} try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {} }

  // ---- backend: plain REST calls to Supabase (no library); in test mode an in-memory copy ----
  function restApi(){
    const H = {apikey: CFG.key, 'Content-Type': 'application/json'};
    if(/^eyJ/.test(CFG.key)) H.Authorization = 'Bearer ' + CFG.key;   // old-style anon key (JWT); the new publishable keys (sb_publishable_...) go in the apikey header only
    async function req(path, opt){
      const r = await fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/' + path, Object.assign({headers: H, cache: 'no-store'}, opt || {}));
      const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
      if(!r.ok) throw new Error((j && (j.message || j.hint)) || ('HTTP ' + r.status));
      return j;
    }
    return {
      events: () => req('ev_events?select=*&order=starts_on.desc.nullslast,created_at.desc'),
      teams: id => req('ev_teams?select=*&event_id=eq.' + encodeURIComponent(id) + '&order=sort.asc,name.asc'),
      entries: id => req('ev_entries?select=*&event_id=eq.' + encodeURIComponent(id)),
      rpc: (fn, args) => req('rpc/' + fn, {method: 'POST', body: JSON.stringify(args || {})})
    };
  }
  function mockApi(){
    const db = {events: [{id: 'e1', name: 'FDT', kind: 'FDT', starts_on: '2026-10-25', start_hour: 11, slots: 6, created_at: '', locked: false, locked_at: null}], teams: [], entries: []};
    const codes = {admin: {role: 'admin', alliance: ''}}; TAGS.forEach(t => codes['ed-' + t] = {role: 'editor', alliance: t});
    let n = 1; const nid = () => 'm' + (n++);
    const cl = o => JSON.parse(JSON.stringify(o));
    function need(c, adm){ const w = codes[c]; if(!w) throw new Error('Invalid code'); if(adm && w.role !== 'admin') throw new Error('Admin code required'); return w; }
    const open = id => { const e = db.events.find(x => x.id === id); if(e && e.locked) throw new Error('This event is locked. Unlock it first to make changes.'); };
    const find = (e, p) => db.entries.find(x => x.event_id === e && String(x.pid) === String(p));
    const F = {
      ev_login: a => codes[a.p_code] || null,
      ev_event_save: a => { need(a.p_code, true); let o = a.p_id && db.events.find(x => x.id === a.p_id);
        if(!o){ o = {id: nid(), created_at: ''}; db.events.push(o); }
        Object.assign(o, {name: a.p_name, kind: a.p_kind, starts_on: a.p_starts_on, start_hour: a.p_start_hour, slots: a.p_slots}); return o.id; },
      ev_event_delete: a => { need(a.p_code, true); db.events = db.events.filter(x => x.id !== a.p_id); db.teams = db.teams.filter(x => x.event_id !== a.p_id); db.entries = db.entries.filter(x => x.event_id !== a.p_id); },
      ev_event_lock: a => { need(a.p_code, true); const e = db.events.find(x => x.id === a.p_id); if(a.p_locked){ (a.p_snap || []).forEach(s => { const o = find(a.p_id, s.pid); if(o){ o.name = s.name; o.power = s.power; o.snap_alliance = s.alliance; } }); e.locked = true; e.locked_at = '2026-10-20T12:00:00Z'; } else { e.locked = false; e.locked_at = null; } },
      ev_entry_home: a => { need(a.p_code, true); open(a.p_event); const o = find(a.p_event, a.p_pid); if(o) o.alliance = a.p_alliance; },
      ev_team_save: a => { need(a.p_code, true); if(!a.p_id) open(a.p_event); let o = a.p_id && db.teams.find(x => x.id === a.p_id);
        if(!o){ o = {id: nid(), event_id: a.p_event}; db.teams.push(o); }
        Object.assign(o, {name: a.p_name, target: a.p_target || '', sort: a.p_sort == null ? (o.sort || 0) : a.p_sort}); return o.id; },
      ev_team_delete: a => { need(a.p_code, true); db.teams = db.teams.filter(x => x.id !== a.p_id); db.entries.forEach(x => { if(x.team_id === a.p_id) x.team_id = null; }); },
      ev_entry_save: a => { const w = need(a.p_code, false); open(a.p_event); const o = find(a.p_event, a.p_pid);
        if(w.role === 'editor' && (a.p_alliance !== w.alliance || (o && o.alliance !== w.alliance))) throw new Error('Editors may only edit players of their own alliance (' + w.alliance + ')');
        const v = {name: a.p_name, power: a.p_power, hours: a.p_hours, pb: a.p_pb, b20: a.p_b20, gather: a.p_gather};
        if(o) Object.assign(o, v); else db.entries.push(Object.assign({event_id: a.p_event, pid: a.p_pid, team_id: null, joined: false, alliance: a.p_alliance, snap_alliance: ''}, v)); },
      ev_entry_delete: a => { const w = need(a.p_code, false); open(a.p_event); const o = find(a.p_event, a.p_pid); if(!o) return;
        if(w.role === 'editor' && o.alliance !== w.alliance) throw new Error('Editors may only edit players of their own alliance');
        db.entries = db.entries.filter(x => x !== o); },
      ev_entry_assign: a => { need(a.p_code, true); open(a.p_event); const o = find(a.p_event, a.p_pid); if(o && o.team_id !== a.p_team){ o.team_id = a.p_team; o.joined = false; } },
      ev_entry_joined: a => { need(a.p_code, true); open(a.p_event); const o = find(a.p_event, a.p_pid); if(o) o.joined = !!a.p_joined; }
    };
    return {
      events: async () => cl(db.events),
      teams: async id => cl(db.teams.filter(t => t.event_id === id)),
      entries: async id => cl(db.entries.filter(e => e.event_id === id)),
      rpc: async (fn, args) => { const r = F[fn](args); return r === undefined ? null : cl(r); }
    };
  }
  const api = MOCK ? mockApi() : (CFG.url && CFG.key ? restApi() : null);

  // ---- state ----
  const S = {events: [], evId: null, teams: [], entries: [], role: null, alliance: '', code: '', q: '', pa: '', ps: ['power', 'name', 'avail'].includes(PREFS.eps) ? PREFS.eps : 'power', ap: {q: '', tag: ''}};
  let D = null;           // players.json
  let last = '';
  let dragPid = null;
  const ev = () => S.events.find(e => e.id === S.evId) || null;
  const isAdmin = () => S.role === 'admin';
  const canEdit = () => S.role === 'admin' || S.role === 'editor';
  const locked = () => !!(ev() && ev().locked);
  const adm = () => isAdmin() && !locked();      // admin actions (not possible while the event is locked)
  const canW = () => canEdit() && !locked();
  const slotsOf = () => { const e = ev(); return e ? e.slots : 6; };
  const slotLabel = i => { const e = ev(); const h = ((e ? e.start_hour : 11) + i) % 24; return h + '–' + ((h + 1) % 24); };
  const teamById = id => S.teams.find(t => t.id === id);
  function pinfo(e){
    const p = D && D.players && D.players[String(e.pid)];
    if(locked()) return {p, name: e.name || (p ? p.n : String(e.pid)), power: Number(e.power || 0), tag: e.snap_alliance || e.alliance || '', known: true};   // frozen values
    return {p, name: p ? p.n : (e.name || String(e.pid)), power: p ? (p.p || 0) : Number(e.power || 0), tag: p ? p.a : (e.alliance || ''), known: !!p};
  }

  function toast(msg, ok){ const t = $('toast'); t.textContent = msg; t.className = ok ? 'ok' : ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = 'none', 4200); }
  function avHtml(e, p){
    if(!avOn || !p) return '';
    if(p.au) return `<img class="av" loading="lazy" decoding="async" width="22" height="22" src="avatars/${escapeHtml(e.pid)}.webp" alt="" onerror="this.remove()">`;
    return `<span class="av ph" aria-hidden="true">${escapeHtml((Array.from(String(p.n || '?'))[0] || '?').toUpperCase())}</span>`;
  }
  function strip(h){ let s = ''; for(let i = 0; i < slotsOf(); i++) s += `<i class="${(h >> i) & 1 ? 'on' : ''}" title="${slotLabel(i)}"></i>`; return `<span class="hs">${s}</span>`; }
  function flags(e){ return (e.pb ? '<span class="fl pb" title="Powerbooster">PB</span>' : '') + (e.b20 ? '<span class="fl b20" title="Has the 20% buff and will use it">20%</span>' : '') + (e.gather ? '<span class="fl g" title="Gathering (helps with loot)">G</span>' : ''); }
  function status(e, team){
    if(!team || !team.target) return '';
    const i = pinfo(e);
    if(i.known && i.tag === team.target) return `<span class="st ok" title="In ${escapeHtml(team.target)} (confirmed by the game data)">✓</span>`;
    if(e.joined) return `<span class="st man" title="Confirmed manually by the admin (the game data is up to 60 minutes old)">✓</span>`;
    if(!i.known) return `<span class="st unk" title="Not in the game data">?</span>`;
    return `<span class="st bad" title="Currently in ${escapeHtml(i.tag)}, not yet in ${escapeHtml(team.target)}">!</span>`;
  }
  function tile(e, team){
    const i = pinfo(e);
    return `<div class="tile${adm() ? ' drag clickable' : ''}" data-pid="${escapeHtml(e.pid)}"${adm() ? ' draggable="true"' : ''}>
      <div class="t1"><span class="nm">${avHtml(e, i.p)}<span class="nt" title="${escapeHtml(i.name)}">${escapeHtml(i.name)}</span></span>${tagChip(i.tag)}${status(e, team)}</div>
      <div class="t2"><span class="pw" title="${fmt(i.power)}">${fmtM(i.power)}</span>${strip(e.hours)}${flags(e)}</div></div>`;
  }

  // ---- rendering ----
  function render(){
    $('login').textContent = canEdit() ? 'Log out' : 'Log in to edit';
    $('who').innerHTML = S.role === 'admin' ? 'Logged in as <b>Admin</b>' : (S.role === 'editor' ? 'Logged in as <b>Editor</b> ' + tagChip(S.alliance) : 'View only');
    $('evNew').hidden = !isAdmin(); $('evEdit').hidden = !(isAdmin() && ev()); $('evDel').hidden = !(isAdmin() && ev());
    const sel = $('evSel'); const cur = S.evId;
    sel.innerHTML = S.events.map(e => `<option value="${escapeHtml(e.id)}">${escapeHtml(e.name)}${e.starts_on ? ' · ' + escapeHtml(e.starts_on) : ''}</option>`).join('') || '<option value="">(no events yet)</option>';
    if(cur) sel.value = cur;
    const e = ev();
    $('board').hidden = !e;
    $('sync').textContent = locked() ? 'This event is locked: names, power and alliances are frozen at the time of locking.' : (D && D.updated ? 'Player data: last change ' + D.updated + ' (the game data itself can be up to 60 minutes older)' : '');
    $('sub').textContent = e ? `${e.kind || 'Event'} · ${slotsOf()} hours from ${e.start_hour}:00 · ${S.entries.length} players registered` : (S.events.length ? '' : (isAdmin() ? 'Create the first event with "New event".' : 'No event has been created yet.'));
    if(!e) return;
    $('addP').hidden = !canW();
    $('tNew').hidden = !adm(); $('tStd').hidden = !(adm() && !S.teams.length);
    $('evLock').hidden = !isAdmin(); $('evLock').textContent = locked() ? 'Unlock event' : 'Lock event'; $('lockB').hidden = !locked();
    $('lockB').textContent = '🔒 Locked' + (e.locked_at ? ' · ' + String(e.locked_at).replace('T', ' ').slice(0, 16) + ' UTC' : '');
    $('evEdit').hidden = !(adm() && ev());
    // pool
    const pa = $('pa'); const tags = Array.from(new Set(S.entries.map(x => pinfo(x).tag))).filter(Boolean).sort();
    pa.innerHTML = '<option value="">All alliances</option>' + tags.map(t => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join(''); pa.value = tags.includes(S.pa) ? S.pa : (S.pa = '');
    const q = S.q.toLowerCase();
    const pool = S.entries.filter(x => !x.team_id).filter(x => { const i = pinfo(x); return (!S.pa || i.tag === S.pa) && (!q || i.name.toLowerCase().includes(q) || String(x.pid).includes(q)); })
      .sort(poolSort);
    $('ps').value = S.ps;
    const poolAll = S.entries.filter(x => !x.team_id).length;
    $('poolN').textContent = poolAll + ' unassigned · ' + fmtM(S.entries.filter(x => !x.team_id).reduce((s, x) => s + pinfo(x).power, 0));
    $('poolList').innerHTML = pool.map(x => tile(x, null)).join('') || `<div class="ep-empty">${S.entries.length ? 'Nobody left in the pool.' : (canEdit() ? 'The pool is empty. Use "Add players".' : 'The pool is empty.')}</div>`;
    // teams
    $('teamN').textContent = S.teams.length + ' team' + (S.teams.length === 1 ? '' : 's');
    $('teamsWrap').innerHTML = S.teams.map(t => {
      const m = S.entries.filter(x => x.team_id === t.id).sort((a, b) => pinfo(b).power - pinfo(a).power);
      const tot = m.reduce((s, x) => s + pinfo(x).power, 0);
      const g = m.filter(x => x.gather); const gp = g.reduce((s, x) => s + pinfo(x).power, 0);
      let cov = ''; for(let i = 0; i < slotsOf(); i++){ const c = m.filter(x => (x.hours >> i) & 1).length; cov += `<span class="${c ? '' : 'z'}" title="${slotLabel(i)}: ${c} available">${slotLabel(i).split('–')[0]}<b>${c}</b></span>`; }
      return `<div class="team" data-drop="${escapeHtml(t.id)}"><div class="team-h">
        <div class="team-t"><b title="${escapeHtml(t.name)}">${escapeHtml(t.name)}</b>${t.target ? tagChip(t.target) : ''}${adm() ? `<button type="button" class="ic" data-edit-team="${escapeHtml(t.id)}" title="Edit team">✎</button>` : ''}</div>
        <div class="team-sum"><b>${m.length}</b> players · <b title="${fmt(tot)}">${fmtM(tot)}</b> power</div>
        <div class="team-sub">${g.length ? `incl. ${g.length} gatherer${g.length === 1 ? '' : 's'} (${fmtM(gp)}) · ` : ''}${m.filter(x => x.pb).length ? m.filter(x => x.pb).length + ' PB · ' : ''}${m.filter(x => x.b20).length ? m.filter(x => x.b20).length + ' with 20% · ' : ''}available per hour:</div>
        <div class="cov">${cov}</div></div>
        <div class="team-b">${m.map(x => tile(x, t)).join('') || '<div class="ep-empty">' + (isAdmin() ? 'Drag players here.' : 'No players yet.') + '</div>'}</div></div>`;
    }).join('') || (isAdmin() ? '' : '<div class="ep-sec ep-empty" style="grid-column:1/-1">No teams yet.</div>');
    renderSums();
    $('note').innerHTML = 'Names, alliances and power come from the game data (updated every 2 hours, the API itself may be up to 60 minutes behind). The mark next to a member in a team: <span class="st ok">✓</span> already in the team\'s alliance, <span class="st bad">!</span> still in another alliance, <span class="st man">✓</span> confirmed manually by the admin, <span class="st unk">?</span> not in the game data. Gatherers (G) count towards the team power.';
  }
  const bits = h => { let c = 0; for(let x = h || 0; x; x >>= 1) c += x & 1; return c; };
  function poolSort(a, b){
    const A = pinfo(a), B = pinfo(b);
    if(S.ps === 'name') return A.name.localeCompare(B.name, 'en', {sensitivity: 'base'});
    if(S.ps === 'avail') return bits(b.hours) - bits(a.hours) || B.power - A.power;
    return B.power - A.power;
  }
  function missingOf(tag){

  // adding players / availability
  function saveEntry(p, patch){

  function addDialog(){

      const body = $('apb'); if(!body) return;
      const tag = S.ap.tag, q = S.ap.q.toLowerCase();
      const idsOf = t => { const A = D.alliances[t]; return (A && A.m) ? A.m : Object.keys(D.players).filter(k => D.players[k].a === t); };
      const ids = tag === '*' ? Array.from(new Set(TAGS.filter(t => D.alliances[t]).flatMap(idsOf))) : idsOf(tag);
      const mine = S.entries.filter(x => tag === '*' || x.alliance === tag).map(x => String(x.pid));   // registered from this alliance, even if they moved meanwhile
      const rows = Array.from(new Set(ids.concat(mine))).map(id => ({id, p: pobj(id)})).filter(r => !q || r.p.n.toLowerCase().includes(q) || r.id.includes(q)).sort((a, b) => (b.p.p || 0) - (a.p.p || 0));
      body.innerHTML = rows.map(r => { const o = S.entries.find(x => String(x.pid) === r.id); const h = o ? o.hours : 0;
        return `<tr data-pid="${escapeHtml(r.id)}" class="${o ? 'in' : ''}"><td class="c"><input type="checkbox" data-k="in"${o ? ' checked' : ''}></td><td class="n"><b>${escapeHtml(r.p.n)}</b></td><td>${tagChip(r.p.a)}</td><td>${fmtM(r.p.p)}</td>${Array.from({length: n}, (_, i) => `<td class="c"><input type="checkbox" data-k="h" data-i="${i}"${(h >> i) & 1 ? ' checked' : ''}></td>`).join('')}<td class="c"><button type="button" class="lnk" data-all>all</button></td><td class="c"><input type="checkbox" data-k="pb"${o && o.pb ? ' checked' : ''}></td><td class="c"><input type="checkbox" data-k="b20"${o && o.b20 ? ' checked' : ''}></td><td class="c"><input type="checkbox" data-k="gather"${o && o.gather ? ' checked' : ''}></td></tr>`; }).join('') || `<tr><td colspan="${n + 8}" class="ep-empty">No players found.</td></tr>`;
    }
  }
  $('addP').addEventListener('click', addDialog);

  // ---- theme ----
  (function(){
    const root = document.documentElement;
    function apply(t){ if(t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme'); const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t === 'light' ? '#f3f6fb' : '#070b15'); }
    let t = 'dark'; try { if(localStorage.getItem('svs-theme') === 'light') t = 'light'; } catch(e) {}
    if(t === 'dark'){ try { if(/(?:^|; )svs_theme=light/.test(document.cookie)) t = 'light'; } catch(e) {} }
    apply(t);
    $('themeToggle').addEventListener('click', () => { const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; apply(next);
      try { localStorage.setItem('svs-theme', next); } catch(e) {} try { document.cookie = 'svs_theme=' + next + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {} });
  })();

  // ---- start ----
  function loadPlayers(){ return fetch('data/players.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : Promise.reject()).then(j => { j.alliances = j.alliances || {}; j.players = j.players || {}; const first = !D; D = j; if(first) last = ''; render(); }).catch(() => {}); }
  (async function(){
    if(!api){ $('sub').textContent = 'Not set up yet: enter the Supabase URL and key at the top of the script (see the setup notes).'; return; }
    const m = location.hash.match(/ev=([\w-]+)/); if(m) S.evId = m[1];
    try { const c = localStorage.getItem('ep_code'); if(c){ const r = await api.rpc('ev_login', {p_code: c}); if(r) setLogin(r, c); else setLogin(null); } } catch(e) {}
    await loadPlayers(); await refresh(true); setHash();
    setInterval(() => { if(!document.hidden && !dragPid) refresh(false); }, 10000);
    setInterval(loadPlayers, 300000);
  })();
})();
</script>
</body>
</html>
