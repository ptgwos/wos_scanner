<style>
  :root{
    --bg:#070b15;
    --bg-2:#0a0f1c;
    --panel:#0f1626;

    --gold:#ffb400;
    --silver:#9fb2cc;
    --text:#e7edf7;

    --text-faint:#5b6c8c;

    --state657:#7f8fb0;

    --bg:#f3f6fb;

    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(11,127,166,0.07), transparent 55%),
      var(--bg);

  @keyframes rfspin{to{transform:rotate(360deg);}}
  :root[data-theme="light"] .theme-toggle .i-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,227,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ice-dim);
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ice-dim);display:inline-block;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  h1 span{color:var(--ice);}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}

  .divider{width:100%;height:1px;background:var(--border);margin:18px 0 26px;}

  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{
    position:relative;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--ice-dim);}
  .tab.active{
    color:var(--ice);
    background:linear-gradient(180deg, rgba(111,227,255,0.10), rgba(111,227,255,0.02));
    border-color:var(--ice);
    box-shadow:0 0 0 1px rgba(111,227,255,.15), 0 0 18px rgba(111,227,255,.12);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
  }
  select,input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    min-width:150px;
  }
  select:focus,input:focus{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    letter-spacing:.03em;
    border-radius:4px;
    cursor:pointer;
    transition:all .12s;
  }
  .seg button:hover{color:var(--text);border-color:var(--ice-dim);}
  .seg button.nodata{opacity:.5;}
  .seg button.active{
    color:var(--on-ice);
    background:var(--ice);
    border-color:var(--ice);
    font-weight:600;
  }
  .count-pill{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
  }

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);

  @media (max-width:640px){ .sw-pair{align-self:flex-start;} .switch.dots-sw, .switch.whale-sw, .switch.av-sw{justify-content:flex-start;align-self:flex-start;width:auto;padding:2px 0;} }

  /* chests */
  .chest-config{

    margin-bottom:20px;padding-bottom:18px;border-bottom:1px solid var(--border-soft);

  input[type="range"]{
    width:100%;height:4px;-webkit-appearance:none;appearance:none;
    background:linear-gradient(90deg, var(--ice), var(--frost));
    border-radius:2px;outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{

  input[type="range"]::-moz-range-thumb{
    width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--ice);cursor:pointer;
  }
  .formula-note{font-size:11.5px;color:var(--text-faint);margin-top:6px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  select.chest-select{min-width:100px;padding:6px 8px;font-size:12.5px;}

  .copy-bar{
    display:flex;align-items:center;gap:14px;margin-top:18px;padding-top:16px;border-top:1px solid var(--border-soft);

  .btn{
    font-family:'Inter',sans-serif;

    color:var(--ice);

    border-radius:4px;
    cursor:pointer;

  .btn:disabled{opacity:.35;cursor:not-allowed;box-shadow:none;}
  .copy-status{font-size:12.5px;color:var(--good);opacity:0;transition:opacity .2s;}
  .copy-status.show{opacity:1;}
  .chest-summary{font-size:12.5px;color:var(--text-faint);font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  footer{margin-top:36px;text-align:center;color:var(--text-faint);font-size:11.5px;font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;}

  /* modal */
  .modal-overlay{
    display:none;

  }

  .modal-panel{
    background:var(--panel);

  #tableWrap, #chestTableWrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}

  #top100TableWrap table{font-size:13px;}
  #top100TableWrap th, #top100TableWrap td{padding:7px 10px;white-space:nowrap;}
  #top100TableWrap thead th{position:sticky;top:0;background:var(--panel);}
  #top100TableWrap td.num{text-align:center;}
  #top100TableWrap th:first-child, #top100TableWrap td:first-child{position:sticky;left:0;background:var(--panel);z-index:1;box-shadow:1px 0 0 var(--border);}
  #top100TableWrap thead th:first-child{z-index:2;}
  .btn-secondary{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;
    background:var(--panel-2);border:1px solid var(--border);color:var(--text-dim);
    padding:9px 16px;border-radius:5px;cursor:pointer;transition:all .15s;
  }
  .btn-secondary:hover{color:var(--ice);border-color:var(--ice-dim);}


  /* controls layout: phase buttons get their own row, filters + actions sit together below */
  #controls > .field:first-child{flex:1 1 100%;}

  /* switch */
  .switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none;align-self:flex-end;padding:8px 0;}
  .switch input{position:absolute;opacity:0;width:0;height:0;}
  .switch-track{width:38px;height:22px;border-radius:11px;background:var(--panel-2);border:1px solid var(--border);position:relative;transition:background .2s,border-color .2s;flex:none;}
  .switch-thumb{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text-dim);transition:transform .2s,background .2s;}
  .switch input:checked + .switch-track{background:rgba(255,180,0,.18);border-color:var(--state646);}
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(16px);background:var(--state646);}
  .switch input:focus-visible + .switch-track{outline:2px solid var(--ice-dim);outline-offset:2px;}
  .switch-label{font-size:13px;color:var(--text-dim);font-weight:500;}
  .switch input:checked ~ .switch-label{color:var(--text);}

  /* tooltip */
  #tooltip{
    position:fixed;z-index:200;pointer-events:none;
    min-width:240px;max-width:310px;
    background:rgba(10,15,28,.97);border:1px solid var(--ice-dim);border-radius:8px;
    padding:12px 14px;box-shadow:0 12px 36px rgba(0,0,0,.55);
    opacity:0;transform:translateY(4px);transition:opacity .12s ease,transform .12s ease;
    font-size:12px;
  }
  #tooltip{visibility:hidden;transition:opacity .12s ease,transform .12s ease,visibility 0s linear .12s;}
  #tooltip.show{opacity:1;transform:none;visibility:visible;transition-delay:0s;}
  .tt-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;}
  .tt-head b{font-size:13.5px;color:var(--strong);}
  .tt-state{font-size:11px;font-weight:700;color:var(--state657);}
  .tt-state.home{color:var(--state646);}
  .tt-id{color:var(--text-faint);font-size:11.5px;margin-bottom:8px;}
  .tt-spark{display:flex;align-items:flex-end;gap:6px;height:50px;margin:8px 0 10px;}
  .tt-bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%;}
  .tt-bar i{display:block;width:100%;border-radius:2px 2px 0 0;background:linear-gradient(180deg,var(--ice),var(--frost));}

  .tt-bar span{font-size:9.5px;color:var(--text-faint);}
  .tt-table{width:100%;font-size:11.5px;border-collapse:collapse;}
  .tt-table td{padding:2px 0;border:none;color:var(--text-dim);}
  .tt-table td.r{text-align:right;color:var(--text-faint);padding-right:10px;}
  .tt-table td.p{text-align:right;color:var(--text);font-variant-numeric:tabular-nums;}
  .tt-note{margin-top:6px;font-size:10.5px;color:var(--text-faint);}
  tbody tr[data-tip]{transition:background .12s;}


  .ttq{margin:8px 0 10px;padding:8px 10px;background:rgba(111,227,255,.05);border:1px solid var(--border);border-radius:6px;}
  .ttq-t{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ice-dim);margin-bottom:6px;font-weight:600;}
  .ttq-r{display:flex;justify-content:space-between;align-items:baseline;gap:8px;color:var(--text-dim);margin-top:5px;}
  .ttq-r b{color:var(--text);font-size:12.5px;font-variant-numeric:tabular-nums;}
  .ttq-n{font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;margin-top:1px;}
  .ttq-n.warn{color:var(--gold);font-size:10.5px;line-height:1.35;margin:5px 0 2px;}
  .ttq-m{height:4px;border-radius:2px;background:var(--border);margin-top:3px;overflow:hidden;}
  .ttq-m i{display:block;height:100%;background:linear-gradient(90deg,var(--ice),var(--frost));border-radius:2px;}
  .ttq .tt-note{margin-top:4px;}

  /* battle phase / castle: note, contribution bar, battle alliance flag */
  .phase-note{font-size:12px;color:var(--text-faint);margin:0 0 14px;padding:8px 12px;border-left:2px solid var(--ice-dim);background:rgba(111,227,255,.04);border-radius:0 4px 4px 0;}
  .contrib{margin-bottom:16px;}
  .contrib-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:12px;margin-bottom:6px;}
  .contrib-head b{color:var(--text);font-weight:600;}
  .contrib-head span{color:var(--text-faint);}
  .contrib-bar{display:flex;height:22px;border-radius:4px;overflow:hidden;border:1px solid var(--border);background:var(--panel-2);}
  .cseg{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;overflow:hidden;white-space:nowrap;transition:width .6s ease;}
  .contrib-legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:11.5px;color:var(--text-dim);}
  .citem{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;}
  .citem i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none;}
  .citem b{color:var(--text);}
  .cbtn{background:none;border:1px solid transparent;border-radius:12px;padding:2px 8px;margin:-2px -8px;color:inherit;font:inherit;cursor:pointer;}
  .cbtn:hover{border-color:var(--border);}
  .cbtn.on{border-color:var(--ice-dim);background:rgba(111,227,255,.08);}
  .cbtn:focus-visible{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .citem em{font-style:normal;color:var(--text-faint);}
  .aflag{display:inline-block;margin-left:8px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:3px;color:var(--gold);border:1px solid rgba(255,180,0,.45);background:rgba(255,180,0,.08);vertical-align:middle;}

  /* event selector */
  .event-bar{display:flex;align-items:center;gap:12px;margin:0 0 16px;}
  .event-bar label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint);}
  .event-bar select{min-width:230px;font-weight:600;}

  /* statistics tab */
  .sx-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;}
  .sx-picker{position:relative;margin-bottom:10px;}

  .sx-id{font-size:11.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;}

  .sx-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 10px;border-radius:14px;border:1px solid var(--c);background:rgba(255,255,255,.03);font-size:12.5px;}
  .sx-chip i{width:9px;height:9px;border-radius:50%;background:var(--c);}
  .sx-chip button{background:none;border:none;color:var(--text-dim);font-size:16px;line-height:1;cursor:pointer;padding:0 6px;}
  .sx-chip button:hover{color:var(--text);}
  .sx-quick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
  .sx-quick .sx-hit{width:auto;padding:6px 10px;}
  .sx-browse{margin-bottom:12px;}
  .sx-browse select{max-width:100%;}
  .sx-browse-list{max-height:320px;overflow:auto;margin-top:8px;}
  .sx-hit.picked{opacity:.45;}
  .sx-q-title{width:100%;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);}
  .sx-ctrl{display:flex;flex-wrap:wrap;gap:14px;margin:6px 0 10px;}
  .sx-ctrl select{min-width:200px;}
  .sx-chart-title{font-size:12.5px;color:var(--text-dim);margin:4px 0 2px;}
  .sx-svg{width:100%;height:auto;display:block;overflow:visible;}
  .sx-grid{stroke:var(--border);stroke-width:1;}
  .sx-axis{fill:var(--text-faint);font-size:11px;font-family:'Inter',sans-serif;}
  .sx-empty{padding:34px 12px;text-align:center;color:var(--text-faint);font-size:13px;border:1px dashed var(--border);border-radius:6px;margin:6px 0 14px;}
  .sx-card{margin-top:16px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .sx-card-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);}
  .sx-card-head i{width:10px;height:10px;border-radius:50%;}
  .sx-card-head b{font-size:14px;color:var(--strong);}
  .sx-hist{width:100%;font-size:11.5px;color:var(--text-faint);}
  .sx-hist em{font-style:normal;color:var(--text-faint);opacity:.8;}

  .sx-card table{min-width:600px;width:100%;table-layout:fixed;font-size:13px;}
  .sx-card th:first-child{width:150px;}

  .sx-card th{white-space:normal;line-height:1.25;vertical-align:bottom;}

  .sx-na{color:var(--text-faint);}
  .sx-miss td{color:var(--text-faint);font-size:12.5px;}

  .sx-d.down{color:var(--danger);}
  .sx-note{margin-top:16px;font-size:11.5px;line-height:1.5;color:var(--text-faint);}

  /* animations */
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .fade-in{animation:fadeUp .25s ease both;}
  tr.row-anim{animation:fadeUp .3s ease both;animation-delay:calc(var(--i,0) * 22ms);}
  select.chest-select{transition:border-color .2s,color .2s;}

  @media (hover:none){
    #tooltip{left:max(14px, calc(50% - 230px)) !important;right:auto;width:min(460px, calc(100vw - 28px));top:auto !important;bottom:calc(env(safe-area-inset-bottom, 0px) + 24px);max-width:none;max-height:75vh;max-height:75dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;transform:translateY(10px);}

<script>
(function(){
  // ---- Supabase settings: fill in (Project settings > API: Project URL and the public "anon" key) ----
  const CFG = Object.assign({url: '', key: ''}, window.EP_CONFIG || {});   // normally set in eventplan-config.js (so a new eventplan.html never wipes the settings)
  const MOCK = /[?&]mock=1/.test(location.search);   // test mode without a database (data only in memory)

  const TAGS = ['AIR', 'BLP', 'TBR', 'TbR', 'osm', 'OMG', 'PKB', 'GYN'];
  const fmt = n => (n == null ? '–' : Number(n).toLocaleString('de-DE'));
  const fmtM = n => { n = Number(n || 0); return n >= 1e9 ? (n / 1e9).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' B' : (n / 1e6).toLocaleString('de-DE', {minimumFractionDigits: 1, maximumFractionDigits: 1}) + ' M'; };   // from 1 billion: 1,26 B
  function escapeHtml(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  const $ = id => document.getElementById(id);
  const TAG_RED = {bg:'#b8283a', fg:'#ffffff', bd:'#b8283a'};
  const TAG_GOLD = {bg:'#f2b705', fg:'#2a1b00', bd:'#f2b705'};
  const TAG_COLORS = {
    BLP: TAG_RED, OSM: TAG_RED, osm: {bg:'#ff8f8f', fg:'#2b0509', bd:'#ff8f8f'},
    AIR: {bg:'#2563eb', fg:'#ffffff', bd:'#2563eb'}, TBR: {bg:'#1e8449', fg:'#ffffff', bd:'#1e8449'},
    TbR: {bg:'#86e3a1', fg:'#052311', bd:'#86e3a1'}, PKB: TAG_GOLD, GYN: TAG_GOLD
  };
  const TAG_PLAIN = {bg:'#3a4357', fg:'#dfe6f2', bd:'#4d5873'};
  function tagChip(tag){
    const c = TAG_COLORS[tag] || TAG_PLAIN;
    return `<span class="tag tag-c" style="background:${c.bg};color:${c.fg};border-color:${c.bd}">${escapeHtml(tag || '—')}</span>`;
  }

  // ---- preferences (same keys as the other pages) ----
  const PREF_KEY = 'svs646_prefs';
  const PREFS = (() => { let o = null; try { o = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); } catch(e) {}
    if(!o){ try { const m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {}; })();
  let avOn = PREFS.av !== false;
  function prefSet(k, v){ PREFS[k] = v; const s = JSON.stringify(PREFS); try { localStorage.setItem(PREF_KEY, s); } catch(e) {} try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {} }

  // ---- backend: plain REST calls to Supabase (no library); in test mode an in-memory copy ----
  function restApi(){
    const H = {apikey: CFG.key, 'Content-Type': 'application/json'};
    if(/^eyJ/.test(CFG.key)) H.Authorization = 'Bearer ' + CFG.key;   // old-style anon key (JWT); the new publishable keys (sb_publishable_...) go in the apikey header only
    async function req(path, opt){
      const r = await fetch(CFG.url.replace(/\/+$/, '') + '/rest/v1/' + path, Object.assign({headers: H, cache: 'no-store'}, opt || {}));
      const t = await r.text(); let j = null; try { j = t ? JSON.parse(t) : null; } catch(e) {}
      if(!r.ok) throw new Error((j && (j.message || j.hint)) || ('HTTP ' + r.status));
      return j;
    }
    return {
      events: () => req('ev_events?select=*&order=starts_on.desc.nullslast,created_at.desc'),
      teams: id => req('ev_teams?select=*&event_id=eq.' + encodeURIComponent(id) + '&order=sort.asc,name.asc'),
      entries: id => req('ev_entries?select=*&event_id=eq.' + encodeURIComponent(id)),
      rpc: (fn, args) => req('rpc/' + fn, {method: 'POST', body: JSON.stringify(args || {})})
    };
  }
  function mockApi(){
    const db = {events: [{id: 'e1', name: 'FDT', kind: 'FDT', starts_on: '2026-10-25', start_hour: 11, slots: 6, created_at: '', locked: false, locked_at: null, home_snap: null, home_snap_at: null}], teams: [], entries: []};
    const users = [{id: 'u1', name: 'Peter', role: 'super', alliances: [], active: true, token: 'super.mock', created_at: '2026-10-01T10:00:00Z', last_login: null, last_active: null},
      {id: 'u2', name: 'Anna', role: 'editor', alliances: ['PKB', 'GYN'], active: true, token: 'anna.mock', created_at: '2026-10-02T10:00:00Z', last_login: null, last_active: null}];
    const logs = [];
    const legacy = {admin: {role: 'admin', name: 'Code admin', alliances: []}}; TAGS.forEach(t => legacy['ed-' + t] = {role: 'editor', name: 'Code editor ' + t, alliances: [t]});
    const who = c => { const u = users.find(x => x.token === c && x.active); if(u) return {uid: u.id, name: u.name, role: u.role, alliances: u.alliances}; return legacy[c] || null; };
    const iso = () => new Date().toISOString();
    const lg = (w, event, action, detail) => logs.unshift({at: iso(), user_name: w.name, event_name: event || '', action, detail});
    let n = 1; const nid = () => 'm' + (n++);
    const cl = o => JSON.parse(JSON.stringify(o));
    function need(c, adm){ const w = who(c); if(!w) throw new Error('Invalid code'); if(adm && !['admin', 'super'].includes(w.role)) throw new Error('Admin rights required'); const u = users.find(x => x.id === w.uid); if(u) u.last_active = iso(); return w; }
    function needSuper(c){ const w = who(c); if(!w) throw new Error('Invalid code'); if(w.role !== 'super') throw new Error('Only the super admin may do this'); return w; }
    const evName = id => { const e = db.events.find(x => x.id === id); return e ? e.name : ''; };
    const open = id => { const e = db.events.find(x => x.id === id); if(e && e.locked) throw new Error('This event is locked. Unlock it first to make changes.'); };
    const find = (e, p) => db.entries.find(x => x.event_id === e && String(x.pid) === String(p));
    const F = {
      ev_login: a => { const w = who(a.p_code); if(!w) return null; const u = users.find(x => x.id === w.uid); if(u) u.last_login = iso(); return {role: w.role, name: w.name, alliances: w.alliances, alliance: w.alliances[0] || ''}; },
      ev_user_list: a => { needSuper(a.p_code); return users.map(u => ({id: u.id, name: u.name, role: u.role, alliances: u.alliances.slice(), active: u.active, created_at: u.created_at, last_login: u.last_login, last_active: u.last_active})); },
      ev_user_save: a => { const w = needSuper(a.p_code); if(!String(a.p_name || '').trim()) throw new Error('Please enter a name');
        if(!a.p_id){ const id = nid(), tok = 'new' + id + '.mock'; users.push({id, name: a.p_name.trim(), role: a.p_role, alliances: a.p_alliances || [], active: a.p_active !== false, token: tok, created_at: iso(), last_login: null, last_active: null}); lg(w, '', 'user_new', 'created user ' + a.p_name); return {id, token: tok}; }
        const u = users.find(x => x.id === a.p_id); if(!u) throw new Error('User not found');
        if(u.role === 'super' && (a.p_role !== 'super' || a.p_active === false) && !users.some(x => x.role === 'super' && x.active && x.id !== u.id)) throw new Error('There must be at least one active super admin');
        Object.assign(u, {name: a.p_name.trim(), role: a.p_role, alliances: a.p_alliances || [], active: a.p_active !== false}); lg(w, '', 'user_edit', u.name + ': ' + u.role + (u.alliances.length ? ', ' + u.alliances.join('/') : '') + (u.active ? '' : ', blocked')); return {id: u.id}; },
      ev_user_token: a => { const w = needSuper(a.p_code); const u = users.find(x => x.id === a.p_id); if(!u) throw new Error('User not found'); u.token = u.id + '.' + Math.random().toString(36).slice(2) + '.mock'; lg(w, '', 'user_link', 'renewed the link of ' + u.name); return {id: u.id, token: u.token}; },
      ev_user_delete: a => { const w = needSuper(a.p_code); const u = users.find(x => x.id === a.p_id); if(!u) return; if(u.role === 'super' && !users.some(x => x.role === 'super' && x.active && x.id !== u.id)) throw new Error('There must be at least one active super admin'); users.splice(users.indexOf(u), 1); lg(w, '', 'user_delete', 'deleted user ' + u.name); },
      ev_log_list: a => { needSuper(a.p_code); return logs.slice(0, a.p_limit || 300); },
      ev_event_save: a => { need(a.p_code, true); let o = a.p_id && db.events.find(x => x.id === a.p_id);
        if(!o){ o = {id: nid(), created_at: ''}; db.events.push(o); }
        Object.assign(o, {name: a.p_name, kind: a.p_kind, starts_on: a.p_starts_on, start_hour: a.p_start_hour, slots: a.p_slots}); return o.id; },
      ev_event_homesnap: a => { const w = need(a.p_code, true); open(a.p_id); const e = db.events.find(x => x.id === a.p_id); e.home_snap = a.p_snap; e.home_snap_at = iso(); db.entries.forEach(x => { if(x.event_id === a.p_id && a.p_snap[String(x.pid)]) x.alliance = a.p_snap[String(x.pid)]; }); lg(w, e.name, 'home_snap', 'saved the home alliances'); },
      ev_event_delete: a => { needSuper(a.p_code); db.events = db.events.filter(x => x.id !== a.p_id); db.teams = db.teams.filter(x => x.event_id !== a.p_id); db.entries = db.entries.filter(x => x.event_id !== a.p_id); },
      ev_event_lock: a => { need(a.p_code, true); const e = db.events.find(x => x.id === a.p_id); if(a.p_locked){ (a.p_snap || []).forEach(s => { const o = find(a.p_id, s.pid); if(o){ o.name = s.name; o.power = s.power; o.snap_alliance = s.alliance; } }); e.locked = true; e.locked_at = '2026-10-20T12:00:00Z'; } else { e.locked = false; e.locked_at = null; } },
      ev_entry_home: a => { need(a.p_code, true); open(a.p_event); const o = find(a.p_event, a.p_pid); if(o) o.alliance = a.p_alliance; },
      ev_team_save: a => { need(a.p_code, true); if(!a.p_id) open(a.p_event); let o = a.p_id && db.teams.find(x => x.id === a.p_id);
        if(!o){ o = {id: nid(), event_id: a.p_event}; db.teams.push(o); }
        Object.assign(o, {name: a.p_name, target: a.p_target || '', sort: a.p_sort == null ? (o.sort || 0) : a.p_sort}); return o.id; },
      ev_team_delete: a => { need(a.p_code, true); db.teams = db.teams.filter(x => x.id !== a.p_id); db.entries.forEach(x => { if(x.team_id === a.p_id) x.team_id = null; }); },
      ev_entry_save: a => { const w = need(a.p_code, false); open(a.p_event); const o = find(a.p_event, a.p_pid);
        const evn = db.events.find(x => x.id === a.p_event); a = Object.assign({}, a, {p_alliance: (evn && evn.home_snap && evn.home_snap[String(a.p_pid)]) || a.p_alliance});
        if(w.role === 'editor' && (!w.alliances.includes(a.p_alliance) || (o && !w.alliances.includes(o.alliance)))) throw new Error('You may only edit players of your own alliances (' + w.alliances.join(', ') + ')');
        const v = {name: a.p_name, power: a.p_power, hours: a.p_hours, pb: a.p_pb, b20: a.p_b20, gather: a.p_gather, rl: !!a.p_rl, heal: !!a.p_heal};
        if(o) Object.assign(o, v); else db.entries.push(Object.assign({event_id: a.p_event, pid: a.p_pid, team_id: null, joined: false, alliance: a.p_alliance, snap_alliance: ''}, v)); },
      ev_entry_delete: a => { const w = need(a.p_code, false); open(a.p_event); const o = find(a.p_event, a.p_pid); if(!o) return;
        if(w.role === 'editor' && !w.alliances.includes(o.alliance)) throw new Error('You may only edit players of your own alliances (' + w.alliances.join(', ') + ')');
        db.entries = db.entries.filter(x => x !== o); },
      ev_entry_assign: a => { need(a.p_code, true); open(a.p_event); const o = find(a.p_event, a.p_pid); if(o && o.team_id !== a.p_team){ o.team_id = a.p_team; o.joined = false; } },
      ev_entry_joined: a => { need(a.p_code, true); open(a.p_event); const o = find(a.p_event, a.p_pid); if(o) o.joined = !!a.p_joined; }
    };
    return {
      events: async () => cl(db.events),
      teams: async id => cl(db.teams.filter(t => t.event_id === id)),
      entries: async id => cl(db.entries.filter(e => e.event_id === id)),
      rpc: async (fn, args) => { const r = F[fn](args); return r === undefined ? null : cl(r); }
    };
  }
  const api = MOCK ? mockApi() : (CFG.url && CFG.key ? restApi() : null);

  // ---- state ----
  const S = {events: [], evId: null, teams: [], entries: [], role: null, alliances: [], uname: '', code: '', view: 'board', cmp: PREFS.epc === true, q: '', pa: '', ps: ['power', 'name', 'avail'].includes(PREFS.eps) ? PREFS.eps : 'power', ap: {q: '', tag: ''}};
  let D = null;           // players.json
  let last = '';
  let dragPid = null;
  const ev = () => S.events.find(e => e.id === S.evId) || null;
  const isSuper = () => S.role === 'super';
  const isAdmin = () => S.role === 'admin' || S.role === 'super';
  const canEdit = () => !!S.role;
  const mayEd = a => isAdmin() || S.alliances.includes(a);   // may this person edit players of alliance a?
  const locked = () => !!(ev() && ev().locked);
  const adm = () => isAdmin() && !locked();      // admin actions (not possible while the event is locked)
  const canW = () => canEdit() && !locked();
  const slotsOf = () => { const e = ev(); return e ? e.slots : 6; };
  const slotLabel = i => { const e = ev(); const h = ((e ? e.start_hour : 11) + i) % 24; return h + '–' + ((h + 1) % 24); };
  const snapOf = () => { const e = ev(); return (e && e.home_snap) || null; };
  const homeOf = (pid, live) => { const s = snapOf(); return (s && s[String(pid)]) || live || ''; };   // home alliance (Stammallianz): the saved one if a snapshot exists
  const teamById = id => S.teams.find(t => t.id === id);
  function pinfo(e){

    const map = {}; keys.forEach(k => { if(D.players[k].a) map[k] = D.players[k].a; });

  });
  $('evLock').addEventListener('click', async () => {
    const e = ev(); if(!e) return;

      if(!confirm('Lock "' + e.name + '"? The current names, power values and alliances are saved and nothing can be changed any more until you unlock it.')) return;
      const snap = S.entries.map(x => { const i = pinfo(x); return {pid: Number(x.pid), name: i.name, alliance: i.tag, power: i.power}; });

  });
  function copyDialog(){
    const e = ev(); if(!e) return;
    const inTeam = S.entries.filter(x => { const t = teamById(x.team_id); return t && t.target; });
    const homes = [...new Set(inTeam.map(x => x.alliance || 'Unknown'))];
    const rk = a => TAGS.indexOf(a) < 0 ? 99 : TAGS.indexOf(a);
    homes.sort((a, b) => rk(a) - rk(b) || a.localeCompare(b));
    const cnt = h => new Set(inTeam.filter(x => (x.alliance || 'Unknown') === h).map(x => String(x.pid))).size;
    const build = home => {
      const g = {};
      inTeam.filter(x => (x.alliance || 'Unknown') === home).forEach(x => { const tg = teamById(x.team_id).target; const o = (g[tg] = g[tg] || {}); o[String(x.pid)] = pinfo(x).name; });
      const ord = tg => { const i = ['PKB', 'GYN'].indexOf(tg); return i < 0 ? 9 : i; };
      return Object.keys(g).sort((a, b) => ord(a) - ord(b) || a.localeCompare(b)).map(tg => '*' + tg + '*\n' + Object.values(g[tg]).sort((a, b) => a.localeCompare(b, 'en', {sensitivity: 'base'})).join('\n')).join('\n-----\n');
    };

    const mine = (S.alliances || []).find(a => homes.includes(a)) || homes[0];
    openModal(`<div class="ep-box sm" style="width:min(520px,100%)">${mhead('Copy list for an alliance')}<div class="ep-mb">
      <div class="field"><label for="cpa">Home alliance</label><select id="cpa">${homes.map(h => `<option value="${escapeHtml(h)}"${h === mine ? ' selected' : ''}>${escapeHtml(h)} (${cnt(h)})</option>`).join('')}</select></div>
      <textarea class="cp" id="cpt" readonly style="min-height:170px"></textarea>

  // moving players
  function assign(pid, teamId){
    const o = S.entries.find(x => String(x.pid) === String(pid)); if(!o || (o.team_id || null) === (teamId || null)) return;
    o.team_id = teamId || null; o.joined = false; last = ''; render();      // instant feedback, then save
    call('ev_entry_assign', {p_event: S.evId, p_pid: Number(pid), p_team: teamId || null});
  }
  const board = $('board');
  board.addEventListener('dragstart', e => { const t = e.target.closest && e.target.closest('.tile'); if(!t || !adm()) return; dragPid = t.dataset.pid; t.classList.add('dragging'); try { e.dataTransfer.setData('text/plain', dragPid); e.dataTransfer.effectAllowed = 'move'; } catch(x) {} });
  // while dragging: scroll the page when the pointer is near the top / bottom edge, and let the mouse wheel work
  let scrollDir = 0, raf = 0;
  function autoScroll(){ if(!dragPid || !scrollDir){ raf = 0; return; } window.scrollBy(0, scrollDir); raf = requestAnimationFrame(autoScroll); }
  document.addEventListener('dragover', e => { if(!dragPid) return; const h = window.innerHeight, y = e.clientY, z = 110;
    scrollDir = y < z ? -Math.ceil((z - y) / 5) : (y > h - z ? Math.ceil((y - (h - z)) / 5) : 0);
    if(scrollDir && !raf) raf = requestAnimationFrame(autoScroll); });
  window.addEventListener('wheel', e => { if(dragPid) window.scrollBy(0, e.deltaY); }, {passive: true});
  board.addEventListener('dragend', () => { scrollDir = 0; });
  board.addEventListener('dragend', () => { dragPid = null; document.querySelectorAll('.dragging,.over').forEach(x => x.classList.remove('dragging', 'over')); });
  board.addEventListener('dragover', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if(!d || !dragPid) return; e.preventDefault(); document.querySelectorAll('.over').forEach(x => { if(x !== d) x.classList.remove('over'); }); d.classList.add('over'); });
  board.addEventListener('drop', e => { const d = e.target.closest && e.target.closest('[data-drop]'); if(!d || !dragPid) return; e.preventDefault(); const pid = dragPid; dragPid = null; document.querySelectorAll('.over').forEach(x => x.classList.remove('over')); assign(pid, d.dataset.drop || null); });
  board.addEventListener('click', e => {
    const te = e.target.closest('[data-edit-team]'); if(te){ teamDialog(teamById(te.dataset.editTeam)); return; }
    const t = e.target.closest('.tile'); if(!t || !canW()) return;
    const pid = t.dataset.pid; const cur = () => S.entries.find(x => String(x.pid) === pid);
    const o0 = cur(); if(!o0 || !(adm() || mayEd(o0.alliance))) return; const i = pinfo(o0); const n = slotsOf();
    const edit = `<div class="field"><label>Availability (saved immediately)</label><div class="ed-h">${Array.from({length: n}, (_, k) => `<label class="ed-c"><input type="checkbox" data-eh="${k}"${(o0.hours >> k) & 1 ? ' checked' : ''}> ${slotLabel(k)}</label>`).join('')}<label class="ed-c"><input type="checkbox" id="eallc"${o0.hours === (1 << n) - 1 ? ' checked' : ''}> ALL</label></div>
      <div class="ed-h" style="margin-top:6px"><label class="ed-c"><input type="checkbox" data-ef="pb"${o0.pb ? ' checked' : ''}> PB</label><label class="ed-c"><input type="checkbox" data-ef="b20"${o0.b20 ? ' checked' : ''}> 20%</label><label class="ed-c"><input type="checkbox" data-ef="gather"${o0.gather ? ' checked' : ''}> ${BASKET} Gatherer</label><label class="ed-c"><input type="checkbox" data-ef="rl"${o0.rl ? ' checked' : ''}> RL (rally leader)</label><label class="ed-c"><input type="checkbox" data-ef="heal"${o0.heal ? ' checked' : ''}> Auto heal</label></div></div>`;
    const adminPart = adm() ? `<div class="field"><label for="hm">Registered from (home alliance)</label><select id="hm">${Array.from(new Set(TAGS.concat([o0.alliance]))).filter(Boolean).map(x => `<option value="${escapeHtml(x)}"${x === o0.alliance ? ' selected' : ''}>${escapeHtml(x)}</option>`).join('')}</select></div>
      <div class="mv">${S.teams.map(x => `<button type="button" class="btn" data-mv="${escapeHtml(x.id)}"${o0.team_id === x.id ? ' disabled' : ''}>→ ${escapeHtml(x.name)}</button>`).join('')}<button type="button" class="btn" data-mv=""${o0.team_id ? '' : ' disabled'}>→ Back to the pool</button></div>
      ${o0.team_id ? `<label class="switch" style="align-self:flex-start"><input type="checkbox" id="jn"${o0.joined ? ' checked' : ''}><span class="switch-track"><span class="switch-thumb"></span></span><span class="switch-label">Already joined the team's alliance (manual)</span></label>` : ''}` : '';
    openModal(`<div class="ep-box sm">${mhead(escapeHtml(i.name))}<div class="ep-mb"><div class="t2">${tagChip(i.tag)}<span class="pw">${fmtM(i.power)}</span></div>${edit}${adminPart}
      <div class="acts"><button type="button" class="btn danger" id="rmv">Remove from event</button></div></div></div>`, m => {
      const saveP = patch => { const o = cur(); if(o) saveEntry(pobj(pid), patch); };
      const syncAll = () => { $('eallc').checked = [...m.querySelectorAll('[data-eh]')].every(c => c.checked); };
      m.querySelectorAll('[data-eh]').forEach(c => c.addEventListener('change', () => { const o = cur(); if(!o) return; const k = +c.dataset.eh; saveP({hours: c.checked ? (o.hours | (1 << k)) : (o.hours & ~(1 << k))}); syncAll(); }));
      m.querySelectorAll('[data-ef]').forEach(c => c.addEventListener('change', () => { saveP({[c.dataset.ef]: c.checked}); if(c.dataset.ef === 'pb' && c.checked){ m.querySelectorAll('[data-eh]').forEach(h => h.checked = false); syncAll(); } }));
      $('eallc').addEventListener('change', () => { const on = $('eallc').checked; saveP({hours: on ? (1 << n) - 1 : 0}); m.querySelectorAll('[data-eh]').forEach(c => c.checked = on); });
      m.querySelectorAll('[data-mv]').forEach(b => b.addEventListener('click', () => { closeModal(); assign(pid, b.dataset.mv || null); }));
      const hm = $('hm'); if(hm) hm.addEventListener('change', () => { const o = cur(); if(o){ o.alliance = hm.value; last = ''; render(); } call('ev_entry_home', {p_event: S.evId, p_pid: Number(pid), p_alliance: hm.value}, 'Home alliance changed.'); });
      const jn = $('jn'); if(jn) jn.addEventListener('change', () => { const o = cur(); if(o){ o.joined = jn.checked; last = ''; render(); } call('ev_entry_joined', {p_event: S.evId, p_pid: Number(pid), p_joined: jn.checked}); });
      $('rmv').addEventListener('click', () => { if(!confirm('Remove ' + i.name + ' from this event?')) return; closeModal(); call('ev_entry_delete', {p_event: S.evId, p_pid: Number(pid)}); });
    });

  $('pq').addEventListener('input', () => { S.q = $('pq').value.trim(); render(); });
  $('pa').addEventListener('change', () => { S.pa = $('pa').value; render(); });

  // adding players / availability
  function saveEntry(p, patch){
    let o = S.entries.find(x => String(x.pid) === String(p.id));
    const base = o ? {hours: o.hours, pb: o.pb, b20: o.b20, gather: o.gather, rl: !!o.rl, heal: !!o.heal} : {hours: 0, pb: false, b20: false, gather: false, rl: false, heal: false};
    const v = Object.assign(base, patch);
    if(patch.pb === true) v.hours = 0;     // powerbooster only help to reach the registration power, they do not play the event
    if(o) Object.assign(o, v); else { o = Object.assign({event_id: S.evId, pid: Number(p.id), name: p.n, alliance: homeOf(p.id, p.a), power: p.p || 0, team_id: null, joined: false}, v); S.entries.push(o); }
    last = '';
    return api.rpc('ev_entry_save', {p_code: S.code, p_event: S.evId, p_pid: Number(p.id), p_name: p.n, p_alliance: o.alliance, p_power: p.p || 0, p_hours: v.hours, p_pb: v.pb, p_b20: v.b20, p_gather: v.gather, p_rl: v.rl, p_heal: v.heal})
      .then(() => refresh(true)).catch(err => { toast(err.message); refresh(true); });
  }
  const pobj = pid => { const d = D && D.players[pid]; if(d) return Object.assign({id: pid}, d); const o = S.entries.find(x => String(x.pid) === String(pid)); return {id: pid, n: o ? o.name : pid, a: o ? o.alliance : '', p: o ? o.power : 0}; };
  function addDialog(){
    if(!D){ toast('The player data is not loaded yet.'); return; }
    const tags = isAdmin() ? TAGS.filter(t => D.alliances[t]) : S.alliances.filter(t => D.alliances[t]);
    if(!tags.length){ toast('No player data found for your alliances.'); return; }
    if(isAdmin() || tags.length > 1) tags.unshift('*');
    if(!S.ap.tag || !tags.includes(S.ap.tag)) S.ap.tag = tags[0];
    const n = slotsOf();
    openModal(`<div class="ep-box">${mhead('Add players and availability')}<div class="ep-mb">
      <div class="row"><div class="field"><label for="apa">Alliance</label><select id="apa"${tags.length === 1 ? ' disabled' : ''}>${tags.map(t => `<option value="${escapeHtml(t)}">${t === '*' ? 'All alliances' : escapeHtml(t)}</option>`).join('')}</select></div>
      <div class="field"><label for="apq">Search</label><input type="text" id="apq" placeholder="Player name or ID …" autocomplete="off"></div></div>
      <div class="ap-wrap"><table class="ap"><thead><tr><th class="c">In</th><th>Player</th><th>Alliance</th><th>Power</th>${Array.from({length: n}, (_, i) => `<th class="c">${slotLabel(i)}</th>`).join('')}<th class="c">All</th><th class="c" title="Powerbooster">PB</th><th class="c" title="20% buff">20%</th><th class="c" title="Gatherer">G</th><th class="c" title="Rally leader">RL</th></tr></thead><tbody id="apb"></tbody></table></div>
      <div class="sx-id">Ticking an hour, PB, 20%, G or RL adds the player automatically. Changes are saved immediately.</div></div></div>`, m => {
      $('apa').value = S.ap.tag; $('apq').value = S.ap.q;

        const tr = e.target.closest('tr'); if(!tr) return; const p = pobj(tr.dataset.pid); const o = S.entries.find(x => String(x.pid) === tr.dataset.pid);
        const k = e.target.dataset.k; let patch = null;
        if(k === 'in'){
          if(!e.target.checked){ if(o && o.team_id && !confirm('This player is already in a team. Remove anyway?')){ e.target.checked = true; return; }
            S.entries = S.entries.filter(x => x !== o); last = ''; api.rpc('ev_entry_delete', {p_code: S.code, p_event: S.evId, p_pid: Number(p.id)}).then(() => refresh(true)).catch(err => { toast(err.message); refresh(true); }); fill(); return; }
          patch = {};
        } else if(k === 'h'){ const i = +e.target.dataset.i; const h = o ? o.hours : 0; patch = {hours: e.target.checked ? (h | (1 << i)) : (h & ~(1 << i))};
        } else { patch = {[k]: e.target.checked}; }
        saveEntry(p, patch); fill();
      });
      $('apb').addEventListener('click', e => { const b = e.target.closest('[data-all]'); if(!b) return; const tr = b.closest('tr'); const p = pobj(tr.dataset.pid); const o = S.entries.find(x => String(x.pid) === tr.dataset.pid);
        const full = (1 << n) - 1; saveEntry(p, {hours: o && o.hours === full ? 0 : full}); fill(); });
      fill();
    }, () => fill());
    function fill(){
      const body = $('apb'); if(!body) return;

      const idsOf = t => { if(snapOf()) return Object.keys(D.players).filter(k => homeOf(k, D.players[k].a) === t); const A = D.alliances[t]; return (A && A.m) ? A.m : Object.keys(D.players).filter(k => D.players[k].a === t); };
      const ids = tag === '*' ? Array.from(new Set(TAGS.filter(t => D.alliances[t] && mayEd(t)).flatMap(idsOf))) : idsOf(tag);

      const rows = Array.from(new Set(ids.concat(mine))).map(id => ({id, p: pobj(id)})).filter(r => !q || r.p.n.toLowerCase().includes(q) || r.id.includes(q)).sort((a, b) => (b.p.p || 0) - (a.p.p || 0));
      body.innerHTML = rows.map(r => { const o = S.entries.find(x => String(x.pid) === r.id); const h = o ? o.hours : 0;
        return `<tr data-pid="${escapeHtml(r.id)}" class="${o ? 'in' : ''}"><td class="c"><input type="checkbox" data-k="in"${o ? ' checked' : ''}></td><td class="n"><b>${escapeHtml(r.p.n)}</b></td><td>${tagChip(homeOf(r.id, r.p.a))}${(snapOf() && homeOf(r.id, r.p.a) !== r.p.a) ? `<span class="sx-id" title="Home alliance from the snapshot; currently in ${escapeHtml(r.p.a)}"> now ${escapeHtml(r.p.a)}</span>` : ''}</td><td>${fmtM(r.p.p)}</td>${Array.from({length: n}, (_, i) => `<td class="c"><input type="checkbox" data-k="h" data-i="${i}"${(h >> i) & 1 ? ' checked' : ''}></td>`).join('')}<td class="c"><button type="button" class="lnk" data-all>all</button></td><td class="c"><input type="checkbox" data-k="pb"${o && o.pb ? ' checked' : ''}></td><td class="c"><input type="checkbox" data-k="b20"${o && o.b20 ? ' checked' : ''}></td><td class="c"><input type="checkbox" data-k="gather"${o && o.gather ? ' checked' : ''}></td><td class="c"><input type="checkbox" data-k="rl"${o && o.rl ? ' checked' : ''}></td></tr>`; }).join('') || `<tr><td colspan="${n + 9}" class="ep-empty">No players found.</td></tr>`;
    }
  }
  $('addP').addEventListener('click', addDialog);

  // ---- theme ----
  (function(){
    const root = document.documentElement;
    function apply(t){ if(t === 'light') root.setAttribute('data-theme', 'light'); else root.removeAttribute('data-theme'); const m = document.querySelector('meta[name="theme-color"]'); if(m) m.setAttribute('content', t === 'light' ? '#f3f6fb' : '#070b15'); }
    let t = 'dark'; try { if(localStorage.getItem('svs-theme') === 'light') t = 'light'; } catch(e) {}
    if(t === 'dark'){ try { if(/(?:^|; )svs_theme=light/.test(document.cookie)) t = 'light'; } catch(e) {} }
    apply(t);
    $('themeToggle').addEventListener('click', () => { const next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; apply(next);
      try { localStorage.setItem('svs-theme', next); } catch(e) {} try { document.cookie = 'svs_theme=' + next + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {} });
  })();

  // ---- users (super admin) ----
  const UV = {tab: 'users', users: null, log: null, uf: ''};
  const fmtT = iso => { if(!iso) return '–'; const d = new Date(iso); return isNaN(d) ? '–' : d.toLocaleString('de-AT', {day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'}); };
  const fmtTY = iso => { if(!iso) return '–'; const d = new Date(iso); return isNaN(d) ? '–' : d.toLocaleString('de-AT', {day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit'}); };
  function ago(iso){ if(!iso) return ''; const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); if(isNaN(m)) return ''; if(m < 2) return 'just now'; if(m < 90) return m + ' min ago'; const h = Math.round(m / 60); if(h < 36) return h + ' h ago'; return Math.round(h / 24) + ' days ago'; }
  async function usersLoad(){
    try { UV.users = await api.rpc('ev_user_list', {p_code: S.code}); if(UV.tab === 'log') UV.log = await api.rpc('ev_log_list', {p_code: S.code, p_limit: 300}); } catch(err){ toast(err.message); }
    usersRender();
  }
  function usersRender(){
    const el = $('usersView'); if(!isSuper() || S.view !== 'users'){ return; }
    const tabs = `<div class="uv-tabs"><button type="button" class="btn${UV.tab === 'users' ? ' on' : ''}" data-tab="users">People</button><button type="button" class="btn${UV.tab === 'log' ? ' on' : ''}" data-tab="log">Change log</button><span class="grow"></span><button type="button" class="btn" id="uvReload">Reload</button>${UV.tab === 'users' ? '<button type="button" class="btn" id="uvNew">+ New person</button>' : ''}</div>`;
    let body = '';
    if(UV.tab === 'users'){
      const us = UV.users || [];
      body = `<div class="ap-wrap"><table class="uv-t"><thead><tr><th>Name</th><th class="c" title="May manage events, teams and all players">Admin</th>${TAGS.map(t => `<th class="c al">${escapeHtml(t)}</th>`).join('')}<th class="c" title="Untick to block this person">Active</th><th>Last login</th><th>Last change</th><th></th></tr></thead><tbody>` +
        us.map(u => { const adm = u.role !== 'editor', sup = u.role === 'super';
          return `<tr data-id="${escapeHtml(u.id)}" data-role="${escapeHtml(u.role)}" class="${u.active ? '' : 'off'}"><td><input type="text" class="un" value="${escapeHtml(u.name)}" maxlength="40" aria-label="Name">${sup ? ' <span class="uv-su">SUPER</span>' : ''}</td>` +
          `<td class="c"><input type="checkbox" class="ua"${adm ? ' checked' : ''}${sup ? ' disabled' : ''} aria-label="Admin"></td>` +
          TAGS.map(t => `<td class="c"><input type="checkbox" class="ut" data-t="${escapeHtml(t)}"${(adm || u.alliances.includes(t)) ? ' checked' : ''}${adm ? ' disabled' : ''} aria-label="${escapeHtml(t)}"></td>`).join('') +
          `<td class="c"><input type="checkbox" class="uact"${u.active ? ' checked' : ''}${sup ? ' disabled' : ''} aria-label="Active"></td>` +
          `<td title="${escapeHtml(fmtTY(u.last_login))}">${escapeHtml(fmtT(u.last_login))}<div class="uv-ago">${escapeHtml(ago(u.last_login))}</div></td><td title="${escapeHtml(fmtTY(u.last_active))}">${escapeHtml(fmtT(u.last_active))}<div class="uv-ago">${escapeHtml(ago(u.last_active))}</div></td>` +
          `<td class="r"><button type="button" class="btn" data-link title="Create a new link (the old one stops working)">New link</button>${sup ? '' : ' <button type="button" class="ic" data-del title="Delete this person">✕</button>'}</td></tr>`; }).join('') +
        `</tbody></table></div><div class="sx-id uv-note">Admins may edit everything, so their alliance boxes are fixed. Editors see everything but may only change players of the alliances ticked here. Changes apply immediately.</div>`;
    } else {
      const lg = UV.log || [], names = Array.from(new Set(lg.map(x => x.user_name))).sort();
      const rows = lg.filter(x => !UV.uf || x.user_name === UV.uf);
      body = `<div class="uv-f"><label for="uvf">Person</label><select id="uvf"><option value="">Everybody</option>${names.map(n => `<option value="${escapeHtml(n)}"${n === UV.uf ? ' selected' : ''}>${escapeHtml(n)}</option>`).join('')}</select><span class="sx-id">${rows.length} of the last ${lg.length} entries</span></div>` +
        `<div class="ap-wrap"><table class="uv-t uv-l"><thead><tr><th>When</th><th>Who</th><th>Event</th><th>What</th></tr></thead><tbody>${rows.map(x => `<tr><td class="dim">${escapeHtml(fmtTY(x.at))}</td><td><b>${escapeHtml(x.user_name)}</b></td><td class="dim">${escapeHtml(x.event_name || '')}</td><td class="wrap">${escapeHtml(x.detail)}</td></tr>`).join('') || '<tr><td colspan="4" class="ep-empty">Nothing logged yet.</td></tr>'}</tbody></table></div><div class="sx-id uv-note">Only changes made with the new personal links are logged. Entries older than about six months are removed automatically.</div>`;
    }
    el.innerHTML = `<div class="ep-sec uv">${tabs}${body}</div>`;
  }
  function linkDialog(name, token, isNew){
    const url = location.origin + location.pathname + '?invite=' + encodeURIComponent(token);
    openModal(`<div class="ep-box sm">${mhead(isNew ? 'Link for ' + escapeHtml(name) : 'New link for ' + escapeHtml(name))}<div class="ep-mb"><div class="sx-id">Send this link to ${escapeHtml(name)}. It is the personal key: whoever has it can log in as this person. It is shown only now; if it gets lost, create a new link.</div>
      <div class="field"><input type="text" id="lku" readonly value="${escapeHtml(url)}"></div><div class="acts"><button type="button" class="btn" id="lkc">Copy link</button></div></div></div>`, m => {
      $('lku').addEventListener('focus', () => $('lku').select());
      $('lkc').addEventListener('click', () => { const t = $('lku'); t.select(); const ok = () => toast('Link copied.', true);
        try { navigator.clipboard.writeText(t.value).then(ok, () => { try { document.execCommand('copy'); ok(); } catch(x) { toast('Please copy the link by hand.'); } }); } catch(x) { try { document.execCommand('copy'); ok(); } catch(y) { toast('Please copy the link by hand.'); } } });
    });
  }
  function newUserDialog(){
    openModal(`<div class="ep-box sm">${mhead('New person')}<div class="ep-mb"><div class="field"><label for="nun">Name</label><input type="text" id="nun" maxlength="40" autocomplete="off"></div>
      <label class="ed-c"><input type="checkbox" id="nua"> Admin (may edit everything)</label>
      <div class="field"><label>Alliances this person may edit</label><div class="ed-h" id="nut">${TAGS.map(t => `<label class="ed-c"><input type="checkbox" value="${escapeHtml(t)}"> ${escapeHtml(t)}</label>`).join('')}</div></div>
      <div class="acts"><button type="button" class="btn" id="nuc">Create and show link</button></div></div></div>`, m => {
      $('nua').addEventListener('change', () => m.querySelectorAll('#nut input').forEach(i => { i.disabled = $('nua').checked; }));
      $('nuc').addEventListener('click', async () => {
        const name = $('nun').value.trim(); if(!name){ toast('Please enter a name.'); return; }
        const adm = $('nua').checked, al = adm ? [] : Array.from(m.querySelectorAll('#nut input:checked')).map(i => i.value);
        try { const r = await api.rpc('ev_user_save', {p_code: S.code, p_id: null, p_name: name, p_role: adm ? 'admin' : 'editor', p_alliances: al, p_active: true}); closeModal(); linkDialog(name, r.token, true); usersLoad(); } catch(err){ toast(err.message); }
      }); $('nun').focus();
    });
  }
  $('usersView').addEventListener('click', async e => {
    const tb = e.target.closest('[data-tab]'); if(tb){ UV.tab = tb.dataset.tab; usersLoad(); return; }
    if(e.target.closest('#uvReload')){ usersLoad(); return; }
    if(e.target.closest('#uvNew')){ newUserDialog(); return; }
    const tr = e.target.closest('tr[data-id]'); if(!tr) return;
    const u = (UV.users || []).find(x => x.id === tr.dataset.id); if(!u) return;
    if(e.target.closest('[data-link]')){
      if(!confirm('Create a new link for ' + u.name + '? The old link stops working immediately.' + (u.role === 'super' ? ' This is YOUR link: you will be logged out and need the new link.' : ''))) return;
      try { const r = await api.rpc('ev_user_token', {p_code: S.code, p_id: u.id}); linkDialog(u.name, r.token, false); if(u.role === 'super'){ setLogin(null); } } catch(err){ toast(err.message); }
      usersLoad(); return; }
    if(e.target.closest('[data-del]')){
      if(!confirm('Delete ' + u.name + '? Their link stops working. Their entries in the change log stay.')) return;
      try { await api.rpc('ev_user_delete', {p_code: S.code, p_id: u.id}); toast('Deleted.', true); } catch(err){ toast(err.message); }
      usersLoad(); }
  });
  $('usersView').addEventListener('change', async e => {
    if(e.target.id === 'uvf'){ UV.uf = e.target.value; usersRender(); return; }
    const tr = e.target.closest('tr[data-id]'); if(!tr) return;
    const u = (UV.users || []).find(x => x.id === tr.dataset.id); if(!u) return;
    const sup = u.role === 'super', adm = sup || tr.querySelector('.ua').checked;
    const role = sup ? 'super' : (adm ? 'admin' : 'editor');
    const al = (adm && u.role === 'editor') ? [] : (adm ? u.alliances : Array.from(tr.querySelectorAll('.ut:checked')).map(i => i.dataset.t));
    const name = tr.querySelector('.un').value.trim() || u.name;
    try { await api.rpc('ev_user_save', {p_code: S.code, p_id: u.id, p_name: name, p_role: role, p_alliances: al, p_active: sup ? true : tr.querySelector('.uact').checked}); toast('Saved.', true); } catch(err){ toast(err.message); }
    usersLoad();
  });
  $('usersBtn').addEventListener('click', () => { S.view = S.view === 'users' ? 'board' : 'users'; render(); if(S.view === 'users') usersLoad(); });

  // manual reload button + automatic refresh when coming back to the tab / home-screen app
  async function reloadAll(){ const b = $('refreshBtn'); b.classList.add('spin'); try { await loadPlayers(); await refresh(true); b.classList.add('ok'); setTimeout(() => b.classList.remove('ok'), 1500); } finally { b.classList.remove('spin'); } }
  $('refreshBtn').addEventListener('click', reloadAll);
  window.epSettingsApply = (k, v) => { PREFS[k] = v; if(k === 'av'){ avOn = v !== false; render(); } else if(k === 'epc'){ S.cmp = v === true; render(); } };
  document.addEventListener('visibilitychange', () => { if(!document.hidden && api){ refresh(true); if(Date.now() - plLast > 300000) loadPlayers(); } });
  window.addEventListener('pageshow', e => { if(e.persisted && api){ refresh(true); loadPlayers(); } });

  // ---- start ----
  let plLast = 0;
  function loadPlayers(){ return fetch('data/players.json', {cache: 'no-cache'}).then(r => r.ok ? r.json() : Promise.reject()).then(j => { j.alliances = j.alliances || {}; j.players = j.players || {}; const first = !D; D = j; plLast = Date.now(); if(first) last = ''; render(); }).catch(() => {}); }
  (async function(){
    if(!api){ $('sub').textContent = 'Not set up yet: enter the Supabase URL and key at the top of the script (see the setup notes).'; return; }
    const m = location.hash.match(/ev=([\w-]+)/); if(m) S.evId = m[1];
    const inv = new URLSearchParams(location.search).get('invite');
    if(inv){
      try { const r = await api.rpc('ev_login', {p_code: inv}); if(r){ setLogin(r, inv); toast('Welcome, ' + (r.name || '') + '!', true); } else toast('This link is not valid (any more). Please ask for a new one.'); } catch(e) { toast(e.message); }
      try { const u = new URL(location.href); u.searchParams.delete('invite'); history.replaceState(null, '', u.pathname + u.search + u.hash); } catch(e) {}
    } else try { const c = localStorage.getItem('ep_code'); if(c){ const r = await api.rpc('ev_login', {p_code: c}); if(r) setLogin(r, c); else setLogin(null); } } catch(e) {}
    await loadPlayers(); await refresh(true); setHash();
    setInterval(() => { if(!document.hidden && !dragPid) refresh(false); }, 10000);
    setInterval(loadPlayers, 300000);
  })();
})();
</script>
<script>
(function(){
  var KEY = 'svs646_prefs';
  var ITEMS = [
    {g: 'All pages'},
    {k: 'av', t: 'Avatars', d: 'Profile pictures next to the player names', def: true},
    {k: 'bal', t: '“Battle alliance” label', d: 'The gold label next to PKB and GYN (Roster, SvS Leaderboards)', def: true},
    {k: 'ban', t: 'Banner symbols', d: 'Gold moons and blue stars next to the alliances (Roster, SvS Leaderboards)', def: true},
    {g: 'SvS Leaderboards'},
    {k: 'dots', t: 'Phase dots', d: 'Five dots showing in which prep phases a player or alliance is listed', def: true},
    {k: 'whale', t: 'Whale mode', d: 'Joke: shows a whale instead of one player’s name (Player tab)', def: false},
    {k: 'koi', t: 'Presidents after King of Icefield', d: 'Also list them in the presidency table (Trends)', def: false},
    {g: 'Event Planner'},
    {k: 'epc', t: 'Compact team view', d: 'Smaller tiles in the teams', def: false}
  ];
  function read(){
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if(!o){ try { var m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {};
  }
  function write(o){
    var s = JSON.stringify(o);
    try { localStorage.setItem(KEY, s); } catch(e) {}
    try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
  }
  function val(o, it){
    var v = o[it.k]; if(typeof v === 'boolean') return v;
    if(it.k === 'dots'){ try { return localStorage.getItem('svs646_dots') !== '0'; } catch(e) {} }
    return it.def;
  }
  function classes(o){
    var c = document.documentElement.classList;
    c.toggle('no-bal', o.bal === false); c.toggle('no-ban', o.ban === false);
  }
  function apply(k, v){
    var o = read(); o[k] = v; write(o); classes(o);
    if(k === 'dots'){ try { localStorage.setItem('svs646_dots', v ? '1' : '0'); } catch(e) {} }
    if(typeof window.epSettingsApply === 'function') window.epSettingsApply(k, v);
  }
  var ov = null;
  function build(){
    var h = '<div class="modal-panel st-panel"><div class="modal-header"><h2 id="stTitle">Settings</h2><button type="button" class="modal-close" aria-label="Close">×</button></div><div class="st-body">';
    ITEMS.forEach(function(it){
      if(it.g){ h += '<div class="st-g">' + it.g + '</div>'; return; }
      h += '<label class="st-row"><span class="st-t"><b>' + it.t + '</b><small>' + it.d + '</small></span><span class="switch"><input type="checkbox" data-k="' + it.k + '"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>';
    });
    h += '<div class="st-foot"><span>Saved in this browser, for all pages.</span><button type="button" id="stReset">Reset all</button></div></div></div>';
    ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'stModal';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'stTitle');
    ov.innerHTML = h; document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    ov.querySelector('.modal-close').addEventListener('click', close);
    ov.addEventListener('change', function(e){ var k = e.target && e.target.getAttribute && e.target.getAttribute('data-k'); if(k) apply(k, e.target.checked); });
    ov.querySelector('#stReset').addEventListener('click', function(){
      ITEMS.forEach(function(it){ if(it.k) apply(it.k, it.def); }); sync();
    });
  }
  function sync(){
    var o = read();
    ITEMS.forEach(function(it){ if(!it.k) return; var cb = ov.querySelector('input[data-k="' + it.k + '"]'); if(cb) cb.checked = val(o, it); });
  }
  function open(){ if(!ov) build(); sync(); ov.classList.add('open'); var c = ov.querySelector('.modal-close'); if(c) c.focus(); }
  function close(){ if(ov) ov.classList.remove('open'); }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && ov && ov.classList.contains('open')) close(); });
  var b = document.getElementById('setBtn'); if(b) b.addEventListener('click', open);
  classes(read());
})();
</script>
