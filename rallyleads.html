<style>
  :root{
    --bg:#070b15;
    --bg-2:#0a0f1c;
    --panel:#0f1626;
    --panel-2:#141d33;
    --border:#1f2c47;
    --border-soft:#182236;
    --ice:#6fe3ff;
    --ice-dim:#3a8fae;
    --frost:#4f7cff;
    --gold:#ffb400;
    --silver:#9fb2cc;
    --text:#e7edf7;
    --text-dim:#8a9bbd;
    --text-faint:#5b6c8c;
    --state646:#ffb400;
    --state657:#7f8fb0;
    --good:#43e6a0;
    --danger:#ff5d73;
    --strong:#fff;
    --stk-sel:#122338;
    --hit-hover:#18233d;
    --on-ice:#00151c;
    --halo:#0f1626;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f3f6fb;
    --bg-2:#eaeff7;
    --panel:#ffffff;
    --panel-2:#eef2f9;
    --border:#cdd6e5;
    --border-soft:#e1e7f1;
    --ice:#0b7fa6;
    --ice-dim:#4f93ad;
    --frost:#3b62d9;
    --gold:#a86f00;
    --silver:#6b7d99;
    --text:#16213a;
    --text-dim:#4a5b7b;
    --text-faint:#7384a3;
    --state646:#c98600;
    --state657:#6b7d99;
    --good:#0e9a68;
    --danger:#d02e48;
    --strong:#0b1426;
    --stk-sel:#dcebf6;
    --hit-hover:#e6edf8;
    --on-ice:#ffffff;
    --halo:#ffffff;
    color-scheme:light;
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(11,127,166,0.07), transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] tbody tr:hover{background:rgba(11,127,166,0.06);}
  :root[data-theme="light"] tbody tr.row-sel{background:rgba(11,127,166,0.10);}
  :root[data-theme="light"] .sel-bar{box-shadow:0 -6px 24px rgba(20,35,70,.18);}
  :root[data-theme="light"] #tooltip{background:rgba(255,255,255,.98);box-shadow:0 12px 36px rgba(20,35,70,.22);}
  :root[data-theme="light"] .btn{background:linear-gradient(180deg, rgba(11,127,166,.14), rgba(11,127,166,.04));}
  :root[data-theme="light"] .sx-chip{background:rgba(20,35,70,.03);}
  :root[data-theme="light"] .ttq,:root[data-theme="light"] .phase-note{background:rgba(11,127,166,.05);}
  :root[data-theme="light"] .state-bar .seg.s657{background:linear-gradient(180deg,#8d9db8,#6b7d99);color:#fff;}
  :root[data-theme="light"] .switch input:checked + .switch-track{background:rgba(201,134,0,.2);}
  /* theme toggle (top right) */
  header{position:relative;}
  .theme-toggle{position:absolute;top:0;right:0;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;padding:0;}
  .theme-toggle:hover{color:var(--strong);border-color:var(--ice-dim);}
  .theme-toggle svg{width:19px;height:19px;display:block;}
  .theme-toggle .i-sun{display:none;}
  .sitenav{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;padding:5px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;font-weight:600;letter-spacing:.09em;scrollbar-width:none;}
  .sitenav::-webkit-scrollbar{display:none;}
  .sitenav > a,.sitenav > span{padding:6px 13px;border-radius:7px;color:var(--text-dim);text-decoration:none;white-space:nowrap;}
  .sitenav a:hover{color:var(--strong);background:rgba(120,140,190,.14);}
  .sitenav > .cur{color:var(--gold);background:rgba(255,180,0,.12);box-shadow:inset 0 -2px 0 var(--gold);}
  .sitenav .sn-s{display:none;}
  @media (max-width:640px){ .sitenav .sn-l{display:none;} .sitenav .sn-s{display:inline;} .sitenav > a,.sitenav > span{padding:6px 10px;} }
  .refresh-btn{right:46px;}
  .refresh-btn svg{width:18px;height:18px;}
  .refresh-btn.spin svg{animation:rfspin .8s linear infinite;}
  .refresh-btn.ok{color:#2fbf71;border-color:#2fbf71;}
  @keyframes rfspin{to{transform:rotate(360deg);}}
  :root[data-theme="light"] .theme-toggle .i-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,227,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ice-dim);
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ice-dim);display:inline-block;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  h1 span{color:var(--ice);}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}

  .divider{width:100%;height:1px;background:var(--border);margin:18px 0 26px;}

  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{
    position:relative;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--ice-dim);}
  .tab.active{
    color:var(--ice);
    background:linear-gradient(180deg, rgba(111,227,255,0.10), rgba(111,227,255,0.02));
    border-color:var(--ice);
    box-shadow:0 0 0 1px rgba(111,227,255,.15), 0 0 18px rgba(111,227,255,.12);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
  }
  select,input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    min-width:150px;
  }
  select:focus,input:focus{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    letter-spacing:.03em;
    border-radius:4px;
    cursor:pointer;
    transition:all .12s;
  }
  .seg button:hover{color:var(--text);border-color:var(--ice-dim);}
  .seg button.nodata{opacity:.5;}
  .seg button.active{
    color:var(--on-ice);
    background:var(--ice);
    border-color:var(--ice);
    font-weight:600;
  }
  .count-pill{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
  }

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--ice);}
  thead th.sorted{color:var(--ice);}
  thead th .arrow{font-size:10px;margin-left:4px;opacity:.8;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:rgba(111,227,255,0.04);}
  tbody td{padding:9px 12px;color:var(--text);}
  td.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:var(--text);}
  .namecell{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .days{display:inline-flex;gap:4px;flex:none;}
  body.nodots .days{display:none;}
  .sw-pair{display:inline-flex;align-items:center;gap:22px;align-self:flex-end;flex-wrap:wrap;}
  .sw-pair .switch{width:auto !important;align-self:center;}
  @media (max-width:640px){ .sw-pair{align-self:flex-start;} .switch.dots-sw, .switch.whale-sw, .switch.av-sw{justify-content:flex-start;align-self:flex-start;width:auto;padding:2px 0;} }
  .rt{display:inline-flex;align-items:center;gap:10px;flex:none;}
  .wins{display:inline-flex;gap:1px;align-items:center;padding:2px 8px;border:1px solid var(--border);border-radius:999px;vertical-align:middle;}
  .ws{width:14px;height:14px;display:block;}
  .nm{display:inline-flex;align-items:center;gap:6px;min-width:0;}
  .medals{display:inline-flex;gap:3px;flex:none;}
  .medal{width:17px;height:17px;display:block;}
  @media (max-width:640px){
    .namecell{flex-direction:column;align-items:flex-start;gap:5px;}
    .nm .nt{max-width:96px;overflow:hidden;text-overflow:ellipsis;}
    #tableWrap th.stk, #tableWrap td.stk{position:sticky;z-index:1;background:var(--panel);padding-left:5px;padding-right:5px;}
    #tableWrap thead th.stk{z-index:3;}
    #tableWrap tr.row-sel td.stk{background:var(--stk-sel);}
    #tableWrap td.stk.name-stk{box-shadow:1px 0 0 var(--border);}
    #tableWrap tr.rank-cutoff td{border-bottom:0;box-shadow:inset 0 -2px 0 var(--danger);}
    #tableWrap tr.rank-cutoff td.stk.name-stk{box-shadow:1px 0 0 var(--border), inset 0 -2px 0 var(--danger);}
    #tableWrap th.selcol.stk, #tableWrap td.selcol.stk{padding-left:8px;padding-right:2px;}
  }
  .dd{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-faint);box-sizing:border-box;}
  .dd.on{background:var(--ice);border-color:var(--ice);}
  .dd.na{opacity:.3;border-style:dashed;}
  td.srank{color:var(--ice-dim);}
  td.rank{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--text-dim);width:44px;}
  .row-646{border-left:2px solid var(--state646);}
  .row-646 td.name{font-weight:700;color:var(--strong);}
  .row-nb td.name{font-weight:700;color:var(--strong);}
  .row-646 td.state{color:var(--state646);font-weight:700;}
  .row-away td.state{color:var(--state657);}
  tbody tr.rank-cutoff td{border-bottom:2px solid var(--danger);}
  .tag{
    display:inline-block;
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
    font-size:11.5px;
    padding:2px 9px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  .tag.tag-c{font-weight:600;}
  .ps{display:none;}
  @media (max-width:480px){ .pf{display:none;} .ps{display:inline;} }
  .sx-vl{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;}
  .hl-sec{margin-top:24px;}
  .hl-sec h3{font-size:14px;font-weight:700;color:var(--strong);margin:0 0 3px;}
  .hl-sub{font-size:12px;color:var(--text-faint);margin:0 0 10px;line-height:1.45;}
  .hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hl-grid .sx-card{margin-top:0;}
  @media (max-width:820px){ .hl-grid{grid-template-columns:1fr;} }
  .sx-card.hl-card table{min-width:0;table-layout:auto;}
  .sx-card.hl-card th:first-child{width:auto;}
  .hl-card td.nm2{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sx-card th.ctr, .sx-card td.ctr{text-align:center;width:56px;}
  .medal-w{display:inline-block;vertical-align:middle;line-height:0;}
  .hl-nm{display:flex;align-items:center;gap:7px;min-width:0;}
  .hl-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .hl-nm .tag{flex:none;}
  .hl-up{color:var(--good);} .hl-down{color:var(--danger);}
  .hl-bars{display:flex;flex-direction:column;gap:10px;}
  .hl-bar-row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;font-size:12px;color:var(--text-dim);}
  .hl-bar-row .cseg{transition:none;}

  .phase-note{font-size:12px;color:var(--text-faint);margin:0 0 14px;padding:8px 12px;border-left:2px solid var(--ice-dim);background:rgba(111,227,255,.04);border-radius:0 4px 4px 0;}

    var yn = ['', 'yes', 'no'], sl = ['', '1', '2', '3', '4', '5'], cf = [''].concat(Array.apply(null, new Array(20)).map(function(x, i){ return String(i + 1); })), sk = ['', '0', '1', '2', '3'];

    h += '<div class="rl-grid2" id="ehand"><div class="field"><label for="enm">Name</label><input type="text" id="enm" maxlength="60" value="' + esc(p ? p.name : '') + '"></div><div class="field"><label for="etg">Alliance</label><input type="text" id="etg" maxlength="12" value="' + esc(p ? (p.tag || curTag) : '') + '"></div><div class="field"><label for="eid">Public ID <span>(optional – for avatar and power)</span></label><input type="text" id="eid" inputmode="numeric" value="' + esc(p && p.pid ? p.pid : '') + '"></div></div>';

    STATS.forEach(function(n, i){ h += '<div class="field"><label for="es' + i + '">' + n + '</label><input type="text" id="es' + i + '" inputmode="decimal" autocomplete="off" value="' + esc(p ? fmtIn(p.stats[i]) : '') + '"></div>'; });

  // ---------- picture (share) ----------
  var LIB = 'https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js';
  function loadLib(){
    if(window.htmlToImage) return Promise.resolve();
    return new Promise(function(res, rej){ var sc = document.createElement('script'); sc.src = window.__rlLib || LIB; sc.onload = res; sc.onerror = function(){ rej(new Error('lib')); }; document.head.appendChild(sc); });
  }
  // Safari/iOS: html-to-image cannot re-fetch images inside its SVG snapshot -> inline them as data URIs first
  function inlineImgs(root){
    var undo = [];
    root.querySelectorAll('img').forEach(function(im){
      try {
        if(!im.complete || !im.naturalWidth) return;
        var c = document.createElement('canvas'); c.width = im.naturalWidth; c.height = im.naturalHeight;
        c.getContext('2d').drawImage(im, 0, 0);
        var old = im.getAttribute('src'); im.removeAttribute('loading');

      } catch(e) {}
    });
    return Promise.all(undo.map(function(u){ return u[0].decode ? u[0].decode().catch(function(){}) : 0; })).then(function(){ return function(){ undo.forEach(function(u){ u[0].setAttribute('src', u[1]); }); }; });
  }
  async function shotBlob(html){
    var el = $('rlShot'); el.innerHTML = html;
    await loadLib();
    el.querySelectorAll('img').forEach(function(im){ im.removeAttribute('loading'); im.loading = 'eager'; });
    await Promise.all(Array.prototype.map.call(el.querySelectorAll('img'), function(im){ return im.complete ? 0 : new Promise(function(r){ im.addEventListener('load', r); im.addEventListener('error', function(){ setTimeout(r, 50); }); setTimeout(r, 4000); }); }));
    var bg = getComputedStyle(document.documentElement).getPropertyValue('--panel').trim() || '#0f1626';
    var opt = Object.assign({pixelRatio: 2, backgroundColor: bg, cacheBust: false, style: {position: 'static', left: '0', top: '0'}}, window.__rlOpt || {});
    var restore = await inlineImgs(el);
    try {
      if(/iP(hone|ad|od)|^((?!chrome|android|crios|edg).)*safari/i.test(navigator.userAgent)){ try { await window.htmlToImage.toBlob(el, opt); } catch(e) {} }   // Safari: first render is a warm-up
      return await window.htmlToImage.toBlob(el, opt);
    } finally { restore(); el.innerHTML = ''; }
  }
  async function doShare(btn, html, fname){
    btn.disabled = true;
    try {
      if(navigator.clipboard && window.ClipboardItem){
        try { await navigator.clipboard.write([new ClipboardItem({'image/png': shotBlob(html).then(function(b){ if(!b) throw new Error('empty'); return b; })})]); toast('Picture copied', true); return; } catch(e2) {}
      }
      var b = await shotBlob(html); if(!b) throw new Error('empty');
      var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = fname;
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('Clipboard not available – picture downloaded', true);

    finally { btn.disabled = false; }
  }
  function shotWrap(title, inner){ return '<div class="rl-shot-in"><div class="rl-stt">' + esc(title) + '</div>' + inner + '<div class="rl-sfoot">state646.com · Rally Leads</div></div>'; }
  $('shBtn').addEventListener('click', function(e){

  // ---------- Base vs Pets: does the base total (no pets) of the row player beat the pet total of the column player? ----------
  function bvTip(a, b){ return a.name + ' \u2013 Base stats: ' + pct(a.sAll) + '\n' + b.name + ' \u2013 Pet stats: ' + pct(b.pAll); }
  function bvHtml(){
    var L = P.filter(function(p){ return p.hasStats; });

    L.forEach(function(a){
      h += '<tr><td class="rl-l rl-bvn">' + esc(a.name) + '</td>';
      L.forEach(function(b){

      });

  }
  var BV_NOTE = 'Thumb up = the base stats (no pets) of the player in the row beat the pet stats (pets activated) of the player in the column.';
  $('bvBtn').addEventListener('click', function(){
    if(!P.some(function(p){ return p.hasStats; })){ toast('No stats yet.'); return; }
    openModal(mh('Base vs Pets') + '<div class="rl-fb"><div class="rl-subbar"><span class="rl-sub">' + BV_NOTE + '</span><button type="button" class="btn" id="popShare">Share pic</button></div><div class="rl-pop">' + bvHtml() + '</div></div>', 'rl-bvm', function(m){
      $('popShare').addEventListener('click', function(e){ doShare(e.currentTarget, shotWrap('Rally Leads · Base vs Pets', bvHtml() + '<div class="rl-bvnote">' + BV_NOTE + '</div>'), 'state646-rally-leads-base-vs-pets.png'); });
      m.querySelector('table.rl-bv').addEventListener('click', function(e){ var c = e.target.closest('[data-tip]'); if(c) toast(c.getAttribute('data-tip').replace('\n', '  |  ')); });
    });
  });

  // ---------- highlights and comparison (popups) ----------
  $('hlBtn').addEventListener('click', function(){
    if(!P.length){ toast('No players yet.'); return; }
    openModal(mh('Highlights') + '<div class="rl-fb"><div class="rl-subbar"><span class="rl-sub">Strongest player per row</span><button type="button" class="btn" id="popShare">Share pic</button></div><div class="rl-pop">' + highlightsHtml() + '</div></div>', 'rl-hlm', function(){
      $('popShare').addEventListener('click', function(e){ doShare(e.currentTarget, shotWrap('Rally Leads · Highlights', highlightsHtml()), 'state646-rally-leads-highlights.png'); });

  $('cmpBtn').addEventListener('click', function(){

      $('popShare').addEventListener('click', function(e){ doShare(e.currentTarget, shotWrap('Rally Leads · Compare', buildTable(L, 'cmp')), 'state646-rally-leads-compare.png'); });
    });

  // ---------- start ----------
  render();
  var saved = null; try { saved = localStorage.getItem('ep_code'); } catch(e) {}
  var lp = saved ? api.login(saved).then(function(r){ if(r) setLogin(r, saved); else setLogin(null); }).catch(function(){}) : Promise.resolve();

<script>
(function(){
  var KEY = 'svs646_prefs';
  var ITEMS = [
    {g: 'All pages'},
    {k: 'av', t: 'Avatars', d: 'Profile pictures next to the player names', def: true},
    {k: 'bal', t: '“Battle alliance” label', d: 'The gold label next to PKB and GYN (Roster, SvS Leaderboards)', def: true},
    {k: 'ban', t: 'Banner symbols', d: 'Gold moons and blue stars next to the alliances (Roster, SvS Leaderboards)', def: true},
    {g: 'SvS Leaderboards'},
    {k: 'dots', t: 'Phase dots', d: 'Five dots showing in which prep phases a player or alliance is listed', def: true},
    {k: 'whale', t: 'Whale mode', d: 'Joke: shows a whale instead of one player’s name (Player tab)', def: false},
    {k: 'koi', t: 'Presidents after King of Icefield', d: 'Also list them in the presidency table (Trends)', def: false},
    {g: 'Event Planner'},
    {k: 'epc', t: 'Compact team view', d: 'Smaller tiles in the teams', def: false}
  ];
  function read(){
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if(!o){ try { var m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {};
  }
  function write(o){
    var s = JSON.stringify(o);
    try { localStorage.setItem(KEY, s); } catch(e) {}
    try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
  }
  function val(o, it){
    var v = o[it.k]; if(typeof v === 'boolean') return v;
    if(it.k === 'dots'){ try { return localStorage.getItem('svs646_dots') !== '0'; } catch(e) {} }
    return it.def;
  }
  function classes(o){
    var c = document.documentElement.classList;
    c.toggle('no-bal', o.bal === false); c.toggle('no-ban', o.ban === false);
  }
  function apply(k, v){
    var o = read(); o[k] = v; write(o); classes(o);
    if(k === 'dots'){ try { localStorage.setItem('svs646_dots', v ? '1' : '0'); } catch(e) {} }
    if(typeof window.epSettingsApply === 'function') window.epSettingsApply(k, v);
  }
  var ov = null;
  function build(){
    var h = '<div class="modal-panel st-panel"><div class="modal-header"><h2 id="stTitle">Settings</h2><button type="button" class="modal-close" aria-label="Close">×</button></div><div class="st-body">';
    ITEMS.forEach(function(it){
      if(it.g){ h += '<div class="st-g">' + it.g + '</div>'; return; }
      h += '<label class="st-row"><span class="st-t"><b>' + it.t + '</b><small>' + it.d + '</small></span><span class="switch"><input type="checkbox" data-k="' + it.k + '"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>';
    });
    h += '<div class="st-foot"><span>Saved in this browser, for all pages.</span><button type="button" id="stReset">Reset all</button></div></div></div>';
    ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'stModal';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'stTitle');
    ov.innerHTML = h; document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    ov.querySelector('.modal-close').addEventListener('click', close);
    ov.addEventListener('change', function(e){ var k = e.target && e.target.getAttribute && e.target.getAttribute('data-k'); if(k) apply(k, e.target.checked); });
    ov.querySelector('#stReset').addEventListener('click', function(){
      ITEMS.forEach(function(it){ if(it.k) apply(it.k, it.def); }); sync();
    });
  }
  function sync(){
    var o = read();
    ITEMS.forEach(function(it){ if(!it.k) return; var cb = ov.querySelector('input[data-k="' + it.k + '"]'); if(cb) cb.checked = val(o, it); });
  }
  function open(){ if(!ov) build(); sync(); ov.classList.add('open'); var c = ov.querySelector('.modal-close'); if(c) c.focus(); }
  function close(){ if(ov) ov.classList.remove('open'); }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && ov && ov.classList.contains('open')) close(); });
  var b = document.getElementById('setBtn'); if(b) b.addEventListener('click', open);
  classes(read());
})();
</script>
