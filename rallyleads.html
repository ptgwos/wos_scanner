<style>
  :root{
    --bg:#070b15;
    --bg-2:#0a0f1c;
    --panel:#0f1626;
    --panel-2:#141d33;
    --border:#1f2c47;
    --border-soft:#182236;
    --ice:#6fe3ff;
    --ice-dim:#3a8fae;
    --frost:#4f7cff;
    --gold:#ffb400;
    --silver:#9fb2cc;
    --text:#e7edf7;
    --text-dim:#8a9bbd;
    --text-faint:#5b6c8c;
    --state646:#ffb400;
    --state657:#7f8fb0;
    --good:#43e6a0;
    --danger:#ff5d73;
    --strong:#fff;
    --stk-sel:#122338;
    --hit-hover:#18233d;
    --on-ice:#00151c;
    --halo:#0f1626;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#f3f6fb;
    --bg-2:#eaeff7;
    --panel:#ffffff;
    --panel-2:#eef2f9;
    --border:#cdd6e5;
    --border-soft:#e1e7f1;
    --ice:#0b7fa6;
    --ice-dim:#4f93ad;
    --frost:#3b62d9;
    --gold:#a86f00;
    --silver:#6b7d99;
    --text:#16213a;
    --text-dim:#4a5b7b;
    --text-faint:#7384a3;
    --state646:#c98600;
    --state657:#6b7d99;
    --good:#0e9a68;
    --danger:#d02e48;
    --strong:#0b1426;
    --stk-sel:#dcebf6;
    --hit-hover:#e6edf8;
    --on-ice:#ffffff;
    --halo:#ffffff;
    color-scheme:light;
  }
  :root[data-theme="light"] body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.10), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(11,127,166,0.07), transparent 55%),
      var(--bg);
  }
  :root[data-theme="light"] tbody tr:hover{background:rgba(11,127,166,0.06);}
  :root[data-theme="light"] tbody tr.row-sel{background:rgba(11,127,166,0.10);}
  :root[data-theme="light"] .sel-bar{box-shadow:0 -6px 24px rgba(20,35,70,.18);}
  :root[data-theme="light"] #tooltip{background:rgba(255,255,255,.98);box-shadow:0 12px 36px rgba(20,35,70,.22);}
  :root[data-theme="light"] .btn{background:linear-gradient(180deg, rgba(11,127,166,.14), rgba(11,127,166,.04));}
  :root[data-theme="light"] .sx-chip{background:rgba(20,35,70,.03);}
  :root[data-theme="light"] .ttq,:root[data-theme="light"] .phase-note{background:rgba(11,127,166,.05);}
  :root[data-theme="light"] .state-bar .seg.s657{background:linear-gradient(180deg,#8d9db8,#6b7d99);color:#fff;}
  :root[data-theme="light"] .switch input:checked + .switch-track{background:rgba(201,134,0,.2);}
  /* theme toggle (top right) */
  header{position:relative;}
  .theme-toggle{position:absolute;top:0;right:0;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text-dim);cursor:pointer;padding:0;}
  .theme-toggle:hover{color:var(--strong);border-color:var(--ice-dim);}
  .theme-toggle svg{width:19px;height:19px;display:block;}
  .theme-toggle .i-sun{display:none;}
  .sitenav{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;padding:5px;background:var(--panel-2);border:1px solid var(--border);border-radius:10px;font-size:11.5px;font-weight:600;letter-spacing:.09em;scrollbar-width:none;}
  .sitenav::-webkit-scrollbar{display:none;}
  .sitenav > a,.sitenav > span{padding:6px 13px;border-radius:7px;color:var(--text-dim);text-decoration:none;white-space:nowrap;}
  .sitenav a:hover{color:var(--strong);background:rgba(120,140,190,.14);}
  .sitenav > .cur{color:var(--gold);background:rgba(255,180,0,.12);box-shadow:inset 0 -2px 0 var(--gold);}
  .sitenav .sn-s{display:none;}
  @media (max-width:640px){ .sitenav .sn-l{display:none;} .sitenav .sn-s{display:inline;} .sitenav > a,.sitenav > span{padding:6px 10px;} }
  .refresh-btn{right:46px;}
  .refresh-btn svg{width:18px;height:18px;}
  .refresh-btn.spin svg{animation:rfspin .8s linear infinite;}
  .refresh-btn.ok{color:#2fbf71;border-color:#2fbf71;}
  @keyframes rfspin{to{transform:rotate(360deg);}}
  :root[data-theme="light"] .theme-toggle .i-sun{display:block;}
  :root[data-theme="light"] .theme-toggle .i-moon{display:none;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(79,124,255,0.14), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(111,227,255,0.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:1180px;margin:0 auto;}

  /* header */
  header{margin-bottom:28px;}
  .eyebrow{
    font-family:'Inter',sans-serif;
    font-size:12px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--ice-dim);
    display:flex;align-items:center;gap:10px;
    margin-bottom:8px;
  }
  .eyebrow::before{content:'';width:22px;height:1px;background:var(--ice-dim);display:inline-block;}
  h1{
    font-family:'Inter',sans-serif;
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    margin:0 0 6px;
    letter-spacing:.01em;
  }
  h1 span{color:var(--ice);}
  .subtitle{color:var(--text-dim);font-size:14px;margin:0;}

  .divider{width:100%;height:1px;background:var(--border);margin:18px 0 26px;}

  /* tabs */
  .tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .tab{
    position:relative;
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-dim);
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:5px;
    padding:11px 20px;
    cursor:pointer;
    transition:color .15s, border-color .15s, background .15s;
  }
  .tab:hover{color:var(--text);border-color:var(--ice-dim);}
  .tab.active{
    color:var(--ice);
    background:linear-gradient(180deg, rgba(111,227,255,0.10), rgba(111,227,255,0.02));
    border-color:var(--ice);
    box-shadow:0 0 0 1px rgba(111,227,255,.15), 0 0 18px rgba(111,227,255,.12);
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:6px;
    padding:20px;
  }

  /* controls */
  .controls{
    display:flex;
    flex-wrap:wrap;
    gap:14px;
    align-items:flex-end;
    margin-bottom:18px;
    padding-bottom:18px;
    border-bottom:1px solid var(--border-soft);
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field label{
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;
  }
  select,input[type="text"]{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 12px;
    border-radius:4px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    min-width:150px;
  }
  select:focus,input:focus{outline:2px solid var(--ice-dim);outline-offset:1px;}
  .seg{display:flex;flex-wrap:wrap;gap:6px;}
  .seg button{
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
    padding:8px 13px;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    letter-spacing:.03em;
    border-radius:4px;
    cursor:pointer;
    transition:all .12s;
  }
  .seg button:hover{color:var(--text);border-color:var(--ice-dim);}
  .seg button.nodata{opacity:.5;}
  .seg button.active{
    color:var(--on-ice);
    background:var(--ice);
    border-color:var(--ice);
    font-weight:600;
  }
  .count-pill{
    margin-left:auto;
    align-self:center;
    font-size:12px;
    color:var(--text-faint);
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
  }

  /* table */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  thead th{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:11.5px;
    letter-spacing:.07em;
    text-transform:uppercase;
    color:var(--text-faint);
    padding:10px 12px;
    border-bottom:1px solid var(--border);
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--ice);}
  thead th.sorted{color:var(--ice);}
  thead th .arrow{font-size:10px;margin-left:4px;opacity:.8;}
  tbody tr{border-bottom:1px solid var(--border-soft);}
  tbody tr:hover{background:rgba(111,227,255,0.04);}
  tbody td{padding:9px 12px;color:var(--text);}
  td.num{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;text-align:right;color:var(--text);}
  .namecell{display:flex;align-items:center;justify-content:space-between;gap:16px;}
  .days{display:inline-flex;gap:4px;flex:none;}
  body.nodots .days{display:none;}
  .sw-pair{display:inline-flex;align-items:center;gap:22px;align-self:flex-end;flex-wrap:wrap;}
  .sw-pair .switch{width:auto !important;align-self:center;}
  @media (max-width:640px){ .sw-pair{align-self:flex-start;} .switch.dots-sw, .switch.whale-sw, .switch.av-sw{justify-content:flex-start;align-self:flex-start;width:auto;padding:2px 0;} }
  .rt{display:inline-flex;align-items:center;gap:10px;flex:none;}
  .wins{display:inline-flex;gap:1px;align-items:center;padding:2px 8px;border:1px solid var(--border);border-radius:999px;vertical-align:middle;}
  .ws{width:14px;height:14px;display:block;}
  .nm{display:inline-flex;align-items:center;gap:6px;min-width:0;}
  .medals{display:inline-flex;gap:3px;flex:none;}
  .medal{width:17px;height:17px;display:block;}
  @media (max-width:640px){
    .namecell{flex-direction:column;align-items:flex-start;gap:5px;}
    .nm .nt{max-width:96px;overflow:hidden;text-overflow:ellipsis;}
    #tableWrap th.stk, #tableWrap td.stk{position:sticky;z-index:1;background:var(--panel);padding-left:5px;padding-right:5px;}
    #tableWrap thead th.stk{z-index:3;}
    #tableWrap tr.row-sel td.stk{background:var(--stk-sel);}
    #tableWrap td.stk.name-stk{box-shadow:1px 0 0 var(--border);}
    #tableWrap tr.rank-cutoff td{border-bottom:0;box-shadow:inset 0 -2px 0 var(--danger);}
    #tableWrap tr.rank-cutoff td.stk.name-stk{box-shadow:1px 0 0 var(--border), inset 0 -2px 0 var(--danger);}
    #tableWrap th.selcol.stk, #tableWrap td.selcol.stk{padding-left:8px;padding-right:2px;}
  }
  .dd{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--text-faint);box-sizing:border-box;}
  .dd.on{background:var(--ice);border-color:var(--ice);}
  .dd.na{opacity:.3;border-style:dashed;}
  td.srank{color:var(--ice-dim);}
  td.rank{font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;color:var(--text-dim);width:44px;}
  .row-646{border-left:2px solid var(--state646);}
  .row-646 td.name{font-weight:700;color:var(--strong);}
  .row-nb td.name{font-weight:700;color:var(--strong);}
  .row-646 td.state{color:var(--state646);font-weight:700;}
  .row-away td.state{color:var(--state657);}
  tbody tr.rank-cutoff td{border-bottom:2px solid var(--danger);}
  .tag{
    display:inline-block;
    font-family:'Inter',sans-serif;font-variant-numeric:tabular-nums;
    font-size:11.5px;
    padding:2px 9px;
    border-radius:999px;
    background:var(--panel-2);
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  .tag.tag-c{font-weight:600;}
  .ps{display:none;}
  @media (max-width:480px){ .pf{display:none;} .ps{display:inline;} }
  .sx-vl{font-family:'Inter',sans-serif;font-size:11px;font-weight:600;paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;}
  .hl-sec{margin-top:24px;}
  .hl-sec h3{font-size:14px;font-weight:700;color:var(--strong);margin:0 0 3px;}
  .hl-sub{font-size:12px;color:var(--text-faint);margin:0 0 10px;line-height:1.45;}
  .hl-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .hl-grid .sx-card{margin-top:0;}
  @media (max-width:820px){ .hl-grid{grid-template-columns:1fr;} }
  .sx-card.hl-card table{min-width:0;table-layout:auto;}
  .sx-card.hl-card th:first-child{width:auto;}
  .hl-card td.nm2{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sx-card th.ctr, .sx-card td.ctr{text-align:center;width:56px;}
  .medal-w{display:inline-block;vertical-align:middle;line-height:0;}
  .hl-nm{display:flex;align-items:center;gap:7px;min-width:0;}
  .hl-n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
  .hl-nm .tag{flex:none;}
  .hl-up{color:var(--good);} .hl-down{color:var(--danger);}
  .hl-bars{display:flex;flex-direction:column;gap:10px;}
  .hl-bar-row{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:center;font-size:12px;color:var(--text-dim);}
  .hl-bar-row .cseg{transition:none;}

  .phase-note{font-size:12px;color:var(--text-faint);margin:0 0 14px;padding:8px 12px;border-left:2px solid var(--ice-dim);background:rgba(111,227,255,.04);border-radius:0 4px 4px 0;}

    if(inf && inf.au) return '<img class="av" src="avatars/' + esc(p.pid) + '.webp" alt="" onerror="this.outerHTML=this.getAttribute(\'data-ph\')" data-ph="' + esc(ph) + '">';
    return ph;
  }
  window.__rlErr = function(img){
    if(img.dataset.t !== '1' && /\.webp$/.test(img.src)){ img.dataset.t = '1'; img.src = img.src.replace(/\.webp$/, '.png'); return; }
    img.style.visibility = 'hidden';
  };
  var EDIT_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
  var ed = function(){ return st.role === 'admin' || st.role === 'super'; };

  function head(){
    var h = '<thead><tr class="rl-r1"><th class="rl-l rl-ph"></th>';
    P.forEach(function(p){
      var tag = tagOf(p);
      h += '<th class="rl-ph rl-v">' + (ed() ? '<button type="button" class="rl-ed" data-e="' + esc(p.rid) + '" title="Edit ' + esc(p.name) + '" aria-label="Edit ' + esc(p.name) + '">' + EDIT_SVG + '</button>' : '') +
        (st.av || tag ? '<div class="rl-pc">' + (st.av ? avatar(p) : '') + (tag ? tagChip(tag) : '') + '</div>' : '') + '</th>';
    });
    h += '</tr><tr class="rl-r2 rl-n"><th class="rl-l"></th>';
    P.forEach(function(p){ h += '<th class="rl-nm rl-v">' + esc(p.name) + '</th>'; });
    h += '</tr><tr class="rl-pw"><th class="rl-l">Power</th>';
    P.forEach(function(p){ var inf = pinfo(p); h += '<th class="rl-v">' + (inf && inf.p != null ? Number(inf.p).toLocaleString('en-US') : '–') + '</th>'; });
    return h + '</tr></thead>';
  }
  function row(label, fn, cls, raw, vf){
    var top = null;
    if(vf){   // best value(s) of the row get a thin green frame (not when only one player has a value or all are equal)
      var vals = P.map(function(p){ var v = vf(p); return v === null || v === undefined || isNaN(v) ? null : Number(v); }).filter(function(v){ return v !== null; });
      if(vals.length > 1){ var mx = Math.max.apply(null, vals), mn = Math.min.apply(null, vals); if(mx !== mn) top = mx; }
    }
    var h = '<tr' + (cls ? ' class="' + cls + '"' : '') + '><td class="rl-l">' + (raw ? label : esc(label)) + '</td>';
    P.forEach(function(p){
      var v = top !== null && vf ? vf(p) : null, isTop = top !== null && v !== null && v !== undefined && Number(v) === top;
      h += '<td class="rl-v' + (isTop ? ' rl-top' : '') + '">' + fn(p) + '</td>';
    });
    return h + '</tr>';
  }
  function sp(){ return '<tr class="rl-sp"><td class="rl-l"></td>' + P.map(function(){ return '<td class="rl-v"></td>'; }).join('') + '</tr>'; }
  function toggle(key, text, plain){
    var o = st.open[key];
    return '<tr class="rl-tg"><td class="rl-l"><button type="button" class="rl-tgb" data-k="' + key + '" aria-expanded="' + o + '"><span class="rl-car">▶</span><span>' + (plain ? text : (o ? 'hide' : 'show') + ' ' + text) + '</span></button></td>' + P.map(function(){ return '<td class="rl-v"></td>'; }).join('') + '</tr>';
  }
  function pc(v){ return has(v) ? pct(v) : ''; }
  function pcs(v){ return v == null ? '–' : pct(v); }
  function starN(v){   // star level 1-5; older entries used yes (= 4 stars) / no
    if(!has(v)) return null;
    var s = String(v).toLowerCase(); if(s === 'yes') return 4; if(s === 'no') return null;
    var n = Math.round(Number(s)); return n >= 1 && n <= 5 ? n : null;
  }
  function stars(v){
    var n = starN(v); if(!n) return '';
    return '<span class="rl-stars" title="' + n + (n === 1 ? ' star' : ' stars') + '">' + ('<img src="' + STAR + '" alt="">').repeat(n) + '</span>';
  }
  var THUMB_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v12"/><path d="M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>';
  var THUMB_DN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V2"/><path d="M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>';
  function thumb(v){
    if(!has(v)) return '';
    var y = String(v).toLowerCase() === 'yes';
    return '<span class="rl-th ' + (y ? 'up' : 'dn') + '" role="img" aria-label="' + (y ? 'yes' : 'no') + '" title="' + (y ? 'yes' : 'no') + '">' + (y ? THUMB_UP : THUMB_DN) + '</span>';
  }
  function heroLabel(n, cls){
    return '<span class="rl-hl"><img class="rl-hi" src="heroes/' + esc(slug(n)) + '.webp" alt="" onerror="__rlErr(this)"><span>' + esc(n) + '</span></span>';
  }

  function table(){
    var h = '<table class="rl">' + head() + '<tbody>';
    h += row('Date Info Collected', function(p){ return p.date ? dstr(p.date) : ''; });
    h += toggle('stats', 'detailed stats');
    if(st.open.stats) STATS.forEach(function(n, i){ h += row(n, function(p){ return pc(p.stats[i]); }, null, false, function(p){ return p.stats[i]; }); });
    h += row('∑ all stats', function(p){ return pcs(p.sAll); }, 'rl-sum', false, function(p){ return p.sAll; });
    h += row('∑ 60/40 stats', function(p){ return pcs(p.s6040); }, 'rl-sum', false, function(p){ return p.s6040; });
    h += row('∑ 50/0/50 stats', function(p){ return pcs(p.s5050); }, 'rl-sum', false, function(p){ return p.s5050; });
    h += sp();
    h += toggle('pets', 'detailed stats (Pets)');
    if(st.open.pets) STATS.forEach(function(n, i){ h += row(n + ' (Pets)', function(p){ return pc(p.pets[i]); }, null, false, function(p){ return p.pets[i]; }); });
    h += row('∑ all stats (Pets)', function(p){ return pcs(p.pAll); }, 'rl-sum', false, function(p){ return p.pAll; });
    h += row('∑ 60/40 (Pets)', function(p){ return pcs(p.p6040); }, 'rl-sum', false, function(p){ return p.p6040; });
    h += row('∑ 50/0/50 stats (Pets)', function(p){ return pcs(p.p5050); }, 'rl-sum', false, function(p){ return p.p5050; });
    h += sp();
    h += toggle('heroes', 'Heroes', true);
    if(st.open.heroes) HEROES.forEach(function(x, i){ h += row(heroLabel(x[0], x[1]), function(p){ return stars(p.stars[i]); }, 'rl-hero', true, function(p){ return starN(p.stars[i]); }); });
    h += sp();
    h += toggle('sizes', 'March/cap size', true);
    if(st.open.sizes){
    h += row('Unbuffed march size', function(p){ return has(p.march) ? num(p.march) : ''; }, null, false, function(p){ return p.march; });
    h += row('Unbuffed cap size', function(p){ return has(p.cap) ? num(p.cap) : ''; }, null, false, function(p){ return p.cap; });
    h += row('<span class="rl-hl"><img class="rl-ti" src="' + VALIC + '" alt=""><span>CF Level</span></span>', function(p){ return has(p.val) ? num(p.val) : ''; }, null, true, function(p){ return p.val; });
    }
    h += row('SVS cap size', function(p){ return p.svs == null ? '–' : Math.round(p.svs).toLocaleString('en-US'); }, 'rl-sum', false, function(p){ return p.svs; });
    h += sp();
    h += toggle('t12', 'T12', true);
    if(st.open.t12){
    [['T12 Infantry',0],['T12 Lancers',1],['T12 Marksmen',2]].forEach(function(x){ h += row(x[0], function(p){ return thumb(p.t12[x[1]]); }); });
    [['T12 I',0,'T12 Infantry skill: Indomitable Wall'],['T12 L',1,'T12 Lancer skill: Meridian Phalanx'],['T12 M',2,'T12 Marksmen skill: Starfire']].forEach(function(x){ h += row('<span class="rl-hl" title="' + esc(x[2]) + '"><img class="rl-ti" src="' + T12IC[x[1]] + '" alt=""><span>' + esc(x[0]) + '</span></span>', function(p){ return has(p.skills[x[1]]) ? esc(p.skills[x[1]]) : ''; }, 'rl-hero', true, function(p){ return has(p.skills[x[1]]) ? Number(p.skills[x[1]]) : null; }); });
    }
    return h + '</tbody></table>';
  }

  function render(){
    var w = $('wrap'), kx = w.scrollLeft, ky = w.scrollTop;
    if(!P.length){
      w.innerHTML = '<div class="rl-empty">' + (loaded ? 'No players yet. Use “Add” to create the first one.' : 'Loading …') + '</div>';
    } else {
      w.innerHTML = table();
      var hr = w.querySelectorAll('thead tr');
      if(hr[0]) w.style.setProperty('--h1', hr[0].offsetHeight + 'px');
      if(hr[1]) w.style.setProperty('--hh', (hr[0].offsetHeight + hr[1].offsetHeight) + 'px');
    }
    w.scrollLeft = kx; w.scrollTop = ky;
    $('note').innerHTML = 'Pets add +10 % to every stat. SVS cap size = march size × 0.2 + 15,000 + 150,000 + Valeria level × 7,500 + cap size.' + (MOCK ? ' <b>Test mode: changes are not saved.</b>' : '');
    $('who').innerHTML = st.role ? esc(st.uname || st.role) + ' · <button type="button" class="rl-link" id="lout">Log out</button>' : '<button type="button" class="rl-link" id="lin">Log in</button>';
  }

  // ---------- modal helpers ----------
  function openModal(html, cls, mount){
    var m = $('rlModal'); m.innerHTML = '<div class="modal-panel ' + (cls || '') + '">' + html + '</div>'; m.classList.add('open'); if(mount) mount(m);
  }
  function closeModal(){ var m = $('rlModal'); m.classList.remove('open'); m.innerHTML = ''; }
  $('rlModal').addEventListener('mousedown', function(e){ if(e.target === this) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && $('rlModal').classList.contains('open')) closeModal(); });
  $('rlModal').addEventListener('click', function(e){ if(e.target.closest('[data-close]')) closeModal(); });
  function mh(t){ return '<div class="modal-header"><h2>' + t + '</h2><button type="button" class="modal-close" data-close aria-label="Close">×</button></div>'; }

  // ---------- login (same personal link as the Event Planner) ----------
  function setLogin(res, code){
    if(res){ st.role = res.role; st.uname = res.name || ''; st.code = code; try { localStorage.setItem('ep_code', code); } catch(e) {} }
    else { st.role = null; st.uname = ''; st.code = ''; try { localStorage.removeItem('ep_code'); } catch(e) {} }
  }
  function loginDialog(then){
    openModal(mh('Log in') + '<div class="rl-fb"><div class="field"><label for="lc">Your personal link or code</label><input type="password" id="lc" autocomplete="off" placeholder="Paste your invitation link"></div><div class="rl-acts"><button type="button" class="btn" id="lgo">Log in</button></div></div>', 'rl-sm', function(){
      function go(){
        var c = $('lc').value.trim(), mm = c.match(/invite=([^&\s#]+)/); if(mm) c = decodeURIComponent(mm[1]);
        api.login(c).then(function(r){
          if(!r){ toast('This code is not valid.'); return; }
          setLogin(r, c); closeModal(); render();
          if(!ed()){ toast('This account may not edit Rally Leads (admin needed).'); return; }
          if(then) then();
        }).catch(function(e){ toast(e.message); });
      }
      $('lgo').addEventListener('click', go); $('lc').addEventListener('keydown', function(e){ if(e.key === 'Enter') go(); }); $('lc').focus();
    });
  }

  // ---------- edit / add dialog ----------
  function fmtIn(v){ return has(v) ? (v * 100).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 3}) : ''; }
  function parseUS(s){ s = String(s == null ? '' : s).replace(/[,%\s]/g, ''); if(s === '') return null; var n = Number(s); return isFinite(n) ? n : NaN; }
  function fmtPow(n){ return n >= 1e9 ? (n / 1e9).toFixed(2) + ' B' : (n / 1e6).toFixed(0) + ' M'; }
  function sel(id, opts, cur){
    return '<select id="' + id + '">' + opts.map(function(o){ var v = Array.isArray(o) ? o[0] : o, t = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (String(cur == null ? '' : cur) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select>';
  }
  function allianceTags(){
    var t = D ? Object.keys(D.alliances) : [];
    return t.sort(function(a, b){ var pa = a === 'PKB' ? 0 : a === 'GYN' ? 1 : 2, pb = b === 'PKB' ? 0 : b === 'GYN' ? 1 : 2; return pa - pb || a.toLowerCase().localeCompare(b.toLowerCase()) || a.localeCompare(b); });
  }
  function memberOpts(tag, cur){
    if(!D || !D.alliances[tag]) return '<option value="">–</option>';
    var ids = (D.alliances[tag].m || []).filter(function(id){ return D.players[id]; }).sort(function(a, b){ return (D.players[b].p || 0) - (D.players[a].p || 0); });
    return '<option value="">– choose player –</option>' + ids.map(function(id){ var p = D.players[id]; return '<option value="' + esc(id) + '"' + (id === cur ? ' selected' : '') + '>' + esc(clean(p.n)) + '  ·  ' + fmtPow(p.p || 0) + '</option>'; }).join('');
  }

  function editDialog(rid){
    var p = rid ? P.filter(function(x){ return x.rid === rid; })[0] : null;
    if(rid && !p) return;
    var gameOk = !!D, curTag = p ? tagOf(p) : (D && D.alliances.PKB ? 'PKB' : (allianceTags()[0] || ''));
    var mode = (p && !(p.pid && D && D.players[p.pid])) ? 'hand' : (gameOk ? 'game' : 'hand');
    var today = new Date(), ds = today.getFullYear() + '-' + ('0' + (today.getMonth() + 1)).slice(-2) + '-' + ('0' + today.getDate()).slice(-2);
    var yn = ['', 'yes', 'no'], sl = ['', '1', '2', '3', '4', '5'], cf = [''].concat(Array.apply(null, new Array(20)).map(function(x, i){ return String(i + 1); })), sk = ['', '0', '1', '2', '3'];
    var h = mh(p ? 'Edit ' + esc(p.name) : 'Add player') + '<div class="rl-fb">';
    h += '<div class="rl-h">Player</div><div class="seg rl-mode" id="emode"><button type="button" data-m="game"' + (mode === 'game' ? ' class="active"' : '') + (gameOk ? '' : ' disabled') + '>From game data</button><button type="button" data-m="hand"' + (mode === 'hand' ? ' class="active"' : '') + '>Enter by hand</button></div>';
    h += '<div class="rl-grid2" id="egame"><div class="field"><label for="eal">Alliance</label>' + (gameOk ? '<select id="eal">' + allianceTags().map(function(t){ return '<option' + (t === curTag ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') + '</select>' : '<select id="eal"></select>') + '</div><div class="field"><label for="epl">Player</label><select id="epl">' + (gameOk ? memberOpts(curTag, p && p.pid) : '<option value="">–</option>') + '</select></div></div>';
    h += '<div class="rl-grid2" id="ehand"><div class="field"><label for="enm">Name</label><input type="text" id="enm" maxlength="60" value="' + esc(p ? p.name : '') + '"></div><div class="field"><label for="etg">Alliance</label><input type="text" id="etg" maxlength="12" value="' + esc(p ? (p.tag || curTag) : '') + '"></div><div class="field"><label for="eid">Public ID <span>(optional – for avatar and power)</span></label><input type="text" id="eid" inputmode="numeric" value="' + esc(p && p.pid ? p.pid : '') + '"></div></div>';
    h += '<div class="rl-h">Stats <span>(as shown in the game, e.g. 3,216.00)</span></div><div class="rl-grid2"><div class="field"><label for="edt">Date info collected</label><input type="date" id="edt" value="' + esc(p && p.date ? p.date : ds) + '"></div></div><div class="rl-grid4">';
    STATS.forEach(function(n, i){ h += '<div class="field"><label for="es' + i + '">' + n + '</label><input type="text" id="es' + i + '" inputmode="decimal" autocomplete="off" value="' + esc(p ? fmtIn(p.stats[i]) : '') + '"></div>'; });
    h += '</div><div class="rl-h">Heroes <span>(star level)</span></div><div class="rl-grid3">';
    HEROES.forEach(function(x, i){ h += '<div class="field"><label for="eh' + i + '">' + x[0] + ' (' + x[1] + ')</label>' + sel('eh' + i, sl, p && starN(p.stars[i])) + '</div>'; });
    h += '</div><div class="rl-h">Sizes</div><div class="rl-grid3"><div class="field"><label for="em">Unbuffed march size</label><input type="text" id="em" inputmode="numeric" value="' + esc(p && has(p.march) ? p.march.toLocaleString('en-US') : '') + '"></div><div class="field"><label for="ec">Unbuffed cap size</label><input type="text" id="ec" inputmode="numeric" value="' + esc(p && has(p.cap) ? p.cap.toLocaleString('en-US') : '') + '"></div><div class="field"><label for="ev">Valeria Crushing Force level</label>' + sel('ev', cf, p && has(p.val) ? p.val : '') + '</div></div>';
    h += '<div class="rl-h">T12</div><div class="rl-grid3">';
    ['Infantry', 'Lancers', 'Marksmen'].forEach(function(n, i){ h += '<div class="field"><label for="et' + i + '">T12 ' + n + '</label>' + sel('et' + i, yn, p && p.t12[i]) + '</div>'; });
    h += '</div><div class="rl-h">T12 skills <span>(level 0-3)</span></div><div class="rl-grid3">';
    ['Infantry', 'Lancer', 'Marksman'].forEach(function(n, i){ h += '<div class="field"><label for="ek' + i + '" class="rl-il"><img class="rl-ti" src="' + T12IC[i] + '" alt="">' + n + '</label>' + sel('ek' + i, sk, p && p.skills[i]) + '</div>'; });
    h += '</div><div class="rl-acts">' + (p ? '<button type="button" class="btn danger" id="edel">Delete</button>' : '') + '<span class="rl-sp1"></span><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn" id="esv">Save</button></div></div>';
    openModal(h, 'rl-ep', function(m){
      var cur = mode;
      function showMode(){ $('egame').style.display = cur === 'game' ? '' : 'none'; $('ehand').style.display = cur === 'hand' ? '' : 'none'; Array.prototype.forEach.call($('emode').querySelectorAll('button'), function(b){ b.classList.toggle('active', b.getAttribute('data-m') === cur); }); }
      showMode();
      $('emode').addEventListener('click', function(e){ var b = e.target.closest('button[data-m]'); if(!b || b.disabled) return; cur = b.getAttribute('data-m'); showMode(); });
      if($('eal')) $('eal').addEventListener('change', function(){ $('epl').innerHTML = memberOpts(this.value, null); });
      $('esv').addEventListener('click', function(){
        var pid = null, name = '', tag = '';
        if(cur === 'game'){
          pid = $('epl').value; if(!pid){ toast('Please choose a player.'); return; }
          name = clean(D.players[pid].n); tag = $('eal').value;
        } else {
          name = $('enm').value.trim(); tag = $('etg').value.trim(); pid = $('eid').value.trim() || null;
          if(!name){ toast('Please enter a name.'); return; }
          if(pid && !/^\d{1,20}$/.test(pid)){ toast('The public ID must be a number.'); return; }
        }
        var stats = [], bad = null;
        STATS.forEach(function(n, i){ var v = parseUS($('es' + i).value); if(v !== null && isNaN(v)) bad = n; stats.push(v === null || isNaN(v) ? null : Math.round(v * 10000) / 1000000); });
        if(bad){ toast('“' + bad + '” is not a number.'); return; }
        function intF(id, label){ var v = parseUS($(id).value); if(v !== null && (isNaN(v) || v < 0)){ bad = label; return null; } return v; }
        var march = intF('em', 'march size'), cap = intF('ec', 'cap size'), val = intF('ev', 'Valeria level');
        if(bad){ toast('“' + bad + '” is not a valid number.'); return; }
        function pick(prefix, n, asNum){ var a = []; for(var i = 0; i < n; i++){ var v = $(prefix + i).value; a.push(v === '' ? null : (asNum ? Number(v) : v)); } return a; }
        var data = {date: $('edt').value || null, stats: stats, stars: pick('eh', 3, true), march: march, cap: cap, val: val, t12: pick('et', 3), skills: pick('ek', 3, true)};
        $('esv').disabled = true;
        api.save({p_code: st.code, p_id: p ? p.rid : null, p_pid: pid, p_name: name, p_tag: tag || null, p_data: data}).then(function(){ closeModal(); toast(MOCK ? 'Saved (test mode, not stored).' : 'Saved.', true); return loadRows(); }).catch(function(e){
          $('esv').disabled = false; toast(e.message);
          if(/Not allowed/i.test(e.message)){ setLogin(null); render(); }
        });
      });
      if($('edel')){
        var armed = false, t = null;
        $('edel').addEventListener('click', function(){
          if(!armed){ armed = true; this.textContent = 'Really delete?'; t = setTimeout(function(){ armed = false; $('edel').textContent = 'Delete'; }, 4000); return; }
          clearTimeout(t);
          api.del({p_code: st.code, p_id: p.rid}).then(function(){ closeModal(); toast('Deleted.', true); return loadRows(); }).catch(function(e){ toast(e.message); });
        });
      }
    });
  }

  // ---------- events ----------
  $('wrap').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]');
    if(b){
      var k = b.getAttribute('data-k'); st.open[k] = !st.open[k];
      try { localStorage.setItem('rl646_open', JSON.stringify(st.open)); } catch(e2) {}
      render(); var nb = document.querySelector('button[data-k="' + k + '"]'); if(nb) nb.focus(); return;
    }
    var eb = e.target.closest('button[data-e]'); if(eb) editDialog(eb.getAttribute('data-e'));
  });
  $('addBtn').addEventListener('click', function(){ if(ed()) editDialog(null); else loginDialog(function(){ editDialog(null); }); });
  $('who').addEventListener('click', function(e){
    if(e.target.id === 'lin') loginDialog();
    if(e.target.id === 'lout'){ setLogin(null); render(); }
  });
  window.epSettingsApply = function(k, v){ PREFS[k] = v; if(k === 'av'){ st.av = v !== false; render(); } };
  document.addEventListener('visibilitychange', function(){ if(!document.hidden && !$('rlModal').classList.contains('open')){ loadPlayers(); loadRows(); } });

  // ---------- start ----------
  render();
  var saved = null; try { saved = localStorage.getItem('ep_code'); } catch(e) {}
  var lp = saved ? api.login(saved).then(function(r){ if(r) setLogin(r, saved); else setLogin(null); }).catch(function(){}) : Promise.resolve();
  lp.then(function(){ render(); });
  loadRows(); loadPlayers();
})();
</script>

<script>
(function(){
  var KEY = 'svs646_prefs';
  var ITEMS = [
    {g: 'All pages'},
    {k: 'av', t: 'Avatars', d: 'Profile pictures next to the player names', def: true},
    {k: 'bal', t: '“Battle alliance” label', d: 'The gold label next to PKB and GYN (Roster, SvS Leaderboards)', def: true},
    {k: 'ban', t: 'Banner symbols', d: 'Gold moons and blue stars next to the alliances (Roster, SvS Leaderboards)', def: true},
    {g: 'SvS Leaderboards'},
    {k: 'dots', t: 'Phase dots', d: 'Five dots showing in which prep phases a player or alliance is listed', def: true},
    {k: 'whale', t: 'Whale mode', d: 'Joke: shows a whale instead of one player’s name (Player tab)', def: false},
    {k: 'koi', t: 'Presidents after King of Icefield', d: 'Also list them in the presidency table (Trends)', def: false},
    {g: 'Event Planner'},
    {k: 'epc', t: 'Compact team view', d: 'Smaller tiles in the teams', def: false}
  ];
  function read(){
    var o = null;
    try { o = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if(!o){ try { var m = document.cookie.match(/(?:^|; )svs646_prefs=([^;]*)/); if(m) o = JSON.parse(decodeURIComponent(m[1])); } catch(e) {} }
    return (o && typeof o === 'object') ? o : {};
  }
  function write(o){
    var s = JSON.stringify(o);
    try { localStorage.setItem(KEY, s); } catch(e) {}
    try { document.cookie = 'svs646_prefs=' + encodeURIComponent(s) + '; max-age=31536000; path=/; SameSite=Lax'; } catch(e) {}
  }
  function val(o, it){
    var v = o[it.k]; if(typeof v === 'boolean') return v;
    if(it.k === 'dots'){ try { return localStorage.getItem('svs646_dots') !== '0'; } catch(e) {} }
    return it.def;
  }
  function classes(o){
    var c = document.documentElement.classList;
    c.toggle('no-bal', o.bal === false); c.toggle('no-ban', o.ban === false);
  }
  function apply(k, v){
    var o = read(); o[k] = v; write(o); classes(o);
    if(k === 'dots'){ try { localStorage.setItem('svs646_dots', v ? '1' : '0'); } catch(e) {} }
    if(typeof window.epSettingsApply === 'function') window.epSettingsApply(k, v);
  }
  var ov = null;
  function build(){
    var h = '<div class="modal-panel st-panel"><div class="modal-header"><h2 id="stTitle">Settings</h2><button type="button" class="modal-close" aria-label="Close">×</button></div><div class="st-body">';
    ITEMS.forEach(function(it){
      if(it.g){ h += '<div class="st-g">' + it.g + '</div>'; return; }
      h += '<label class="st-row"><span class="st-t"><b>' + it.t + '</b><small>' + it.d + '</small></span><span class="switch"><input type="checkbox" data-k="' + it.k + '"><span class="switch-track"><span class="switch-thumb"></span></span></span></label>';
    });
    h += '<div class="st-foot"><span>Saved in this browser, for all pages.</span><button type="button" id="stReset">Reset all</button></div></div></div>';
    ov = document.createElement('div'); ov.className = 'modal-overlay'; ov.id = 'stModal';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'stTitle');
    ov.innerHTML = h; document.body.appendChild(ov);
    ov.addEventListener('click', function(e){ if(e.target === ov) close(); });
    ov.querySelector('.modal-close').addEventListener('click', close);
    ov.addEventListener('change', function(e){ var k = e.target && e.target.getAttribute && e.target.getAttribute('data-k'); if(k) apply(k, e.target.checked); });
    ov.querySelector('#stReset').addEventListener('click', function(){
      ITEMS.forEach(function(it){ if(it.k) apply(it.k, it.def); }); sync();
    });
  }
  function sync(){
    var o = read();
    ITEMS.forEach(function(it){ if(!it.k) return; var cb = ov.querySelector('input[data-k="' + it.k + '"]'); if(cb) cb.checked = val(o, it); });
  }
  function open(){ if(!ov) build(); sync(); ov.classList.add('open'); var c = ov.querySelector('.modal-close'); if(c) c.focus(); }
  function close(){ if(ov) ov.classList.remove('open'); }
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && ov && ov.classList.contains('open')) close(); });
  var b = document.getElementById('setBtn'); if(b) b.addEventListener('click', open);
  classes(read());
})();
</script>
</body>
