<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>State 646 - Leaderboards</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{--bg:#0d0f14;--bg2:#161920;--bg3:#1e2230;--border:#2a2d3e;--text:#e8eaf0;--muted:#8890a6;--accent:#4f8ef7;--amber:#fbbf24;--purple:#a78bfa;--red:#f87171}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.back-link{color:var(--muted);text-decoration:none;display:flex;align-items:center;gap:5px;font-size:13px}
.back-link:hover{color:var(--text)}
.header-divider{color:var(--border);font-size:18px}
h1{font-size:1.1rem;font-weight:600;display:flex;align-items:center;gap:8px}
h1 i{color:var(--amber)}
.meta{font-size:12px;color:var(--muted);margin-left:auto}
.main{max-width:900px;margin:0 auto;padding:2rem}
.intro{font-size:13px;color:var(--muted);margin-bottom:1.75rem}
.group-block{margin-bottom:1.75rem}
.group-header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.group-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);white-space:nowrap}
.group-line{flex:1;height:1px;background:var(--border)}
.lock-btn{font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid rgba(167,139,250,.3);background:rgba(167,139,250,.08);color:var(--purple);cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:.9rem 1.1rem;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;transition:border .12s,background .12s}
.card:hover{border-color:var(--accent);background:var(--bg3)}
.card-icon{width:32px;height:32px;border-radius:7px;background:rgba(79,142,247,.12);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon i{font-size:17px;color:var(--accent)}
.card-body{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-arrow{font-size:15px;color:var(--muted);flex-shrink:0;margin-left:auto;transition:color .12s}
.card:hover .card-arrow{color:var(--accent)}
.lock-gate{background:var(--bg2);border:1px solid rgba(167,139,250,.25);border-radius:10px;padding:1.5rem;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.lock-gate i.li{font-size:32px;color:var(--purple)}
.lock-gate p{font-size:13px;color:var(--muted)}
.lg-row{display:flex;gap:8px;width:100%;max-width:320px}
.lg-row input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-size:13px;outline:none}
.lg-row input:focus{border-color:var(--purple)}
.lg-btn{font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid rgba(167,139,250,.4);background:rgba(167,139,250,.1);color:var(--purple);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.lg-err{font-size:12px;color:var(--red);display:none}
.lg-err.show{display:block}
</style>
</head>
<body>
<header>
  <a class="back-link" href="index.html"><i class="ti ti-arrow-left"></i> Home</a>
  <span class="header-divider">/</span>
  <h1><i class="ti ti-trophy"></i> State 646 - Leaderboards</h1>
  <span class="meta">Updated: 14/06/2026, 14:50</span>
</header>
<div class="main">
  <p class="intro">3 leaderboards available</p>
  <div class="group-block">
  <div class="group-header">
    <i class="ti ti-folder" style="font-size:15px;color:var(--amber)"></i>
    <span class="group-label">Kings of Icefield</span>
    
    <div class="group-line"></div>
  </div>
  <div class="grid"><a class="card" href="https://ptgwos.github.io/wos_scanner/KOI_WEEK23_2026.html" target="_blank">
  <div class="card-icon"><i class="ti ti-table"></i></div>
  <div class="card-body"><div class="card-title">KOI - WEEK 23/2026</div></div>
  <i class="ti ti-arrow-right card-arrow"></i>
</a></div>
</div>
<div class="group-block">
  <div class="group-header">
    <i class="ti ti-lock" style="font-size:15px;color:var(--purple)"></i>
    <span class="group-label">TBR</span>
    <button class="lock-btn" id="grp_TBR_lockbtn" onclick="relock('grp_TBR')" style="display:none"><i class="ti ti-lock"></i> Lock</button>
    <div class="group-line"></div>
  </div>
  <div class="lock-gate" id="grp_TBR_gate">
  <i class="ti ti-lock li"></i>
  <p>This group is password-protected.</p>
  <div class="lg-row">
    <input type="password" id="grp_TBR_inp" placeholder="Enter password…">
    <button class="lg-btn" onclick="tryUnlock('TBR','grp_TBR')"><i class="ti ti-arrow-right"></i> Unlock</button>
  </div>
  <span class="lg-err" id="grp_TBR_err">Wrong password.</span>
</div>
<div class="grid" id="grp_TBR_cards" style="display:none"><a class="card" href="https://ptgwos.github.io/wos_scanner/CC_L1_13062026.html" target="_blank">
  <div class="card-icon"><i class="ti ti-table"></i></div>
  <div class="card-body"><div class="card-title">CANYON CLASH - 06/13/26</div><div class="card-sub">Legion 1</div><div class="card-sub">06/13/2026</div></div>
  <i class="ti ti-arrow-right card-arrow"></i>
</a></div>
</div>
<div class="group-block">
  <div class="group-header">
    <i class="ti ti-folder" style="font-size:15px;color:var(--amber)"></i>
    <span class="group-label">Special Events</span>
    
    <div class="group-line"></div>
  </div>
  <div class="grid"><a class="card" href="https://ptgwos.github.io/wos_scanner/Party_Expert.html" target="_blank">
  <div class="card-icon"><i class="ti ti-table"></i></div>
  <div class="card-body"><div class="card-title">Party Expert</div><div class="card-sub">Childhood Memorial Festival</div></div>
  <i class="ti ti-arrow-right card-arrow"></i>
</a></div>
</div>

</div>

<script id="pw-handler">
(function(){
  var PW = JSON.parse(atob('eyJUQlIiOiIxZGRiOWQ0N2ZlYmU3MWE5YWRkZjk4YmE4OTNkZWZlMjRmNWRiZjI4YjE2MzFkNTA0Nzk1YmI3NDZhZjVkMTAwIn0='));
  async function sha256(s){
    var b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
    return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('');
  }
  window.tryUnlock = async function(gName, gId) {
    var inp = document.getElementById(gId+'_inp');
    var h = await sha256(inp.value);
    if (h === PW[gName]) {
      document.getElementById(gId+'_gate').style.display = 'none';
      document.getElementById(gId+'_cards').style.display = '';
      var lb = document.getElementById(gId+'_lockbtn');
      if (lb) lb.style.display = 'inline-flex';
    } else {
      document.getElementById(gId+'_err').classList.add('show');
      inp.select();
    }
  };
  window.relock = function(gId) {
    document.getElementById(gId+'_gate').style.display = '';
    document.getElementById(gId+'_cards').style.display = 'none';
    var lb = document.getElementById(gId+'_lockbtn');
    if (lb) lb.style.display = 'none';
    document.getElementById(gId+'_inp').value = '';
    document.getElementById(gId+'_err').classList.remove('show');
  };
  document.querySelectorAll('.lg-row input').forEach(function(inp){
    inp.addEventListener('keydown', function(e){
      if (e.key === 'Enter') {
        var gId = inp.id.replace('_inp','');
        var gName = inp.closest('.lock-gate').nextElementSibling.closest('[id]')?.id?.replace('_cards','') || '';
        // find group name from gate id
        document.querySelector('[onclick*="'+gId+'"]')?.click();
      }
    });
  });
})();
</script>
</body>
</html>
